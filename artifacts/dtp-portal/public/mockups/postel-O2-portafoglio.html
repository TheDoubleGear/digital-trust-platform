<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Portafoglio clienti e contratti – Dashboard Operativa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;family=IBM+Plex+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F3F7FC}
*{box-sizing:border-box}
a{color:#0047BB}a:hover{color:#003A99}
</style>
<link rel="stylesheet" href="dtp-theme.css">
<link rel="icon" type="image/svg+xml" href="../favicon.svg">
<link rel="stylesheet" href="dtp-auth.css">
<script src="dtp-auth.js"></script>
<script src="dtp-catalogo.js"></script>
<script src="dtp-modifiche.js"></script>
<script src="dtp-subentro.js"></script>
</head>
<body>
<div id="app"></div>
<template id="tpl">

<div class="dtp-root" style="min-height: 100dvh; display: flex; flex-wrap: wrap; background: #F3F7FC; font-family: 'Inter', system-ui, sans-serif; color: #1A1C1E; font-variant-numeric: tabular-nums">

<div class="dtp-projectbar" style="flex: 1 1 100%; background: #F2F8FF; color: #1A1C1E; border-bottom: 1px solid #D9E1EC">
<div style="padding: 8px 32px; display: flex; flex-wrap: wrap; align-items: center; gap: 12px">
<a class="dtp-home" href="../workspace" title="Torna a Workspace / 2026" data-testid="link-home">Home</a>
<span class="dtp-session"><span class="dtp-session-tag">Accesso demo</span><span class="dtp-session-who" data-testid="text-current-role"><span data-dtp-role></span></span><button class="dtp-logout" type="button" data-dtp-logout data-testid="button-logout">Esci</button></span>
</div>
</div>

<nav class="dtp-sidenav" aria-label="Navigazione principale" style="flex: 1 1 240px; max-width: 100%; background: #0047BB; color: #FFFFFF; padding: 20px 14px; display: flex; flex-direction: column; gap: 22px">
<div style="display: flex; align-items: center; gap: 10px; padding: 0 8px">
<svg width="32" height="32" viewBox="0 0 34 34" aria-hidden="true"><rect width="34" height="34" rx="9" fill="#FFEC00"></rect><path d="M17 7l8 3v6c0 5-3.4 8.6-8 10-4.6-1.4-8-5-8-10v-6z" fill="none" stroke="#0047BB" stroke-width="2" stroke-linejoin="round"></path><path d="M13 16.5l3 3 5-5.5" fill="none" stroke="#0047BB" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg>
<div>
<div style="font-weight: 700; font-size: 17px; line-height: 1.1">postel</div>
<div style="font-size: 11px; color: #DCE8FF">Console operativa DTP</div>
</div>
</div>
<div style="display: flex; flex-direction: column; gap: 2px">
<sc-for list="{{nav}}" as="n" hint-placeholder-count="5">
<a class="dtp-sidelink" href="{{n.href}}" aria-current="{{n.current}}" style="min-height: 44px; display: flex; align-items: center; gap: 10px; padding: 0 12px; border-radius: 6px; background: {{n.bg}}; color: {{n.fg}}; font-size: 14px; font-weight: {{n.weight}}; text-decoration: none"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{n.icon}}"></path></svg>{{n.label}}</a>
</sc-for>
</div>
<div style="display: flex; flex-direction: column; gap: 2px; padding-top: 14px; border-top: 1px solid #3B74D6">
<span style="font-size: 11px; color: #C8DAFB; text-transform: uppercase; letter-spacing: 0.06em; padding: 0 12px 6px; font-weight: 600">Sistemi collegati</span>
<sc-for list="{{ext}}" as="e" hint-placeholder-count="1">
<a class="dtp-sidelink" href="#{{e.id}}" style="min-height: 44px; display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 0 12px; border-radius: 6px; color: #FFFFFF; font-size: 14px; font-weight: 500; text-decoration: none">{{e.label}}<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17 17 7M8 7h9v9"></path></svg></a>
</sc-for>
</div>
<div style="margin-top: auto; padding: 12px; border-radius: 6px; background: #003A99; display: flex; flex-direction: column; gap: 4px">
<span style="font-size: 14px; font-weight: 600">{{who.name}}</span>
<span style="font-size: 12px; color: #DCE8FF">{{who.role}}</span>
</div>
</nav>

<main class="dtp-main" style="flex: 999 1 560px; min-width: 0; padding: 24px 32px 48px; display: flex; flex-direction: column; gap: 20px">

<div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 12px">
<div>
<h1 style="margin: 0; font-size: 26px; font-weight: 600; letter-spacing: -0.01em">Portafoglio clienti e contratti</h1>
<p style="margin: 4px 0 0; font-size: 13px; color: #4D5762">148 clienti attivi · segmenti calcolati ogni notte su ritmo di consumo e data stimata di esaurimento</p>
</div>
<button class="dtp-btn dtp-btn-p" type="button" style="min-height: 44px; padding: 0 20px; border-radius: 999px; border: 0; background: #0047BB; font: inherit; font-size: 14px; font-weight: 600; color: #FFFFFF; cursor: pointer">{{exportLabel}}</button>
</div>

<form aria-label="Filtri" style="display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-end; padding: 14px; border-radius: 6px; background: #FFFFFF; border: 1px solid #D9E1EC">
<sc-for list="{{filters}}" as="f" hint-placeholder-count="7">
<label style="display: flex; flex-direction: column; gap: 4px; font-size: 11px; color: #4D5762; font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em">{{f.label}}
<select style="min-height: 40px; min-width: 140px; padding: 0 10px; border-radius: 6px; border: 1px solid #B8C2CF; background: #FFFFFF; font: inherit; font-size: 13px; font-weight: 500; text-transform: none; letter-spacing: 0; color: #1A1C1E"><option>{{f.value}}</option></select>
</label>
</sc-for>
<button class="dtp-btn dtp-btn-t" type="reset" style="min-height: 40px; padding: 0 16px; border-radius: 999px; border: 0; background: transparent; font: inherit; font-size: 13px; font-weight: 600; color: #0047BB; cursor: pointer">Reimposta</button>
</form>

<section aria-label="Segmenti di portafoglio" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px">
<sc-for list="{{segments}}" as="s" hint-placeholder-count="4">
<button class="dtp-card dtp-cardbtn" type="button" style="text-align: left; font: inherit; color: #1A1C1E; cursor: pointer; background: #FFFFFF; border: 1px solid #D9E1EC; border-top: 4px solid {{s.color}}; border-radius: 6px; padding: 16px 18px; display: flex; flex-direction: column; gap: 6px">
<span style="font-size: 13px; font-weight: 600; color: {{s.text}}">{{s.name}}</span>
<span style="font-size: 26px; font-weight: 600; letter-spacing: -0.02em">{{s.n}} <span style="font-size: 14px; font-weight: 500; color: #4D5762">clienti{{s.arrText}}</span></span>
<span style="font-size: 12px; color: #4D5762; line-height: 1.4">{{s.rule}}</span>
</button>
</sc-for>
</section>

<div style="display: flex; flex-wrap: wrap; gap: 16px">
<section class="dtp-card" aria-labelledby="titolo-matrice" style="flex: 999 1 560px; min-width: 0; background: #FFFFFF; border: 1px solid #D9E1EC; border-radius: 6px; padding: 24px; display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; flex-wrap: wrap; justify-content: space-between; gap: 12px">
<div>
<h2 id="titolo-matrice" style="margin: 0; font-size: 18px; font-weight: 600">46 clienti consumano più in fretta del loro contratto</h2>
<p style="margin: 4px 0 0; font-size: 13px; color: #4D5762">Ogni punto è un cliente: % consumata del servizio più usato rispetto alla % di periodo contrattuale trascorsa</p>
</div>
<div style="display: flex; flex-wrap: wrap; gap: 12px; font-size: 12px; align-items: center">
<sc-for list="{{segments}}" as="s" hint-placeholder-count="4">
<span style="display: flex; align-items: center; gap: 6px"><span style="width: 10px; height: 10px; border-radius: 5px; background: {{s.color}}"></span>{{s.name}}</span>
</sc-for>
</div>
</div>
<svg viewBox="0 0 640 430" width="100%" role="img" aria-label="Matrice consumo per tempo trascorso: 15 clienti in overage, 31 in zona upsell, 74 in linea, 28 sotto-utilizzo" style="display: block; font-family: inherit; max-height: 520px">
<rect x="56" y="{{m.y130}}" width="560" height="{{m.overH}}" fill="#FBE3E1" opacity="0.6"></rect>
<path d="{{m.upZone}}" fill="#FDE7DC" opacity="0.6"></path>
<path d="{{m.lowZone}}" fill="#E5EFFF" opacity="0.7"></path>
<line x1="56" x2="616" y1="{{m.y100}}" y2="{{m.y100}}" stroke="#C7322A" stroke-width="1.2"></line>
<line x1="56" x2="616" y1="{{m.y50}}" y2="{{m.y50}}" stroke="#EAEFF5"></line>
<path d="{{m.diag}}" fill="none" stroke="#8792A6" stroke-width="1.2" stroke-dasharray="5 4"></path>
<text x="50" y="{{m.y125t}}" text-anchor="end" font-size="11" fill="#4D5762">125%</text>
<text x="50" y="{{m.y100t}}" text-anchor="end" font-size="11" fill="#4D5762">100%</text>
<text x="50" y="{{m.y75t}}" text-anchor="end" font-size="11" fill="#4D5762">75%</text>
<text x="50" y="{{m.y50t}}" text-anchor="end" font-size="11" fill="#4D5762">50%</text>
<text x="50" y="{{m.y25t}}" text-anchor="end" font-size="11" fill="#4D5762">25%</text>
<text x="50" y="384" text-anchor="end" font-size="11" fill="#4D5762">0</text>
<line x1="56" x2="616" y1="380" y2="380" stroke="#B8C2CF"></line>
<text x="56" y="398" text-anchor="middle" font-size="11" fill="#4D5762">0%</text>
<text x="196" y="398" text-anchor="middle" font-size="11" fill="#4D5762">25%</text>
<text x="336" y="398" text-anchor="middle" font-size="11" fill="#4D5762">50%</text>
<text x="476" y="398" text-anchor="middle" font-size="11" fill="#4D5762">75%</text>
<text x="616" y="398" text-anchor="middle" font-size="11" fill="#4D5762">100%</text>
<text x="336" y="422" text-anchor="middle" font-size="12" fill="#1A1C1E" font-weight="500">% di periodo contrattuale trascorsa</text>
<text x="64" y="{{m.lblOverY}}" font-size="12" font-weight="700" fill="#A3201A">Overage · oltre la quantità inclusa</text>
<text x="64" y="{{m.lblUpY}}" font-size="12" font-weight="700" fill="#B03A0B">Upsell · ritmo oltre 1,2</text>
<text x="606" y="368" text-anchor="end" font-size="12" font-weight="700" fill="#0047BB">Sotto-utilizzo · ritmo sotto 0,6</text>
<path d="{{m.pIn}}" fill="#8792A6" fill-opacity="0.75"></path>
<path d="{{m.pLow}}" fill="#0047BB" fill-opacity="0.85"></path>
<path d="{{m.pUp}}" fill="#E8692A" fill-opacity="0.9"></path>
<path d="{{m.pOver}}" fill="#C7322A" fill-opacity="0.9"></path>
<circle cx="{{m.aurX}}" cy="{{m.aurY}}" r="9" fill="none" stroke="#1A1C1E" stroke-width="2"></circle>
<circle cx="{{m.aurX}}" cy="{{m.aurY}}" r="5" fill="#C7322A"></circle>
<text x="{{m.aurLx}}" y="{{m.aurLy}}" font-size="12" font-weight="600" fill="#1A1C1E" stroke="#FFFFFF" stroke-width="4" stroke-linejoin="round" paint-order="stroke">Assicurazioni Aurora</text>
</svg>
</section>

<sc-if value="{{money}}" hint-placeholder-val="{{ true }}">
<section class="dtp-card" aria-labelledby="titolo-movimenti" style="flex: 1 1 340px; background: #FFFFFF; border: 1px solid #D9E1EC; border-radius: 6px; padding: 24px; display: flex; flex-direction: column; gap: 16px">
<div>
<h2 id="titolo-movimenti" style="margin: 0; font-size: 18px; font-weight: 600">Movimenti dell'ARR da inizio anno</h2>
<p style="margin: 4px 0 0; font-size: 13px; color: #4D5762">Da € 3,84 M al 1 gen a € 4,15 M oggi (+€ 304k)</p>
</div>
<ul style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 14px">
<sc-for list="{{moves}}" as="mv" hint-placeholder-count="4">
<li style="display: flex; flex-direction: column; gap: 6px">
<div style="display: flex; justify-content: space-between; font-size: 14px; gap: 8px"><span>{{mv.name}} <span style="color: #4D5762">· {{mv.n}}</span></span><strong style="font-weight: 600; color: {{mv.textColor}}">{{mv.v}}</strong></div>
<div style="display: grid; grid-template-columns: 1fr 1fr; height: 12px">
<div style="display: flex; justify-content: flex-end; border-right: 1px solid #8792A6"><div style="width: {{mv.negW}}; height: 12px; background: #E8692A; border-radius: 3px 0 0 3px"></div></div>
<div style="display: flex"><div style="width: {{mv.posW}}; height: 12px; background: #0047BB; border-radius: 0 3px 3px 0"></div></div>
</div>
</li>
</sc-for>
</ul>
<dl style="margin: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; padding-top: 14px; border-top: 1px solid #EAEFF5">
<div><dt style="font-size: 12px; color: #4D5762">Net revenue retention canoni YTD</dt><dd style="margin: 2px 0 0; font-size: 18px; font-weight: 600">100,2%</dd></div>
<div><dt style="font-size: 12px; color: #4D5762">Churn rate clienti YTD</dt><dd style="margin: 2px 0 0; font-size: 18px; font-weight: 600">5,8%</dd></div>
</dl>
</section>
</sc-if>
</div>

<section class="dtp-card" aria-labelledby="titolo-lista" style="background: #FFFFFF; border: 1px solid #D9E1EC; border-radius: 6px; padding: 24px; display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 12px">
<div>
<h2 id="titolo-lista" style="margin: 0; font-size: 18px; font-weight: 600">Lista di lavoro: clienti da contattare</h2>
<p style="margin: 4px 0 0; font-size: 13px; color: #4D5762">10 di 148 · ordinati per priorità (overage e esaurimento imminente, poi rinnovi a rischio)</p>
</div>
<label style="display: flex; align-items: center; gap: 8px; font-size: 13px; color: #4D5762">Cerca cliente<input type="search" placeholder="Ragione sociale o P.IVA" style="min-height: 40px; width: 240px; padding: 0 12px; border-radius: 6px; border: 1px solid #B8C2CF; font: inherit; font-size: 13px; color: #1A1C1E"></label>
</div>
<div style="overflow-x: auto">
<div role="table" aria-label="Clienti da contattare" style="min-width: 1180px; font-size: 13px">
<div role="row" style="display: grid; grid-template-columns: {{gridCols}}; color: #4D5762; font-size: 12px; border-bottom: 1px solid #D9E1EC">
<span role="columnheader" style="padding: 10px 10px">Cliente</span>
<span role="columnheader" style="padding: 10px 10px">Valore contratto</span>
<span role="columnheader" style="padding: 10px 10px">Account mgr</span>
<span role="columnheader" style="padding: 10px 10px">Scadenza</span>
<span role="columnheader" style="padding: 10px 10px">Servizio più consumato</span>
<span role="columnheader" style="padding: 10px 10px; text-align: right">Ritmo</span>
<span role="columnheader" style="padding: 10px 10px">Primo esaurimento</span>
<span role="columnheader" style="padding: 10px 10px">Health</span>
<span role="columnheader" style="padding: 10px 10px">Segmento</span>
<sc-if value="{{act}}" hint-placeholder-val="{{ true }}"><span role="columnheader" style="padding: 10px 10px">Azione suggerita</span></sc-if>
</div>
<sc-for list="{{clients}}" as="c" hint-placeholder-count="10">
<div role="row" style="display: grid; grid-template-columns: {{gridCols}}; align-items: center; border-bottom: 1px solid #EAEFF5">
<span role="rowheader" style="padding: 8px 10px"><a href="postel-O5-scheda-cliente.html" style="font-weight: 600; text-decoration: none; display: inline-block; padding: 6px 0">{{c.name}}</a></span>
<span role="cell" style="padding: 8px 10px">{{c.value}}</span>
<span role="cell" style="padding: 8px 10px">{{c.am}}</span>
<span role="cell" style="padding: 8px 10px; color: {{c.dueColor}}; font-weight: {{c.dueWeight}}">{{c.due}}</span>
<span role="cell" style="padding: 8px 10px">{{c.svc}} <strong style="font-weight: 600">{{c.pct}}</strong></span>
<span role="cell" style="padding: 8px 10px; text-align: right; font-weight: 600">{{c.pace}}</span>
<span role="cell" style="padding: 8px 10px">{{c.ex}}</span>
<span role="cell" style="padding: 8px 10px; display: flex; align-items: center; gap: 8px"><strong style="font-weight: 600; width: 22px">{{c.health}}</strong><span style="flex: 1; height: 6px; border-radius: 3px; background: #E4EAF2"><span style="display: block; width: {{c.healthW}}; height: 6px; border-radius: 3px; background: {{c.healthColor}}"></span></span></span>
<span role="cell" style="padding: 8px 10px"><span style="display: inline-block; padding: 3px 9px; border-radius: 999px; font-size: 12px; font-weight: 600; background: {{c.segBg}}; color: {{c.segFg}}">{{c.seg}}</span></span>
<sc-if value="{{act}}" hint-placeholder-val="{{ true }}"><span role="cell" style="padding: 8px 10px; color: #1A1C1E">{{c.action}}</span></sc-if>
</div>
</sc-for>
</div>
</div>
</section>

<sc-if value="{{act}}" hint-placeholder-val="{{ true }}">
<section class="dtp-card" aria-labelledby="titolo-assistita" data-testid="section-o2-09" style="background: #FFFFFF; border: 1px solid #D9E1EC; border-radius: 6px; padding: 24px; display: flex; flex-direction: column; gap: 14px">
<div>
<h2 id="titolo-assistita" style="margin: 0; font-size: 18px; font-weight: 600">Configurazione assistita</h2>
<p style="margin: 4px 0 0; font-size: 13px; color: #4D5762">Prepari per il cliente o il prospect la configurazione del percorso digitale di attivazione (V-02): servizi e quantità del catalogo e sconto sul prezzo complessivo entro la soglia consentita. Generi il codice di configurazione da consegnare al legale rappresentante: contiene solo servizi, quantità e sconto. Il legale rappresentante inserisce i dati, firma il contratto e invia la richiesta.</p>
</div>
<form action="vetrina-V02-contratto.html" method="get" style="display: flex; flex-wrap: wrap; align-items: flex-end; gap: 12px">
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600; color: #3A424C; flex: 1 1 320px">Cliente o prospect<input name="cliente" list="o2-09-prospect" autocomplete="off" maxlength="120" placeholder="Ragione sociale" data-testid="input-o2-09-cliente" style="min-height: 44px; padding: 0 12px; border-radius: 6px; border: 1px solid #B8C2CF; font: inherit; font-size: 14px; font-weight: 400; color: #1A1C1E"></label>
<datalist id="o2-09-prospect">
<sc-for list="{{prospects}}" as="pr" hint-placeholder-count="3"><option value="{{pr}}"></option></sc-for>
</datalist>
<button class="dtp-btn dtp-btn-p" type="submit" data-testid="button-o2-09-apri" style="min-height: 44px; padding: 0 20px; border-radius: 999px; border: 0; background: #0047BB; color: #FFFFFF; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer">Apri V-02 in modalità assistita</button>
</form>
<p style="margin: 0; font-size: 12px; color: #4D5762">Il primo acquisto resta concluso dal legale rappresentante: in modalità assistita non si carica il contratto firmato e non si invia la richiesta. Non si possono aggiungere servizi o combinazioni fuori catalogo.</p>
</section>
</sc-if>

<div style="display: flex; flex-wrap: wrap; gap: 20px; align-items: flex-start">
<section class="dtp-card" aria-labelledby="titolo-pratiche" style="flex: 999 1 640px; min-width: 0; background: #FFFFFF; border: 1px solid #D9E1EC; border-radius: 6px; padding: 24px; display: flex; flex-direction: column; gap: 14px">
<div>
<h2 id="titolo-pratiche" style="margin: 0; font-size: 18px; font-weight: 600">Ordini e richieste contrattuali in corso</h2>
<p style="margin: 4px 0 0; font-size: 13px; color: #4D5762">Vetrina self-service e ordini del commerciale seguono lo stesso percorso: firma del cliente, controfirma Postel, attivazione.</p>
</div>
<div style="overflow-x: auto">
<div role="table" aria-label="Ordini e richieste contrattuali" style="min-width: 760px; font-size: 13px">
<div role="row" style="display: grid; grid-template-columns: 1.6fr 1.7fr 1fr 1.5fr 1.1fr; gap: 10px; padding: 10px; border-bottom: 1px solid #D9E1EC; color: #4D5762; font-weight: 500">
<span role="columnheader">Cliente</span><span role="columnheader">Richiesta</span><span role="columnheader">Origine</span><span role="columnheader">Stato</span><span role="columnheader">Azione</span>
</div>
<sc-for list="{{pratiche}}" as="r" hint-placeholder-count="5">
<div role="row" style="display: grid; grid-template-columns: 1.6fr 1.7fr 1fr 1.5fr 1.1fr; gap: 10px; padding: 10px; border-bottom: 1px solid #EAEFF5; align-items: center">
<a role="cell" href="postel-O5-scheda-cliente.html" style="font-weight: 600; text-decoration: none">{{r.client}}</a>
<span role="cell" style="display: flex; flex-direction: column; gap: 2px"><span style="font-weight: 600">{{r.what}}</span><span style="color: #4D5762">{{r.detail}}</span></span>
<span role="cell" style="color: #3A424C">{{r.origin}}</span>
<span role="cell"><span style="display: inline-block; padding: 3px 10px; border-radius: 999px; background: {{r.bg}}; color: {{r.fg}}; font-size: 12px; font-weight: 600">{{r.state}}</span></span>
<span role="cell">
<sc-if value="{{r.hasAct}}" hint-placeholder-val="{{ false }}"><button class="dtp-btn dtp-btn-p" type="button" onClick="{{r.act}}" style="min-height: 40px; max-width: 100%; white-space: normal; line-height: 1.2; text-align: center; padding: 4px 14px; border-radius: 999px; border: 0; background: #0047BB; color: #FFFFFF; font: inherit; font-size: 13px; font-weight: 600; cursor: pointer">{{r.btn}}</button></sc-if>
<sc-if value="{{r.noAct}}" hint-placeholder-val="{{ true }}"><span style="color: #4D5762">{{r.note}}</span></sc-if>
</span>
</div>
</sc-for>
</div>
</div>
</section>
