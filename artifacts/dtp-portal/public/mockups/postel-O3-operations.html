<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Operations e SLA – Dashboard Operativa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;family=IBM+Plex+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F3F7FC}
*{box-sizing:border-box}
a{color:#0047BB}a:hover{color:#003A99}
</style>
<link rel="stylesheet" href="dtp-theme.css">
<link rel="icon" type="image/svg+xml" href="../favicon.svg">
<link rel="stylesheet" href="dtp-auth.css">
<script src="dtp-auth.js"></script>
</head>
<body>
<div id="app"></div>
<template id="tpl">

<div class="dtp-root" style="min-height: 100dvh; display: flex; flex-wrap: wrap; background: #F3F7FC; font-family: 'Inter', system-ui, sans-serif; color: #1A1C1E; font-variant-numeric: tabular-nums">

<div class="dtp-projectbar" style="flex: 1 1 100%; background: #F2F8FF; color: #1A1C1E; border-bottom: 1px solid #D9E1EC">
<div style="padding: 8px 32px; display: flex; flex-wrap: wrap; align-items: center; gap: 12px">
<a class="dtp-home" href="../workspace" title="Torna a Workspace / 2026" data-testid="link-home">Home</a>
<span class="dtp-session"><span class="dtp-session-tag">Accesso demo</span><span class="dtp-session-who" data-testid="text-current-role"><span data-dtp-role></span></span><button class="dtp-logout" type="button" data-dtp-logout data-testid="button-logout">Esci</button></span>
</div>
</div>

<nav class="dtp-sidenav" aria-label="Navigazione principale" style="flex: 1 1 240px; max-width: 100%; background: #0047BB; color: #FFFFFF; padding: 20px 14px; display: flex; flex-direction: column; gap: 22px">
<div style="display: flex; align-items: center; gap: 10px; padding: 0 8px">
<svg width="32" height="32" viewBox="0 0 34 34" aria-hidden="true"><rect width="34" height="34" rx="9" fill="#FFEC00"></rect><path d="M17 7l8 3v6c0 5-3.4 8.6-8 10-4.6-1.4-8-5-8-10v-6z" fill="none" stroke="#0047BB" stroke-width="2" stroke-linejoin="round"></path><path d="M13 16.5l3 3 5-5.5" fill="none" stroke="#0047BB" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg>
<div>
<div style="font-weight: 700; font-size: 17px; line-height: 1.1">postel</div>
<div style="font-size: 11px; color: #DCE8FF">Console operativa DTP</div>
</div>
</div>
<div style="display: flex; flex-direction: column; gap: 2px">
<sc-for list="{{nav}}" as="n" hint-placeholder-count="5">
<a class="dtp-sidelink" href="{{n.href}}" aria-current="{{n.current}}" style="min-height: 44px; display: flex; align-items: center; gap: 10px; padding: 0 12px; border-radius: 6px; background: {{n.bg}}; color: {{n.fg}}; font-size: 14px; font-weight: {{n.weight}}; text-decoration: none"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{n.icon}}"></path></svg>{{n.label}}</a>
</sc-for>
</div>
<div style="display: flex; flex-direction: column; gap: 2px; padding-top: 14px; border-top: 1px solid #3B74D6">
<span style="font-size: 11px; color: #C8DAFB; text-transform: uppercase; letter-spacing: 0.06em; padding: 0 12px 6px; font-weight: 600">Sistemi collegati</span>
<sc-for list="{{ext}}" as="e" hint-placeholder-count="1">
<a class="dtp-sidelink" href="#{{e.id}}" style="min-height: 44px; display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 0 12px; border-radius: 6px; color: #FFFFFF; font-size: 14px; font-weight: 500; text-decoration: none">{{e.label}}<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17 17 7M8 7h9v9"></path></svg></a>
</sc-for>
</div>
<div style="margin-top: auto; padding: 12px; border-radius: 6px; background: #003A99; display: flex; flex-direction: column; gap: 4px">
<span style="font-size: 14px; font-weight: 600">{{who.name}}</span>
<span style="font-size: 12px; color: #DCE8FF">{{who.role}}</span>
</div>
</nav>

<main class="dtp-main" style="flex: 999 1 560px; min-width: 0; padding: 24px 32px 48px; display: flex; flex-direction: column; gap: 20px">

<div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 12px">
<div>
<h1 style="margin: 0; font-size: 26px; font-weight: 600; letter-spacing: -0.01em">Operations e SLA</h1>
<p style="margin: 4px 0 0; font-size: 13px; color: #4D5762">Ultimi 30 giorni (28 set → 27 ott 2026) · aggiornamento orario, ultimo alle 17:00</p>
</div>
<span role="status" style="display: inline-flex; align-items: center; gap: 8px; padding: 8px 12px; border-radius: 999px; background: #FBE3E1; color: #A3201A; font-size: 13px; font-weight: 600"><span style="width: 8px; height: 8px; border-radius: 4px; background: #C7322A"></span>1 incidente P1 in corso</span>
</div>

<form aria-label="Filtri" style="display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-end; padding: 14px; border-radius: 6px; background: #FFFFFF; border: 1px solid #D9E1EC">
<sc-for list="{{filters}}" as="f" hint-placeholder-count="6">
<label style="display: flex; flex-direction: column; gap: 4px; font-size: 11px; color: #4D5762; font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em">{{f.label}}
<select style="min-height: 40px; min-width: 150px; padding: 0 10px; border-radius: 6px; border: 1px solid #B8C2CF; background: #FFFFFF; font: inherit; font-size: 13px; font-weight: 500; text-transform: none; letter-spacing: 0; color: #1A1C1E"><option>{{f.value}}</option></select>
</label>
</sc-for>
<button class="dtp-btn dtp-btn-t" type="reset" style="min-height: 40px; padding: 0 16px; border-radius: 999px; border: 0; background: transparent; font: inherit; font-size: 13px; font-weight: 600; color: #0047BB; cursor: pointer">Reimposta</button>
</form>

<section aria-label="Indicatori operativi" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 14px">
<sc-for list="{{kpis}}" as="k" hint-placeholder-count="6">
<div class="dtp-card" style="background: #FFFFFF; border: 1px solid #D9E1EC; border-radius: 6px; padding: 18px; display: flex; flex-direction: column; gap: 6px">
<span style="font-size: 13px; color: #4D5762; font-weight: 500">{{k.label}}</span>
<span style="font-size: 26px; font-weight: 600; letter-spacing: -0.02em; color: {{k.color}}">{{k.value}}</span>
<span style="font-size: 12px; color: #4D5762; line-height: 1.4">{{k.sub}}</span>
</div>
</sc-for>
</section>

<section class="dtp-card" aria-labelledby="titolo-volumi" style="background: #FFFFFF; border: 1px solid #D9E1EC; border-radius: 6px; padding: 24px; display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; flex-wrap: wrap; justify-content: space-between; gap: 12px">
<div>
<h2 id="titolo-volumi" style="margin: 0; font-size: 18px; font-weight: 600">Circa 43 mila transazioni per giorno feriale, picco il 21 ottobre</h2>
<p style="margin: 4px 0 0; font-size: 13px; color: #4D5762">Transazioni giornaliere su tutti i servizi e i clienti</p>
</div>
<div style="display: flex; flex-wrap: wrap; gap: 14px; font-size: 12px; align-items: center">
<span style="display: flex; align-items: center; gap: 6px"><span style="width: 10px; height: 10px; border-radius: 2px; background: #0047BB"></span>Giorni feriali</span>
<span style="display: flex; align-items: center; gap: 6px"><span style="width: 10px; height: 10px; border-radius: 2px; background: #9DBDF2"></span>Weekend</span>
</div>
</div>
<div role="img" aria-label="Volumi giornalieri tra 17 mila nel weekend e 46 mila nei giorni feriali" style="display: flex; gap: 10px">
<div style="display: flex; flex-direction: column; justify-content: space-between; height: 190px; font-size: 11px; color: #4D5762; text-align: right; width: 32px">
<span>50k</span><span>25k</span><span>0</span>
</div>
<div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px">
<div style="position: relative; height: 190px; display: flex; align-items: flex-end; gap: 4px; border-bottom: 1px solid #B8C2CF">
<div style="position: absolute; left: 0; right: 0; top: 0; border-top: 1px dashed #DDE4EE"></div>
<div style="position: absolute; left: 0; right: 0; top: 95px; border-top: 1px dashed #DDE4EE"></div>
<sc-for list="{{daily}}" as="d" hint-placeholder-count="30">
<div style="flex: 1; min-width: 0; height: {{d.h}}; background: {{d.color}}; border-radius: 2px 2px 0 0"></div>
</sc-for>
</div>
<div style="display: flex; justify-content: space-between; font-size: 11px; color: #4D5762"><span>28 set</span><span>5 ott</span><span>12 ott</span><span>19 ott</span><span>27 ott</span></div>
</div>
</div>
</section>

<section class="dtp-card" aria-labelledby="titolo-sla" style="background: #FFFFFF; border: 1px solid #D9E1EC; border-radius: 6px; padding: 24px; display: flex; flex-direction: column; gap: 14px">
<div>
<h2 id="titolo-sla" style="margin: 0; font-size: 18px; font-weight: 600">Due servizi sotto l'obiettivo SLA del 98%: Identificazioni Proprietarie e Doc Composition</h2>
<p style="margin: 4px 0 0; font-size: 13px; color: #4D5762">Livello di servizio per servizio · obiettivo: almeno 98% delle transazioni entro il tempo contrattuale</p>
</div>
<div style="overflow-x: auto">
<div role="table" aria-label="Livelli di servizio per servizio" style="min-width: 1000px; font-size: 13px">
<div role="row" style="display: grid; grid-template-columns: 2.2fr 1fr 1fr 0.9fr 0.9fr 1.5fr 0.9fr 1fr; color: #4D5762; font-size: 12px; border-bottom: 1px solid #D9E1EC">
<span role="columnheader" style="padding: 10px">Servizio</span>
<span role="columnheader" style="padding: 10px; text-align: right">Volume 30 gg</span>
<span role="columnheader" style="padding: 10px; text-align: right">Errore tecnico</span>
<span role="columnheader" style="padding: 10px; text-align: right">Tempo p95</span>
<span role="columnheader" style="padding: 10px; text-align: right">Tempo SLA</span>
<span role="columnheader" style="padding: 10px">Entro SLA</span>
<span role="columnheader" style="padding: 10px; text-align: right">Uptime</span>
<span role="columnheader" style="padding: 10px">Stato</span>
</div>
<sc-for list="{{svc}}" as="s" hint-placeholder-count="9">
<div role="row" style="display: grid; grid-template-columns: 2.2fr 1fr 1fr 0.9fr 0.9fr 1.5fr 0.9fr 1fr; align-items: center; border-bottom: 1px solid #EAEFF5">
<span role="rowheader" style="padding: 10px; font-weight: 600">{{s.name}}</span>
<span role="cell" style="padding: 10px; text-align: right">{{s.vol}}</span>
<span role="cell" style="padding: 10px; text-align: right; color: {{s.errColor}}; font-weight: {{s.errWeight}}">{{s.err}}</span>
<span role="cell" style="padding: 10px; text-align: right">{{s.p95}}</span>
<span role="cell" style="padding: 10px; text-align: right; color: #4D5762">{{s.target}}</span>
<span role="cell" style="padding: 10px; display: flex; align-items: center; gap: 8px"><strong style="font-weight: 600; width: 46px">{{s.sla}}</strong><span style="position: relative; flex: 1; height: 8px; border-radius: 4px; background: #E4EAF2"><span style="display: block; width: {{s.slaW}}; height: 8px; border-radius: 4px; background: {{s.bar}}"></span><span style="position: absolute; left: 50%; top: -3px; width: 2px; height: 14px; background: #0B2A5B"></span></span></span>
<span role="cell" style="padding: 10px; text-align: right">{{s.up}}</span>
<span role="cell" style="padding: 10px"><span style="display: inline-flex; align-items: center; gap: 6px; padding: 3px 9px; border-radius: 999px; font-size: 12px; font-weight: 600; background: {{s.bg}}; color: {{s.fg}}">{{s.state}}</span></span>
</div>
</sc-for>
</div>
</div>
<p style="margin: 0; font-size: 12px; color: #4D5762">Barra "Entro SLA": scala dal 96% al 100%, la tacca indica l'obiettivo del 98%.</p>
</section>

<section class="dtp-card" aria-labelledby="titolo-attivazioni" style="background: #FFFFFF; border: 1px solid #D9E1EC; border-radius: 6px; padding: 24px; display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 12px">
<div>
<h2 id="titolo-attivazioni" style="margin: 0; font-size: 18px; font-weight: 600">Attivazioni in corso: 5, di cui una ferma oltre i 10 giorni previsti</h2>
<p style="margin: 4px 0 0; font-size: 13px; color: #4D5762">Ordini e contratti firmati in commercial orchestration che aspettano l'attivazione dei servizi</p>
</div>
</div>
<div style="overflow-x: auto">
<div role="table" aria-label="Attivazioni in corso" style="min-width: 1040px; font-size: 13px">
<div role="row" style="display: grid; grid-template-columns: {{actCols}}; color: #4D5762; font-size: 12px; border-bottom: 1px solid #D9E1EC">
<span role="columnheader" style="padding: 10px">Ordine</span>
<span role="columnheader" style="padding: 10px">Cliente</span>
<span role="columnheader" style="padding: 10px">Offerta</span>
<span role="columnheader" style="padding: 10px">Richiesto il</span>
<span role="columnheader" style="padding: 10px">Stato</span>
<span role="columnheader" style="padding: 10px; text-align: right">Giorni</span>
<span role="columnheader" style="padding: 10px">Incaricato</span>
<sc-if value="{{isOps}}" hint-placeholder-val="{{ true }}"><span role="columnheader" style="padding: 10px">Azione</span></sc-if>
</div>
<sc-for list="{{acts}}" as="a" hint-placeholder-count="5">
<div role="row" style="display: grid; grid-template-columns: {{actCols}}; align-items: center; border-bottom: 1px solid #EAEFF5">
<span role="rowheader" style="padding: 10px; font-weight: 600">{{a.id}}</span>
<span role="cell" style="padding: 10px"><a href="postel-O5-scheda-cliente.html" style="text-decoration: none; font-weight: 500">{{a.client}}</a></span>
<span role="cell" style="padding: 10px">{{a.offer}}</span>
<span role="cell" style="padding: 10px">{{a.date}}</span>
<span role="cell" style="padding: 10px"><span style="display: inline-block; padding: 3px 9px; border-radius: 999px; font-size: 12px; font-weight: 600; background: {{a.bg}}; color: {{a.fg}}">{{a.state}}</span></span>
<span role="cell" style="padding: 10px; text-align: right; font-weight: 600; color: {{a.dayColor}}">{{a.days}}</span>
<span role="cell" style="padding: 10px">{{a.owner}}</span>
<sc-if value="{{isOps}}" hint-placeholder-val="{{ true }}"><span role="cell" style="padding: 6px 10px"><button class="dtp-btn" type="button" style="min-height: 36px; padding: 0 14px; border-radius: 999px; border: 1px solid {{a.btnBorder}}; background: {{a.btnBg}}; color: {{a.btnFg}}; font: inherit; font-size: 12px; font-weight: 600; cursor: pointer">{{a.btn}}</button></span></sc-if>
</div>
</sc-for>
</div>
</div>
</section>

<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 16px">
<section class="dtp-card" aria-labelledby="titolo-ko" style="background: #FFFFFF; border: 1px solid #D9E1EC; border-radius: 6px; padding: 24px; display: flex; flex-direction: column; gap: 14px">
<div>
<h2 id="titolo-ko" style="margin: 0; font-size: 18px; font-weight: 600">Motivi di esito negativo</h2>
<p style="margin: 4px 0 0; font-size: 13px; color: #4D5762">41.380 KO di processo in 30 giorni, tutti i servizi</p>
</div>
<ul style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 12px">
<sc-for list="{{ko}}" as="k" hint-placeholder-count="6">
<li style="display: flex; flex-direction: column; gap: 5px">
<div style="display: flex; justify-content: space-between; gap: 8px; font-size: 13px"><span>{{k.name}}</span><strong style="font-weight: 600">{{k.p}}</strong></div>
<div style="height: 8px; border-radius: 4px; background: #E4EAF2"><div style="width: {{k.w}}; height: 8px; border-radius: 4px; background: #E8692A"></div></div>
</li>
</sc-for>
</ul>
<div style="padding-top: 12px; border-top: 1px solid #EAEFF5; display: flex; flex-direction: column; gap: 8px">
<span style="font-size: 12px; color: #4D5762; font-weight: 500">Transazioni per canale</span>
<div role="img" aria-label="API 64%, web 24%, app 12%" style="display: flex; height: 14px; border-radius: 4px; overflow: hidden">
<div style="width: 64%; background: #0047BB"></div>
<div style="width: 24%; background: #6FA0EE; border-left: 2px solid #FFFFFF"></div>
<div style="width: 12%; background: #13877E; border-left: 2px solid #FFFFFF"></div>
</div>
<div style="display: flex; flex-wrap: wrap; gap: 14px; font-size: 12px"><span>API 64%</span><span>Web 24%</span><span>App 12%</span></div>
</div>
</section>

<section class="dtp-card" aria-labelledby="titolo-ticket" style="background: #FFFFFF; border: 1px solid #D9E1EC; border-radius: 6px; padding: 24px; display: flex; flex-direction: column; gap: 14px">
<div>
<h2 id="titolo-ticket" style="margin: 0; font-size: 18px; font-weight: 600">Ticket e incidenti</h2>
<p style="margin: 4px 0 0; font-size: 13px; color: #4D5762">37 ticket aperti · tempo medio di risoluzione 6,4 h</p>
</div>
<div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px">
<sc-for list="{{tickets}}" as="t" hint-placeholder-count="4">
<div style="padding: 12px; border-radius: 6px; border: 1px solid #D9E1EC; display: flex; flex-direction: column; gap: 2px">
<span style="font-size: 12px; font-weight: 600; color: {{t.color}}">{{t.p}}</span>
<span style="font-size: 22px; font-weight: 600">{{t.n}}</span>
<span style="font-size: 11px; color: #4D5762">MTTR {{t.mttr}}</span>
</div>
</sc-for>
</div>
<ul style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column">
<sc-for list="{{incidents}}" as="i" hint-placeholder-count="4">
<li style="display: flex; gap: 12px; padding: 12px 0; border-bottom: 1px solid #EAEFF5">
<span style="flex: none; width: 36px; height: 24px; border-radius: 6px; background: {{i.bg}}; color: {{i.fg}}; font-size: 12px; font-weight: 700; display: flex; align-items: center; justify-content: center">{{i.p}}</span>
<div style="display: flex; flex-direction: column; gap: 2px; min-width: 0">
<span style="font-size: 14px; font-weight: 600">{{i.svc}}</span>
<span style="font-size: 13px; color: #1A1C1E">{{i.what}}</span>
<span style="font-size: 12px; color: {{i.statusColor}}; font-weight: 500">{{i.when}} · {{i.status}} · {{i.pix}}</span>
<sc-if value="{{isOps}}" hint-placeholder-val="{{ true }}"><a href="#pix" style="font-size: 13px; font-weight: 600; text-decoration: none; padding: 6px 0">Apri in PIX</a></sc-if>
</div>
</li>
</sc-for>
</ul>
</section>
</div>

</main>
</div>
</template>
<script>
/* Mini runtime per le pagine esportate: template {{ }}, sc-for, sc-if, onClick, setState. */
(function () {
  var _tl = Number.prototype.toLocaleString;
  Number.prototype.toLocaleString = function (loc, opt) {
    if (loc === 'it-IT') opt = Object.assign({ useGrouping: 'always' }, opt || {});
    try { return _tl.call(this, loc, opt); } catch (e) { return _tl.call(this, loc); }
  };
  var HOLE = /\{\{\s*([^}]+?)\s*\}\}/g, FULL = /^\{\{\s*([^}]+?)\s*\}\}$/;
  function lookup(path, scope) {
    path = path.trim();
    if (path === 'true') return true; if (path === 'false') return false;
    if (/^-?\d+(\.\d+)?$/.test(path)) return Number(path);
    var parts = path.split('.'), v = scope;
    for (var i = 0; i < parts.length; i++) { if (v == null) return undefined; v = v[parts[i]]; }
    return v;
  }
  function interp(str, scope) {
    return str.replace(HOLE, function (_, p) { var v = lookup(p, scope); return v == null ? '' : String(v); });
  }
  function renderChildren(src, dst, scope) {
    for (var c = src.firstChild; c; c = c.nextSibling) renderNode(c, dst, scope);
  }
  function renderNode(node, dst, scope) {
    if (node.nodeType === 3) { dst.appendChild(document.createTextNode(interp(node.nodeValue, scope))); return; }
    if (node.nodeType !== 1) return;
    var tag = node.localName;
    if (tag === 'sc-for') {
      var list = lookup((node.getAttribute('list') || '').replace(/^\{\{|\}\}$/g, ''), scope) || [];
      var as = node.getAttribute('as') || 'item';
      list.forEach(function (item, i) {
        var s = Object.create(scope); s[as] = item; s.$index = i;
        renderChildren(node, dst, s);
      });
      return;
    }
    if (tag === 'sc-if') {
      var val = lookup((node.getAttribute('value') || '').replace(/^\{\{|\}\}$/g, ''), scope);
      if (val) renderChildren(node, dst, scope);
      return;
    }
    var el = node.namespaceURI === 'http://www.w3.org/2000/svg'
      ? document.createElementNS(node.namespaceURI, node.localName) : document.createElement(node.localName);
    for (var a = 0; a < node.attributes.length; a++) {
      var at = node.attributes[a], name = at.name, raw = at.value;
      if (name.indexOf('hint-') === 0) continue;
      var m = raw.match(FULL);
      if (m) {
        var v = lookup(m[1], scope);
        if (name.indexOf('on') === 0 && typeof v === 'function') { el.addEventListener(name.slice(2), v); continue; }
        if (name === 'defaultchecked' || name === 'checked') { if (v) { el.setAttribute('checked', ''); el.checked = true; } continue; }
        if (name === 'defaultvalue') { el.setAttribute('value', v == null ? '' : String(v)); continue; }
        if (v == null || v === false && name.indexOf('aria-') !== 0) continue;
        el.setAttribute(name, String(v));
      } else if (name === 'defaultvalue') { el.setAttribute('value', raw);
      } else if (name === 'defaultchecked') { el.setAttribute('checked', '');
      } else { el.setAttribute(name, interp(raw, scope)); }
    }
    renderChildren(node.localName === 'template' ? node.content : node, el, scope);
