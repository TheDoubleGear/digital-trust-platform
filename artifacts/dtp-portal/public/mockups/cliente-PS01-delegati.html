<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PS-01 Delegati – Primo setup</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;family=IBM+Plex+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F3F7FC}
*{box-sizing:border-box}
a{color:#0047BB}a:hover{color:#003A99}
</style>
<link rel="stylesheet" href="dtp-theme.css">
<link rel="icon" type="image/svg+xml" href="../favicon.svg">
<link rel="stylesheet" href="dtp-auth.css">
<script src="dtp-auth.js"></script>
</head>
<body>
<div id="app"></div>
<template id="tpl">

<div class="dtp-root" style="min-height: 100dvh; background: #F3F7FC; font-family: 'Inter', system-ui, sans-serif; color: #1A1C1E; font-variant-numeric: tabular-nums">

<div class="dtp-projectbar" style="background: #F2F8FF; color: #1A1C1E; border-bottom: 1px solid #D9E1EC">
<div style="max-width: 1360px; margin: 0 auto; padding: 10px 32px; display: flex; flex-wrap: wrap; align-items: center; gap: 12px">
<a class="dtp-home" href="../workspace" title="Torna a Workspace / 2026" data-testid="link-home">Home</a>
<span class="dtp-session-tag">Primo setup · solo per il legale rappresentante, una sola volta, dopo il primo accesso</span>
<span class="dtp-session"><span class="dtp-session-tag">Accesso demo</span><span class="dtp-session-who" data-testid="text-current-role"><span data-dtp-role></span></span><button class="dtp-logout" type="button" data-dtp-logout data-testid="button-logout">Esci</button></span>
</div>
</div>

<header class="dtp-header" style="background: #EEDC00; border-bottom: 1px solid #D6C600">
<div style="max-width: 1360px; margin: 0 auto; padding: 10px 32px; display: flex; flex-wrap: wrap; align-items: center; gap: 24px; justify-content: space-between">
<div style="display: flex; align-items: center; gap: 10px">
<svg width="34" height="34" viewBox="0 0 34 34" aria-hidden="true"><rect width="34" height="34" rx="9" fill="#0047BB"></rect><path d="M17 7l8 3v6c0 5-3.4 8.6-8 10-4.6-1.4-8-5-8-10v-6z" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linejoin="round"></path><path d="M13 16.5l3 3 5-5.5" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg>
<div>
<div style="font-weight: 800; font-size: 21px; letter-spacing: -0.03em; line-height: 1.1; color: #0047BB">postel</div>
<div style="font-size: 12px; color: #33383D">Digital Trust Platform · configurazione iniziale</div>
</div>
</div>
<div style="display: flex; align-items: center; gap: 10px">
<div aria-hidden="true" style="width: 36px; height: 36px; border-radius: 18px; background: #0047BB; color: #FFFFFF; font-size: 13px; font-weight: 600; display: flex; align-items: center; justify-content: center">PF</div>
<div style="line-height: 1.25">
<div style="font-size: 14px; font-weight: 600">Paolo Ferretti</div>
<div style="font-size: 12px; color: #33383D">Legale rappresentante · Assicurazioni Aurora S.p.A.</div>
</div>
</div>
</div>
</header>

<main class="dtp-main" style="max-width: 1180px; margin: 0 auto; padding: 32px 32px 48px; display: flex; flex-direction: column; gap: 24px">

<ol aria-label="Passi del primo setup" style="list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 12px">
<li><div aria-current="step" style="display: flex; align-items: center; gap: 12px; min-height: 72px; padding: 12px 14px; border-radius: 6px; border: 1px solid #0047BB; background: #F2F8FF; color: #1A1C1E; text-decoration: none"><span style="flex: none; width: 32px; height: 32px; border-radius: 16px; background: #0047BB; color: #FFFFFF; font-size: 14px; font-weight: 700; display: flex; align-items: center; justify-content: center">1</span><span style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 11px; font-weight: 700; color: #4D5762; letter-spacing: 0.05em">PS-01</span><strong style="font-size: 15px; font-weight: 600">Delegati</strong><span style="font-size: 12px; color: #4D5762">chi ti affianca e con quali poteri</span></span></div></li>
<li><div style="display: flex; align-items: center; gap: 12px; min-height: 72px; padding: 12px 14px; border-radius: 6px; border: 1px solid #D9E1EC; background: #FFFFFF; color: #1A1C1E; text-decoration: none"><span style="flex: none; width: 32px; height: 32px; border-radius: 16px; background: #E4EAF2; color: #4D5762; font-size: 14px; font-weight: 700; display: flex; align-items: center; justify-content: center">2</span><span style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 11px; font-weight: 700; color: #4D5762; letter-spacing: 0.05em">PS-02</span><strong style="font-size: 15px; font-weight: 600">Soglie e notifiche</strong><span style="font-size: 12px; color: #4D5762">quando e come essere avvisati</span></span></div></li>
</ol>

<div class="dtp-hero">
<span style="font-size: 12px; font-weight: 700; color: #0047BB; text-transform: uppercase; letter-spacing: 0.06em">Passo 1 di 2 · PS-01</span>
<h1 style="margin: 4px 0 0; font-size: 28px; font-weight: 600; letter-spacing: -0.01em">Benvenuto, Paolo. Il contratto è attivo: configuriamo il portale</h1>
<p style="margin: 8px 0 0; font-size: 15px; color: #4D5762; line-height: 1.55; max-width: 820px">Per ciascuna delega scegli se nominare ora un delegato o gestire tu la funzione. Le funzioni che non deleghi restano a te, insieme alle relative notifiche. Potrai modificare le deleghe in qualsiasi momento da «Utenze e deleghe».</p>
</div>

<section aria-label="Deleghe" style="display: flex; flex-direction: column; gap: 16px">
<sc-for list="{{deleghe}}" as="d" hint-placeholder-count="3">
<article class="dtp-card" style="background: #FFFFFF; border: 1px solid {{d.border}}; border-radius: 6px; padding: 22px; display: flex; flex-direction: column; gap: 16px">
<div style="display: flex; flex-wrap: wrap; gap: 20px; align-items: flex-start; justify-content: space-between">
<div style="flex: 1 1 420px; display: flex; flex-direction: column; gap: 8px">
<h2 style="margin: 0; font-size: 18px; font-weight: 600">{{d.name}}</h2>
<ul style="margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 4px; font-size: 14px; color: #3A424C; line-height: 1.45">
<sc-for list="{{d.perms}}" as="x" hint-placeholder-count="3"><li>{{x.t}}</li></sc-for>
</ul>
</div>
<div class="dtp-seg" role="group" aria-label="Scelta per {{d.name}}" style="display: flex; gap: 6px; padding: 4px; border-radius: 999px; background: #E4EAF2">
<button class="dtp-btn" type="button" aria-pressed="{{d.pressNom}}" onClick="{{d.pickNom}}" style="min-height: 44px; padding: 0 20px; border-radius: 999px; border: 0; background: {{d.bgNom}}; color: #1A1C1E; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer">Nomina un delegato</button>
<button class="dtp-btn" type="button" aria-pressed="{{d.pressIo}}" onClick="{{d.pickIo}}" style="min-height: 44px; padding: 0 20px; border-radius: 999px; border: 0; background: {{d.bgIo}}; color: #1A1C1E; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer">La gestisco io</button>
</div>
</div>
<sc-if value="{{d.isNom}}" hint-placeholder-val="{{ false }}">
<div style="border-top: 1px solid #EAEFF5; padding-top: 16px; display: flex; flex-direction: column; gap: 12px">
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px">
<label style="display: flex; flex-direction: column; gap: 4px; font-size: 13px; font-weight: 500">Nome<input type="text" defaultValue="{{d.fn}}" style="min-height: 44px; padding: 0 12px; border-radius: 6px; border: 1px solid #B8C2CF; font: inherit; font-size: 14px"></label>
<label style="display: flex; flex-direction: column; gap: 4px; font-size: 13px; font-weight: 500">Cognome<input type="text" defaultValue="{{d.ln}}" style="min-height: 44px; padding: 0 12px; border-radius: 6px; border: 1px solid #B8C2CF; font: inherit; font-size: 14px"></label>
<label style="display: flex; flex-direction: column; gap: 4px; font-size: 13px; font-weight: 500">Email aziendale<input type="email" defaultValue="{{d.em}}" style="min-height: 44px; padding: 0 12px; border-radius: 6px; border: 1px solid #B8C2CF; font: inherit; font-size: 14px"></label>
<label style="display: flex; flex-direction: column; gap: 4px; font-size: 13px; font-weight: 500">Codice fiscale<input type="text" style="min-height: 44px; padding: 0 12px; border-radius: 6px; border: 1px solid #B8C2CF; font: inherit; font-size: 14px"></label>
</div>
<p style="margin: 0; font-size: 13px; color: #4D5762">Al termine del primo setup generiamo l'atto di delega con i poteri del tipo scelto: lo firmi tu, poi il delegato riceve l'invito, verifica la propria identità e firma l'accettazione. L'atto è conservato a norma.</p>
</div>
</sc-if>
<sc-if value="{{d.isIo}}" hint-placeholder-val="{{ false }}">
<p style="margin: 0; border-top: 1px solid #EAEFF5; padding-top: 14px; font-size: 14px; color: #1A6B4A; font-weight: 500">Gestirai tu queste funzioni e riceverai le notifiche collegate.</p>
</sc-if>
</article>
</sc-for>
</section>

<div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 12px; padding-top: 8px; border-top: 1px solid #D9E1EC">
<span style="font-size: 13px; color: {{hintColor}}">{{hint}}</span>
<sc-if value="{{ready}}" hint-placeholder-val="{{ true }}">
<a class="dtp-btn dtp-btn-p" href="cliente-PS02-soglie.html" data-dtp-setup="delegates" data-testid="link-setup-continue" style="min-height: 48px; padding: 0 26px; border-radius: 999px; background: #0047BB; color: #FFFFFF; font-size: 15px; font-weight: 600; text-decoration: none; display: flex; align-items: center">Continua</a>
</sc-if>
<sc-if value="{{notReady}}" hint-placeholder-val="{{ false }}">
<button class="dtp-btn" type="button" disabled style="min-height: 48px; padding: 0 26px; border-radius: 999px; border: 0; background: #B8C2CF; color: #FFFFFF; font: inherit; font-size: 15px; font-weight: 600">Continua</button>
</sc-if>
</div>

</main>
</div>
</template>
<script>
/* Mini runtime per le pagine esportate: template {{ }}, sc-for, sc-if, onClick, setState. */
(function () {
  var _tl = Number.prototype.toLocaleString;
  Number.prototype.toLocaleString = function (loc, opt) {
    if (loc === 'it-IT') opt = Object.assign({ useGrouping: 'always' }, opt || {});
    try { return _tl.call(this, loc, opt); } catch (e) { return _tl.call(this, loc); }
  };
  var HOLE = /\{\{\s*([^}]+?)\s*\}\}/g, FULL = /^\{\{\s*([^}]+?)\s*\}\}$/;
  function lookup(path, scope) {
    path = path.trim();
    if (path === 'true') return true; if (path === 'false') return false;
    if (/^-?\d+(\.\d+)?$/.test(path)) return Number(path);
    var parts = path.split('.'), v = scope;
    for (var i = 0; i < parts.length; i++) { if (v == null) return undefined; v = v[parts[i]]; }
    return v;
  }
  function interp(str, scope) {
    return str.replace(HOLE, function (_, p) { var v = lookup(p, scope); return v == null ? '' : String(v); });
  }
  function renderChildren(src, dst, scope) {
    for (var c = src.firstChild; c; c = c.nextSibling) renderNode(c, dst, scope);
  }
  function renderNode(node, dst, scope) {
    if (node.nodeType === 3) { dst.appendChild(document.createTextNode(interp(node.nodeValue, scope))); return; }
    if (node.nodeType !== 1) return;
    var tag = node.localName;
    if (tag === 'sc-for') {
      var list = lookup((node.getAttribute('list') || '').replace(/^\{\{|\}\}$/g, ''), scope) || [];
      var as = node.getAttribute('as') || 'item';
      list.forEach(function (item, i) {
        var s = Object.create(scope); s[as] = item; s.$index = i;
        renderChildren(node, dst, s);
      });
      return;
    }
    if (tag === 'sc-if') {
      var val = lookup((node.getAttribute('value') || '').replace(/^\{\{|\}\}$/g, ''), scope);
      if (val) renderChildren(node, dst, scope);
      return;
    }
    var el = node.namespaceURI === 'http://www.w3.org/2000/svg'
      ? document.createElementNS(node.namespaceURI, node.localName) : document.createElement(node.localName);
    for (var a = 0; a < node.attributes.length; a++) {
      var at = node.attributes[a], name = at.name, raw = at.value;
      if (name.indexOf('hint-') === 0) continue;
      var m = raw.match(FULL);
      if (m) {
        var v = lookup(m[1], scope);
        if (name.indexOf('on') === 0 && typeof v === 'function') { el.addEventListener(name.slice(2), v); continue; }
        if (name === 'defaultchecked' || name === 'checked') { if (v) { el.setAttribute('checked', ''); el.checked = true; } continue; }
        if (name === 'defaultvalue') { el.setAttribute('value', v == null ? '' : String(v)); continue; }
        if (v == null || v === false && name.indexOf('aria-') !== 0) continue;
        el.setAttribute(name, String(v));
      } else if (name === 'defaultvalue') { el.setAttribute('value', raw);
      } else if (name === 'defaultchecked') { el.setAttribute('checked', '');
      } else { el.setAttribute(name, interp(raw, scope)); }
    }
    renderChildren(node.localName === 'template' ? node.content : node, el, scope);
    dst.appendChild(el);
  }
  function DCLogic(props) { this.props = props || {}; this.state = null; }
  DCLogic.prototype.setState = function (o) {
    this.state = Object.assign({}, this.state || {}, o);
    this.__render();
  };
  DCLogic.prototype.forceUpdate = function () { this.__render(); };
  window.DCLogic = DCLogic;
  window.DC = {
    mount: function (Comp, meta) {
      var props = {};
      Object.keys(meta).forEach(function (k) { if (k[0] !== '$' && meta[k] && 'default' in meta[k]) props[k] = meta[k]['default']; });
      /* Sessione demo: il ruolo arriva da DTPAuth; senza permesso la pagina non viene disegnata. */
      var auth = window.DTPAuth, access = auth ? auth.enter(meta) : null;
      if (!access) return;
      if (meta.persona && meta.persona.options) props.persona = access.role;
      var tpl = document.getElementById('tpl').content, root = document.getElementById('app');
      var c = new Comp(props);
      c.__render = function () {
        var frag = document.createDocumentFragment();
        renderChildren(tpl, frag, c.renderVals());
        root.replaceChildren(frag);
        auth.decorate(root);
      };
      c.__render();
    }
  };
})();

</script>
<script>

class Component extends DCLogic {
  renderVals() {
    var self = this;
    var st = this.state || {};
    var ch = st.ch || { amm: 'nom', op: 'nom', tec: null };
    var D = [
      ['amm', 'Delega amministrativa', ['compone e avvia upgrade e modifiche dell’offerta', 'gestisce soglie e destinatari delle notifiche', 'consulta consumi, importi e fatture'], 'Giulia', 'Marchetti', 'g.marchetti@aurora.example'],
      ['op', 'Delega operativa', ['configura servizi e journey', 'consulta i consumi in quantità, senza importi'], 'Davide', 'Sala', 'd.sala@aurora.example'],
      ['tec', 'Delega tecnica', ['accede al developer portal e alla sandbox', 'integra API, SDK e componenti white label', 'non accede alle dashboard'], '', '', '']
    ];
    var set = function (k, v) { var o = {}; for (var x in ch) o[x] = ch[x]; o[k] = v; self.setState({ ch: o }); };
    var deleghe = D.map(function (d) {
      var c = ch[d[0]];
      return {
        name: d[1], perms: d[2].map(function (t) { return { t: t }; }), fn: d[3], ln: d[4], em: d[5],
        isNom: c === 'nom', isIo: c === 'io',
        pressNom: c === 'nom' ? 'true' : 'false', pressIo: c === 'io' ? 'true' : 'false',
        bgNom: c === 'nom' ? '#FFFFFF' : 'transparent', bgIo: c === 'io' ? '#FFFFFF' : 'transparent',
        border: c ? '#0047BB' : '#D9E1EC',
        pickNom: function () { set(d[0], 'nom'); }, pickIo: function () { set(d[0], 'io'); }
      };
    });
    var n = D.filter(function (d) { return ch[d[0]]; }).length;
    return {
      deleghe: deleghe, ready: n === 3, notReady: n < 3,
      hint: n === 3 ? 'Tutte le deleghe sono definite.' : 'Scegli un’opzione per ciascuna delega (' + n + ' di 3).',
      hintColor: n === 3 ? '#1A6B4A' : '#4D5762'
    };
  }
}


DC.mount(Component, {"$preview": {"width": 1440, "height": 1500}});
</script>
</body>
</html>
