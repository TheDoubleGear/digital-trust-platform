<div style="overflow-x: auto">
<div role="table" aria-label="Elenco fatture" style="min-width: 1100px; font-size: 13px">
<div role="row" style="display: grid; grid-template-columns: 1.1fr 0.8fr 0.7fr 2.2fr 0.8fr 0.9fr 1.1fr 0.9fr 1.3fr; color: #4D5762; font-size: 12px; border-bottom: 1px solid #D9E1EC">
<span role="columnheader" style="padding: 10px">Numero</span>
<span role="columnheader" style="padding: 10px">Data</span>
<span role="columnheader" style="padding: 10px">Tipo</span>
<span role="columnheader" style="padding: 10px">Descrizione</span>
<span role="columnheader" style="padding: 10px; text-align: right">Importo</span>
<span role="columnheader" style="padding: 10px">Scadenza</span>
<span role="columnheader" style="padding: 10px">Stato</span>
<span role="columnheader" style="padding: 10px">Esito SdI</span>
<span role="columnheader" style="padding: 10px">Documenti e pagamento</span>
</div>
<sc-for list="{{invoices}}" as="i" hint-placeholder-count="5">

<span role="cell" style="padding: 10px">{{i.type}}</span>
<span role="cell" style="padding: 10px">{{i.desc}}</span>
<span role="cell" style="padding: 10px; text-align: right; font-weight: 600">{{i.amount}}</span>
<span role="cell" style="padding: 10px">{{i.due}}</span>
<span role="cell" style="padding: 10px"><span style="display: inline-block; padding: 3px 9px; border-radius: 999px; font-size: 12px; font-weight: 600; background: {{i.bg}}; color: {{i.fg}}">{{i.state}}</span></span>
<span role="cell" style="padding: 10px; font-size: 12px; color: {{i.sdiFg}}">{{i.sdi}}</span>

<section class="dtp-card" aria-labelledby="titolo-pagamento" style="background: #FFFFFF; border: 1px solid #D9E1EC; border-radius: 6px; padding: 24px; display: flex; flex-direction: column; gap: 14px">

<h2 id="titolo-pagamento" style="margin: 0; font-size: 18px; font-weight: 600">Pagamenti e solleciti</h2>

<div style="border: 1px solid #D9E1EC; border-radius: 6px; padding: 16px; display: flex; flex-direction: column; gap: 6px">

<span style="font-size: 13px; color: #3A424C; line-height: 1.5">Pagamento online con carta, singolo per fattura, oppure bonifico sull'IBAN indicato in fattura ([IBAN POSTEL]) con il numero fattura in causale.</span>
</div>
<div style="border: 1px solid #D9E1EC; border-radius: 6px; padding: 16px; display: flex; flex-direction: column; gap: 6px">
<span style="font-size: 14px; font-weight: 600">Solleciti</span>
<span style="font-size: 13px; color: #3A424C; line-height: 1.5">{{reminder}}</span>
<span style="font-size: 12px; color: #4D5762">Regole di sollecito: [DA DEFINIRE]</span>
</div>
<div style="border: 1px solid #D9E1EC; border-radius: 6px; padding: 16px; display: flex; flex-direction: column; gap: 6px">
<span style="font-size: 14px; font-weight: 600">Ricevute</span>
<sc-for list="{{receipts}}" as="r" hint-placeholder-count="3">
<a href="#ricevuta" style="font-size: 13px; text-decoration: none; padding: 4px 0">{{r.label}}</a>

<section class="dtp-card" aria-labelledby="titolo-overage" style="background: #FFFFFF; border: 1px solid #D9E1EC; border-radius: 6px; padding: 24px; display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 12px">
<div>
<h2 id="titolo-overage" style="margin: 0; font-size: 18px; font-weight: 600">Overage: € 420 maturati finora, € 10.703 previsti a fine periodo</h2>
<p style="margin: 4px 0 0; font-size: 13px; color: #4D5762">Unità oltre la quantità inclusa per servizio · previsione al ritmo degli ultimi 30 giorni, senza ricariche</p>
</div>
<a class="dtp-btn dtp-btn-p" href="cliente-H-catalogo.html" style="min-height: 44px; padding: 0 20px; border-radius: 999px; background: #0047BB; color: #FFFFFF; font-size: 14px; font-weight: 600; text-decoration: none; display: flex; align-items: center">Riduci l'overage con le ricariche</a>

<div style="overflow-x: auto">
<div role="table" aria-label="Dettaglio overage per servizio" style="min-width: 900px; font-size: 13px">
<div role="row" style="display: grid; grid-template-columns: 2.4fr 1fr 1fr 1fr 1.1fr 1.1fr; color: #4D5762; font-size: 12px; border-bottom: 1px solid #D9E1EC; text-align: right">
<span role="columnheader" style="padding: 10px; text-align: left">Servizio</span>
<span role="columnheader" style="padding: 10px">Prezzo overage</span>
<span role="columnheader" style="padding: 10px">Unità oltre soglia oggi</span>

<sc-for list="{{overage}}" as="o" hint-placeholder-count="9">
<div role="row" style="display: grid; grid-template-columns: 2.4fr 1fr 1fr 1fr 1.1fr 1.1fr; border-bottom: 1px solid #EAEFF5; text-align: right">
<span role="rowheader" style="padding: 10px; text-align: left; font-weight: 500">{{o.name}}</span>
<span role="cell" style="padding: 10px; color: #4D5762">{{o.price}}</span>
<span role="cell" style="padding: 10px">{{o.now}}</span>
<span role="cell" style="padding: 10px; font-weight: 600">{{o.nowEur}}</span>
<span role="cell" style="padding: 10px">{{o.fc}}</span>
<span role="cell" style="padding: 10px; font-weight: 600; color: {{o.fcColor}}">{{o.fcEur}}</span>
</div>
</sc-for>
<div role="row" style="display: grid; grid-template-columns: 2.4fr 1fr 1fr 1fr 1.1fr 1.1fr; text-align: right; font-weight: 700">
<span role="rowheader" style="padding: 12px 10px; text-align: left">Totale</span>
<span role="cell" style="padding: 12px 10px"></span>
<span role="cell" style="padding: 12px 10px"></span>
<span role="cell" style="padding: 12px 10px">€ 420</span>
<span role="cell" style="padding: 12px 10px"></span>
<span role="cell" style="padding: 12px 10px; color: #B03A0B">€ 10.703</span>
</div>
</div>
</div>
</section>
</div>
</sc-if>

</main>
</div>
</template>
<script>
/* Mini runtime per le pagine esportate: template {{ }}, sc-for, sc-if, onClick, setState. */
(function () {
  var _tl = Number.prototype.toLocaleString;
  Number.prototype.toLocaleString = function (loc, opt) {
    if (loc === 'it-IT') opt = Object.assign({ useGrouping: 'always' }, opt || {});
    try { return _tl.call(this, loc, opt); } catch (e) { return _tl.call(this, loc); }
  };
  var HOLE = /\{\{\s*([^}]+?)\s*\}\}/g, FULL = /^\{\{\s*([^}]+?)\s*\}\}$/;
  function lookup(path, scope) {
    path = path.trim();
    if (path === 'true') return true; if (path === 'false') return false;
    if (/^-?\d+(\.\d+)?$/.test(path)) return Number(path);
    var parts = path.split('.'), v = scope;
    for (var i = 0; i < parts.length; i++) { if (v == null) return undefined; v = v[parts[i]]; }
    return v;
  }
  function interp(str, scope) {
    return str.replace(HOLE, function (_, p) { var v = lookup(p, scope); return v == null ? '' : String(v); });
  }
  function renderChildren(src, dst, scope) {
    for (var c = src.firstChild; c; c = c.nextSibling) renderNode(c, dst, scope);
  }
  function renderNode(node, dst, scope) {
    if (node.nodeType === 3) { dst.appendChild(document.createTextNode(interp(node.nodeValue, scope))); return; }
    if (node.nodeType !== 1) return;
    var tag = node.localName;
    if (tag === 'sc-for') {
      var list = lookup((node.getAttribute('list') || '').replace(/^\{\{|\}\}$/g, ''), scope) || [];
      var as = node.getAttribute('as') || 'item';
      list.forEach(function (item, i) {
        var s = Object.create(scope); s[as] = item; s.$index = i;
        renderChildren(node, dst, s);
      });
      return;
    }
    if (tag === 'sc-if') {
      var val = lookup((node.getAttribute('value') || '').replace(/^\{\{|\}\}$/g, ''), scope);
      if (val) renderChildren(node, dst, scope);
      return;
    }
    var el = node.namespaceURI === 'http://www.w3.org/2000/svg'
      ? document.createElementNS(node.namespaceURI, node.localName) : document.createElement(node.localName);
    for (var a = 0; a < node.attributes.length; a++) {
      var at = node.attributes[a], name = at.name, raw = at.value;
      if (name.indexOf('hint-') === 0) continue;
      var m = raw.match(FULL);
      if (m) {
        var v = lookup(m[1], scope);
        if (name.indexOf('on') === 0 && typeof v === 'function') { el.addEventListener(name.slice(2), v); continue; }
        if (name === 'defaultchecked' || name === 'checked') { if (v) { el.setAttribute('checked', ''); el.checked = true; } continue; }
        if (name === 'defaultvalue') { el.setAttribute('value', v == null ? '' : String(v)); continue; }
        if (v == null || v === false && name.indexOf('aria-') !== 0) continue;
        el.setAttribute(name, String(v));
      } else if (name === 'defaultvalue') { el.setAttribute('value', raw);
      } else if (name === 'defaultchecked') { el.setAttribute('checked', '');
      } else { el.setAttribute(name, interp(raw, scope)); }
    }
    renderChildren(node.localName === 'template' ? node.content : node, el, scope);
    dst.appendChild(el);
  }
  function DCLogic(props) { this.props = props || {}; this.state = null; }
  DCLogic.prototype.setState = function (o) {
    this.state = Object.assign({}, this.state || {}, o);
    this.__render();
  };
  DCLogic.prototype.forceUpdate = function () { this.__render(); };
  window.DCLogic = DCLogic;
  window.DC = {
    mount: function (Comp, meta) {
      var props = {};
      Object.keys(meta).forEach(function (k) { if (k[0] !== '$' && meta[k] && 'default' in meta[k]) props[k] = meta[k]['default']; });
      /* Sessione demo: il ruolo arriva da DTPAuth; senza permesso la pagina non viene disegnata. */
      var auth = window.DTPAuth, access = auth ? auth.enter(meta) : null;
      if (!access) return;
      if (meta.persona && meta.persona.options) props.persona = access.role;
      var tpl = document.getElementById('tpl').content, root = document.getElementById('app');
      var c = new Comp(props);
      c.__render = function () {
        var frag = document.createDocumentFragment();
        renderChildren(tpl, frag, c.renderVals());
        root.replaceChildren(frag);
        auth.decorate(root);
      };
      c.__render();
    }
  };
})();

</script>
<script>

class Component extends DCLogic {
  renderVals() {
    var self = this;
    var st = this.state || {};
    var P = this.props.persona;
    var WHO = {
      lr: { name: 'Paolo Ferretti', role: 'Legale rappresentante', ini: 'PF' },
      amm: { name: 'Giulia Marchetti', role: 'Delegato amministrativo', ini: 'GM' },
      op: { name: 'Davide Sala', role: 'Delegato operativo', ini: 'DS' }
    };
