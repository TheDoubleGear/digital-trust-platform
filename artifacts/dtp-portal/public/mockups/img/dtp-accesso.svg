<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" role="img" aria-labelledby="t">
  <title id="t">Illustrazione: area clienti della piattaforma con consumi, identità verificata, firma e sicurezza</title>
  <defs>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#00143D" flood-opacity=".38"/>
    </filter>
    <linearGradient id="area" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0047BB" stop-opacity=".28"/>
      <stop offset="1" stop-color="#0047BB" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- trama di fondo -->
  <circle cx="290" cy="210" r="180" fill="#FFFFFF" opacity=".07"/>
  <circle cx="290" cy="210" r="140" fill="none" stroke="#FFFFFF" stroke-opacity=".18" stroke-dasharray="4 9"/>
  <g fill="#FFFFFF" opacity=".25">
    <circle cx="44" cy="52" r="3"/><circle cx="72" cy="52" r="3"/><circle cx="100" cy="52" r="3"/>
    <circle cx="44" cy="80" r="3"/><circle cx="72" cy="80" r="3"/><circle cx="100" cy="80" r="3"/>
    <circle cx="460" cy="368" r="3"/><circle cx="488" cy="368" r="3"/><circle cx="516" cy="368" r="3"/>
    <circle cx="460" cy="396" r="3"/><circle cx="488" cy="396" r="3"/><circle cx="516" cy="396" r="3"/>
  </g>

  <!-- finestra dell'area clienti -->
  <g filter="url(#sh)">
    <rect x="96" y="70" width="380" height="270" rx="16" fill="#FFFFFF"/>
    <path d="M96 86a16 16 0 0 1 16-16h348a16 16 0 0 1 16 16v20H96z" fill="#EEDC00"/>
    <circle cx="118" cy="88" r="5" fill="#0B2A5B" opacity=".35"/><circle cx="134" cy="88" r="5" fill="#0B2A5B" opacity=".35"/><circle cx="150" cy="88" r="5" fill="#0B2A5B" opacity=".35"/>
    <rect x="186" y="82" width="150" height="12" rx="6" fill="#FFFFFF" opacity=".75"/>
    <!-- barra laterale -->
    <rect x="96" y="106" width="78" height="234" fill="#F2F7FF"/>
    <path d="M96 324v0a16 16 0 0 0 16 16h62v-234H96z" fill="#F2F7FF"/>
    <rect x="110" y="124" width="50" height="10" rx="5" fill="#0047BB"/>
    <rect x="110" y="146" width="44" height="8" rx="4" fill="#C9D6EC"/>
    <rect x="110" y="164" width="50" height="8" rx="4" fill="#C9D6EC"/>
    <rect x="110" y="182" width="38" height="8" rx="4" fill="#C9D6EC"/>
    <rect x="110" y="200" width="46" height="8" rx="4" fill="#C9D6EC"/>
    <!-- indicatori -->
    <rect x="190" y="122" width="82" height="52" rx="8" fill="#F2F7FF"/>
    <rect x="202" y="134" width="40" height="7" rx="3.5" fill="#C9D6EC"/>
    <rect x="202" y="150" width="54" height="12" rx="6" fill="#0B2A5B"/>
    <rect x="282" y="122" width="82" height="52" rx="8" fill="#F2F7FF"/>
    <rect x="294" y="134" width="40" height="7" rx="3.5" fill="#C9D6EC"/>
    <rect x="294" y="150" width="46" height="12" rx="6" fill="#0047BB"/>
    <rect x="374" y="122" width="86" height="52" rx="8" fill="#F2F7FF"/>
    <rect x="386" y="134" width="40" height="7" rx="3.5" fill="#C9D6EC"/>
    <rect x="386" y="150" width="34" height="12" rx="6" fill="#EEDC00"/>
    <!-- andamento dei consumi -->
    <rect x="190" y="186" width="270" height="138" rx="8" fill="#F2F7FF"/>
    <rect x="204" y="198" width="90" height="8" rx="4" fill="#C9D6EC"/>
    <g stroke="#DCE6F7" stroke-width="1"><line x1="204" y1="236" x2="446" y2="236"/><line x1="204" y1="266" x2="446" y2="266"/><line x1="204" y1="296" x2="446" y2="296"/></g>
    <line x1="204" y1="244" x2="446" y2="244" stroke="#B42318" stroke-opacity=".5" stroke-width="1.5" stroke-dasharray="5 5"/>
    <path d="M204 306 C230 300 244 292 262 288 S296 272 314 270 S348 258 366 254 S402 252 420 246 L446 240 V310 H204Z" fill="url(#area)"/>
    <path d="M204 306 C230 300 244 292 262 288 S296 272 314 270 S348 258 366 254 S402 252 420 246 L446 240" fill="none" stroke="#0047BB" stroke-width="3" stroke-linecap="round"/>
    <circle cx="446" cy="240" r="5" fill="#0047BB" stroke="#FFFFFF" stroke-width="2"/>
  </g>

  <!-- documento d'identità verificato -->
  <g filter="url(#sh)" transform="rotate(-7 118 318)">
    <rect x="40" y="276" width="158" height="96" rx="12" fill="#FFFFFF"/>
    <rect x="40" y="276" width="158" height="22" rx="12" fill="#EEDC00"/>
    <rect x="40" y="288" width="158" height="10" fill="#EEDC00"/>
    <circle cx="78" cy="330" r="18" fill="#DCE6F7"/>
    <circle cx="78" cy="324" r="7" fill="#0047BB"/>
    <path d="M64 344c3-9 9-12 14-12s11 3 14 12" fill="#0047BB"/>
    <rect x="106" y="316" width="72" height="7" rx="3.5" fill="#C9D6EC"/>
    <rect x="106" y="330" width="56" height="7" rx="3.5" fill="#C9D6EC"/>
    <rect x="106" y="344" width="64" height="7" rx="3.5" fill="#C9D6EC"/>
  </g>

  <!-- scudo -->
  <g filter="url(#sh)">
    <path d="M478 40l50 19v38c0 33-21 56-50 66-29-10-50-33-50-66V59z" fill="#EEDC00"/>
    <path d="M478 54l36 13v30c0 24-15 41-36 49-21-8-36-25-36-49V67z" fill="#FFF7A8" opacity=".55"/>
    <path d="M459 100l13 13 26-29" fill="none" stroke="#0B2A5B" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- firma digitale -->
  <g filter="url(#sh)">
    <rect x="404" y="282" width="128" height="78" rx="12" fill="#FFFFFF"/>
    <path d="M420 330c10-18 18-22 21-12s-5 15 3 9 11-17 18-10 2 13 10 8 10-8 16-7" fill="none" stroke="#0B2A5B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="420" y1="342" x2="514" y2="342" stroke="#9FB2D3" stroke-width="2"/>
    <circle cx="514" cy="300" r="13" fill="#0047BB"/>
    <path d="M508 300l4 4 8-8" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
