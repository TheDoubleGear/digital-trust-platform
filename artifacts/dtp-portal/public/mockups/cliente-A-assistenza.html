<!doctype html>

<body>
<div id="app"></div>
<template id="tpl">

<div class="dtp-root" style="min-height: 100dvh; background: #F3F7FC; font-family: 'Inter', system-ui, sans-serif; color: #1A1C1E; font-variant-numeric: tabular-nums">

<div>
<div style="font-weight: 800; font-size: 21px; letter-spacing: -0.03em; line-height: 1.1; color: #0047BB">postel</div>
<div style="font-size: 12px; color: #33383D">Digital Trust Platform</div>
</div>
</div>
<nav aria-label="Pagine del portale" style="display: flex; flex-wrap: wrap; gap: 4px; flex: 1 1 420px">
<sc-if class="dtp-navlink" value="{{navFull}}" hint-placeholder-val="{{ true }}"><a href="cliente-H-catalogo.html" style="padding: 10px 16px; border-radius: 999px; font-size: 14px; font-weight: 500; text-decoration: none; color: #33383D">Catalogo e acquisti</a></sc-if>
<sc-if class="dtp-navlink" value="{{navFull}}" hint-placeholder-val="{{ true }}"><a href="cliente-U-utenze.html" style="padding: 10px 16px; border-radius: 999px; font-size: 14px; font-weight: 500; text-decoration: none; color: #33383D">Utenze e deleghe</a></sc-if>

<a class="dtp-iconbtn" href="cliente-N-notifiche.html" aria-label="Notifiche, 3 non lette" style="position: relative; width: 44px; height: 44px; border-radius: 999px; border: 1px solid #FFFFFF; background: #FFFFFF; display: flex; align-items: center; justify-content: center">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1A1C1E" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.7 21a2 2 0 0 1-3.4 0"></path></svg>
<span style="position: absolute; top: 6px; right: 6px; min-width: 18px; height: 18px; border-radius: 9px; background: #C7322A; color: #FFFFFF; font-size: 11px; font-weight: 600; display: flex; align-items: center; justify-content: center; padding: 0 4px">3</span>

<div style="display: flex; align-items: center; gap: 10px">
<div aria-hidden="true" style="width: 36px; height: 36px; border-radius: 18px; background: #0047BB; color: #FFFFFF; font-size: 13px; font-weight: 600; display: flex; align-items: center; justify-content: center">{{who.ini}}</div>
<div style="line-height: 1.25">
<div style="font-size: 14px; font-weight: 600">{{who.name}}</div>
<div style="font-size: 12px; color: #33383D">{{who.role}} · Assicurazioni Aurora S.p.A.</div>
</div>
</div>
</div>
</header>

<main class="dtp-main" style="max-width: 1360px; margin: 0 auto; padding: 0 32px 48px; display: flex; flex-direction: column; gap: 20px">

<div class="dtp-hero dtp-hero-bleed" style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 16px">
<div>
<h1 style="margin: 0; font-size: 26px; font-weight: 600; letter-spacing: -0.01em">Assistenza</h1>
<p style="margin: 4px 0 0; font-size: 14px; color: #4D5762">Trova la risposta nelle guide oppure apri una richiesta: la prende in carico il supporto Postel e, se serve, la passa agli specialisti.</p>
</div>
<label style="position: relative; display: flex; align-items: center; flex: 0 1 420px">
<span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Cerca nelle guide</span>
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#4D5762" stroke-width="2" stroke-linecap="round" aria-hidden="true" style="position: absolute; left: 12px"><path d="M11 19a8 8 0 1 0 0-16 8 8 0 0 0 0 16z M21 21l-4.3-4.3"></path></svg>
<input type="search" placeholder="Cerca nelle guide, ad esempio «soglie» o «delega»" style="width: 100%; min-height: 44px; padding: 0 12px 0 40px; border-radius: 6px; border: 1px solid #B8C2CF; background: #FFFFFF; font: inherit; font-size: 14px; color: #1A1C1E">
</label>
</div>

<section aria-label="Risorse self-service" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px">
<sc-for list="{{selfs}}" as="s" hint-placeholder-count="4">
<a class="dtp-card dtp-linkcard" href="#guide" style="background: #FFFFFF; border: 1px solid #D9E1EC; border-radius: 6px; padding: 20px; display: flex; flex-direction: column; gap: 8px; text-decoration: none; color: #1A1C1E">
<span aria-hidden="true" style="width: 40px; height: 40px; border-radius: 6px; background: {{s.bg}}; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="{{s.fg}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="{{s.icon}}"></path></svg></span>
<span style="font-size: 16px; font-weight: 600">{{s.title}}</span>
<span style="font-size: 13px; color: #4D5762; line-height: 1.45">{{s.text}}</span>
</a>
</sc-for>
</section>

<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(420px, 1fr)); gap: 20px; align-items: start">

<section class="dtp-card" aria-labelledby="titolo-nuova" style="background: #FFFFFF; border: 1px solid #D9E1EC; border-radius: 6px; padding: 24px; display: flex; flex-direction: column; gap: 14px">
<h2 id="titolo-nuova" style="margin: 0; font-size: 18px; font-weight: 600">Apri una richiesta</h2>
<div role="group" aria-label="Argomento" style="display: flex; flex-wrap: wrap; gap: 6px">
<sc-for list="{{topics}}" as="t" hint-placeholder-count="4">
<button class="dtp-chip" type="button" aria-pressed="{{t.pressed}}" onClick="{{t.pick}}" style="min-height: 40px; padding: 0 14px; border-radius: 999px; border: 1px solid {{t.border}}; background: {{t.bg}}; color: {{t.fg}}; font: inherit; font-size: 13px; font-weight: 600; cursor: pointer">{{t.label}}</button>
</sc-for>
</div>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px">
<label style="display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: #4D5762; font-weight: 500">Collega la richiesta a
<select style="min-height: 44px; padding: 0 12px; border-radius: 6px; border: 1px solid #B8C2CF; background: #FFFFFF; font: inherit; font-size: 14px; color: #1A1C1E"><option>Una transazione</option><option>Un servizio</option><option>Un ordine</option><option>Una fattura</option><option>Nessun elemento</option></select>
</label>
<label style="display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: #4D5762; font-weight: 500">Identificativo della transazione
<input type="text" value="TRX-7F3A-20261110-0042" style="min-height: 44px; padding: 0 12px; border-radius: 6px; border: 1px solid #B8C2CF; background: #FFFFFF; font: inherit; font-size: 14px; color: #1A1C1E">
</label>
<label style="display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: #4D5762; font-weight: 500">Priorità
<select style="min-height: 44px; padding: 0 12px; border-radius: 6px; border: 1px solid #B8C2CF; background: #FFFFFF; font: inherit; font-size: 14px; color: #1A1C1E"><option>Normale</option><option>Alta: servizio bloccato</option><option>Bassa: informazione</option></select>
</label>
</div>
<label style="display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: #4D5762; font-weight: 500">Oggetto
<input type="text" value="{{draft.subject}}" style="min-height: 44px; padding: 0 12px; border-radius: 6px; border: 1px solid #B8C2CF; background: #FFFFFF; font: inherit; font-size: 14px; color: #1A1C1E">
</label>
<label style="display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: #4D5762; font-weight: 500">Descrizione
<textarea rows="4" style="padding: 10px 12px; border-radius: 6px; border: 1px solid #B8C2CF; background: #FFFFFF; font: inherit; font-size: 14px; color: #1A1C1E; resize: vertical">{{draft.text}}</textarea>
</label>
<div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 12px">
<button class="dtp-btn dtp-btn-o" type="button" style="min-height: 44px; padding: 0 20px; border-radius: 999px; border: 1px solid #B8C2CF; background: #FFFFFF; font: inherit; font-size: 14px; font-weight: 600; color: #1A1C1E; cursor: pointer">Allega file</button>
<button class="dtp-btn dtp-btn-p" type="button" onClick="{{send}}" style="min-height: 44px; padding: 0 20px; border-radius: 999px; border: 0; background: #0047BB; font: inherit; font-size: 14px; font-weight: 600; color: #FFFFFF; cursor: pointer">{{sendLabel}}</button>
</div>
<p style="margin: 0; font-size: 12px; color: #4D5762; line-height: 1.5">La richiesta è associata ad Assicurazioni Aurora S.p.A. e all'elemento indicato, così il supporto vede subito il contesto.</p>
</section>

<section class="dtp-card" aria-labelledby="titolo-stato" style="background: #FFFFFF; border: 1px solid #D9E1EC; border-radius: 6px; padding: 24px; display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap">
<h2 id="titolo-stato" style="margin: 0; font-size: 18px; font-weight: 600">Stato dei servizi</h2>
<span style="display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; color: #1A6B4A"><span aria-hidden="true" style="width: 8px; height: 8px; border-radius: 4px; background: #2E8B62"></span>Tutti operativi</span>
</div>
<ul style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column">
<sc-for list="{{status}}" as="s" hint-placeholder-count="4">
<li style="display: flex; justify-content: space-between; gap: 12px; padding: 10px 0; border-bottom: 1px solid #EAEFF5; font-size: 14px"><span>{{s.name}}</span><span style="display: flex; align-items: center; gap: 6px; font-size: 13px; color: {{s.fg}}; font-weight: 600"><span aria-hidden="true" style="width: 8px; height: 8px; border-radius: 4px; background: {{s.dot}}"></span>{{s.state}}</span></li>
</sc-for>
</ul>
<p style="margin: 0; font-size: 13px; color: #4D5762; line-height: 1.45">Ultimo incidente: rallentamento delle identificazioni il 6 nov dalle 10:12 alle 10:40, risolto.</p>
</section>

</div>

<section class="dtp-card" aria-labelledby="titolo-richieste" style="background: #FFFFFF; border: 1px solid #D9E1EC; border-radius: 6px; padding: 24px; display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 12px">
<div>
<h2 id="titolo-richieste" style="margin: 0; font-size: 18px; font-weight: 600">{{listTitle}}</h2>
<p style="margin: 4px 0 0; font-size: 13px; color: #4D5762">Ogni aggiornamento ti arriva anche come notifica.</p>
</div>
</div>
<div style="overflow-x: auto">
<div role="table" aria-label="Richieste di assistenza" style="min-width: 980px; font-size: 13px">
<div role="row" style="display: grid; grid-template-columns: 0.9fr 2.2fr 1.4fr 1.3fr 1.2fr 1.3fr; gap: 12px; padding: 10px 12px; border-bottom: 1px solid #D9E1EC; color: #4D5762; font-weight: 500">
<span role="columnheader">Richiesta</span><span role="columnheader">Oggetto</span><span role="columnheader">Collegata a</span><span role="columnheader">In carico a</span><span role="columnheader">Stato</span><span role="columnheader">Ultimo aggiornamento</span>
</div>
<sc-for list="{{tickets}}" as="t" hint-placeholder-count="4">
<div role="row" style="display: grid; grid-template-columns: 0.9fr 2.2fr 1.4fr 1.3fr 1.2fr 1.3fr; gap: 12px; padding: 12px; border-bottom: 1px solid #EAEFF5; align-items: center">
<a role="cell" href="#ticket" style="font-weight: 600; text-decoration: none">{{t.id}}</a>
<span role="cell" style="display: flex; flex-direction: column; gap: 2px"><span style="font-weight: 600">{{t.subject}}</span><span style="color: #4D5762">aperta da {{t.by}}</span></span>
<span role="cell" style="color: #3A424C">{{t.link}}</span>
<span role="cell">{{t.owner}}</span>
<span role="cell"><span style="display: inline-block; padding: 3px 10px; border-radius: 999px; background: {{t.bg}}; color: {{t.fg}}; font-size: 12px; font-weight: 600">{{t.state}}</span></span>
<span role="cell" style="color: #3A424C">{{t.when}}</span>
</div>
</sc-for>
</div>
</div>
</section>

</main>
</div>
</template>
<script>
/* Mini runtime per le pagine esportate: template {{ }}, sc-for, sc-if, onClick, setState. */
(function () {

    if (tag === 'sc-for') {
      var list = lookup((node.getAttribute('list') || '').replace(/^\{\{|\}\}$/g, ''), scope) || [];
      var as = node.getAttribute('as') || 'item';
      list.forEach(function (item, i) {
        var s = Object.create(scope); s[as] = item; s.$index = i;
        renderChildren(node, dst, s);
      });
      return;
    }
    if (tag === 'sc-if') {

      ? document.createElementNS(node.namespaceURI, node.localName) : document.createElement(node.localName);

      if (name.indexOf('hint-') === 0) continue;

        var v = lookup(m[1], scope);

      'Integrazione tecnica': ['Webhook non consegnati verso il nostro endpoint', 'Da ieri alcuni eventi di esito non arrivano: allego l\'identificativo della transazione.']
    };
    var sent = st.sent || [];
    var send = function () { if (sent.indexOf(topic) < 0) set({ sent: sent.concat([topic]) }); };
    var dot = function (s) { return s === 'Operativo' ? ['#2E8B62', '#1A6B4A'] : ['#E0A100', '#855800']; };
    var status = ['Identità e verifica', 'Firma elettronica', 'Contratti e documenti', 'Fatturazione'].map(function (n) { var s = 'Operativo', d = dot(s); return { name: n, state: s, dot: d[0], fg: d[1] }; });
    var TS = { open: ['Aperta', '#E5EFFF', '#0047BB'], work: ['In lavorazione', '#FDF1D6', '#855800'], wait: ['In attesa di tua risposta', '#FDE7DC', '#B03A0B'], closed: ['Chiusa', '#E3F3EA', '#1A6B4A'] };
    var base = [
      ['TCK-20418', 'Esito negativo su una identificazione', 'Davide Sala', 'Transazione TRX-7F3A-…-0039', 'Specialisti Postel (L2)', 'work', 'oggi 11:20 · passata agli specialisti', ['lr', 'op']],
      ['TCK-20391', 'Webhook non consegnati verso il nostro endpoint', 'Andrea Colombo', 'Servizio Fatture Elettroniche', 'Supporto Postel', 'wait', 'ieri 17:45 · richiesti i log dell\'endpoint', ['lr', 'tec']],
      ['TCK-20355', 'Overage di settembre: chiarimento', 'Giulia Marchetti', 'Fattura FT-2026-09044', 'Supporto Postel', 'closed', '2 ott · risolta con nota di dettaglio', ['lr', 'amm']],
      ['TCK-20302', 'Il delegato non ha ricevuto l\'invito', 'Paolo Ferretti', 'Delega operativa', 'Supporto Postel', 'closed', '12 set · invito inviato di nuovo', ['lr']]
    ];
    var tickets = sent.map(function (t, i) { return ['TCK-' + (20430 + i), DR[t][0], WHO[P].name, t === 'Integrazione tecnica' ? 'Servizio Fatture Elettroniche' : 'Transazione TRX-7F3A-…-0042', 'Supporto Postel', 'open', 'adesso · presa in carico entro 4 ore lavorative', [P, 'lr']]; }).reverse().concat(base)
      .filter(function (t) { return t[7].indexOf(P) >= 0; })
      .map(function (t) { var s = TS[t[5]]; return { id: t[0], subject: t[1], by: t[2], link: t[3], owner: t[4], state: s[0], bg: s[1], fg: s[2], when: t[6] }; });
    return {
      who: WHO[P], navFull: P !== 'tec', navTec: P === 'tec', selfs: selfs, topics: topics,
      draft: { subject: DR[topic][0], text: DR[topic][1] },
      send: send, sendLabel: sent.indexOf(topic) >= 0 ? 'Richiesta inviata' : 'Invia la richiesta',
      status: status, tickets: tickets,
      listTitle: P === 'lr' ? 'Richieste della tua azienda' : 'Le tue richieste'
    };
  }
}
