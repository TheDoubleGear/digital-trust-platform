<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Catalogo e acquisti – Portale cliente</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;family=IBM+Plex+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F3F7FC}
*{box-sizing:border-box}
a{color:#0047BB}a:hover{color:#003A99}
</style>
<link rel="stylesheet" href="dtp-theme.css">
<link rel="icon" type="image/svg+xml" href="../favicon.svg">
<link rel="stylesheet" href="dtp-auth.css">
<script src="dtp-auth.js"></script>
</head>
<body>
<div id="app"></div>
<template id="tpl">

<div class="dtp-root" style="min-height: 100dvh; background: #F3F7FC; font-family: 'Inter', system-ui, sans-serif; color: #1A1C1E; font-variant-numeric: tabular-nums; position: relative">

<div class="dtp-projectbar" style="background: #F2F8FF; color: #1A1C1E; border-bottom: 1px solid #D9E1EC">
<div style="max-width: 1360px; margin: 0 auto; padding: 8px 32px; display: flex; flex-wrap: wrap; align-items: center; gap: 12px">
<a class="dtp-home" href="../workspace" title="Torna a Workspace / 2026" data-testid="link-home">Home</a>
<span class="dtp-session"><span class="dtp-session-tag">Accesso demo</span><span class="dtp-session-who" data-testid="text-current-role"><span data-dtp-role></span></span><button class="dtp-logout" type="button" data-dtp-logout data-testid="button-logout">Esci</button></span>
</div>
</div>

<header class="dtp-header" style="background: #EEDC00; border-bottom: 1px solid #D6C600">
<div style="max-width: 1360px; margin: 0 auto; padding: 10px 32px; display: flex; flex-wrap: wrap; align-items: center; gap: 24px">
<div style="display: flex; align-items: center; gap: 10px">
<svg width="34" height="34" viewBox="0 0 34 34" aria-hidden="true"><rect width="34" height="34" rx="9" fill="#0047BB"></rect><path d="M17 7l8 3v6c0 5-3.4 8.6-8 10-4.6-1.4-8-5-8-10v-6z" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linejoin="round"></path><path d="M13 16.5l3 3 5-5.5" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg>
<div>
<div style="font-weight: 800; font-size: 21px; letter-spacing: -0.03em; line-height: 1.1; color: #0047BB">postel</div>
<div style="font-size: 12px; color: #33383D">Digital Trust Platform</div>
</div>
</div>
<nav aria-label="Pagine del portale" style="display: flex; flex-wrap: wrap; gap: 4px; flex: 1 1 420px">
<a class="dtp-navlink" href="cliente-H-catalogo.html" aria-current="page" style="padding: 10px 16px; border-radius: 999px; font-size: 14px; font-weight: 600; text-decoration: none; color: #FFFFFF; background: #0047BB">Catalogo e acquisti</a>
<a class="dtp-navlink" href="cliente-U-utenze.html" style="padding: 10px 16px; border-radius: 999px; font-size: 14px; font-weight: 500; text-decoration: none; color: #33383D">Utenze e deleghe</a>
<a class="dtp-navlink" href="cliente-M1-panoramica.html" style="padding: 10px 16px; border-radius: 999px; font-size: 14px; font-weight: 500; text-decoration: none; color: #33383D">Contratto e consumi</a>
<a class="dtp-navlink" href="cliente-A-assistenza.html" style="padding: 10px 16px; border-radius: 999px; font-size: 14px; font-weight: 500; text-decoration: none; color: #33383D">Assistenza</a>
</nav>
<a class="dtp-iconbtn" href="cliente-N-notifiche.html" aria-label="Notifiche, 3 non lette" style="position: relative; width: 44px; height: 44px; border-radius: 999px; border: 1px solid #FFFFFF; background: #FFFFFF; display: flex; align-items: center; justify-content: center">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1A1C1E" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.7 21a2 2 0 0 1-3.4 0"></path></svg>
<span style="position: absolute; top: 6px; right: 6px; min-width: 18px; height: 18px; border-radius: 9px; background: #C7322A; color: #FFFFFF; font-size: 11px; font-weight: 600; display: flex; align-items: center; justify-content: center; padding: 0 4px">3</span>
</a>
<div style="display: flex; align-items: center; gap: 10px">
<div aria-hidden="true" style="width: 36px; height: 36px; border-radius: 18px; background: #0047BB; color: #FFFFFF; font-size: 13px; font-weight: 600; display: flex; align-items: center; justify-content: center">{{who.ini}}</div>
<div style="line-height: 1.25">
<div style="font-size: 14px; font-weight: 600">{{who.name}}</div>
<div style="font-size: 12px; color: #33383D">{{who.role}} · Assicurazioni Aurora S.p.A.</div>
</div>
</div>
</div>
</header>

<main class="dtp-main" style="max-width: 1360px; margin: 0 auto; padding: 0 32px 48px; display: flex; flex-direction: column; gap: 24px">

<section class="dtp-hero dtp-hero-bleed" aria-label="Benvenuto" style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 16px">
<div>
<h1 style="margin: 0; font-size: 28px; font-weight: 600; letter-spacing: -0.01em">Buongiorno, {{who.first}}</h1>
<p style="margin: 6px 0 0; font-size: 14px; color: #4D5762">Assicurazioni Aurora S.p.A. · Bundle Medium attivo fino al 28 feb 2027 · rinnovo tra 124 giorni · dati al 27 ott 2026</p>
</div>
<div style="display: flex; flex-wrap: wrap; gap: 10px">
<a class="dtp-linkcard" href="cliente-M1-panoramica.html" style="display: flex; flex-direction: column; gap: 2px; padding: 10px 14px; border-radius: 6px; background: #FFFFFF; border: 1px solid #D9E1EC; text-decoration: none; color: #1A1C1E; min-width: 150px"><span style="font-size: 20px; font-weight: 600">6 di 9</span><span style="font-size: 12px; color: #4D5762">servizi in soglia</span></a>
<a class="dtp-linkcard" href="cliente-M1-panoramica.html" style="display: flex; flex-direction: column; gap: 2px; padding: 10px 14px; border-radius: 6px; background: #FFFFFF; border: 1px solid #D9E1EC; text-decoration: none; color: #1A1C1E; min-width: 150px"><span style="font-size: 20px; font-weight: 600; color: #A3201A">1</span><span style="font-size: 12px; color: #4D5762">servizio esaurito</span></a>
<a class="dtp-linkcard" href="#ordini" style="display: flex; flex-direction: column; gap: 2px; padding: 10px 14px; border-radius: 6px; background: #FFFFFF; border: 1px solid #D9E1EC; text-decoration: none; color: #1A1C1E; min-width: 150px"><span style="font-size: 20px; font-weight: 600">{{orderCount}}</span><span style="font-size: 12px; color: #4D5762">ordini in attivazione</span></a>
</div>
</section>

<sc-if value="{{f.lr}}" hint-placeholder-val="{{ true }}">
<section class="dtp-card" aria-labelledby="titolo-decidere" style="background: #FFFFFF; border: 2px solid #0047BB; border-radius: 6px; padding: 20px 22px; display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap">
<h2 id="titolo-decidere" style="margin: 0; font-size: 18px; font-weight: 600">Da decidere · 3</h2>
<span style="font-size: 12px; color: #4D5762">Solo il legale rappresentante vede questo riquadro</span>
</div>
<ul style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column">
<sc-for list="{{decide}}" as="d" hint-placeholder-count="3">
<li style="display: flex; flex-wrap: wrap; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid #EAEFF5">
<span style="flex: none; padding: 3px 9px; border-radius: 999px; font-size: 12px; font-weight: 600; background: #E5EFFF; color: #0047BB">{{d.kind}}</span>
<span style="flex: 1 1 360px; display: flex; flex-direction: column; gap: 2px"><strong style="font-size: 14px; font-weight: 600">{{d.what}}</strong><span style="font-size: 12px; color: #4D5762">{{d.meta}}</span></span>
<button class="dtp-btn dtp-btn-o" type="button" onClick="{{d.act}}" style="min-height: 44px; padding: 0 18px; border-radius: 999px; border: 1px solid #0047BB; background: #FFFFFF; color: #0047BB; font: inherit; font-size: 13px; font-weight: 600; cursor: pointer">{{d.btn}}</button>
</li>
</sc-for>
</ul>
</section>
</sc-if>

<section aria-label="Avvisi" style="display: flex; flex-direction: column; gap: 10px">
<sc-for list="{{alerts}}" as="a" hint-placeholder-count="2">
<div role="status" style="display: flex; flex-wrap: wrap; align-items: center; gap: 14px; padding: 14px 18px; border-radius: 6px; background: {{a.bg}}; border: 1px solid {{a.border}}">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="{{a.fg}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"></path><path d="M12 9v4"></path><path d="M12 17h.01"></path></svg>
<p style="margin: 0; flex: 1 1 420px; font-size: 14px; line-height: 1.45; color: #2A1206"><strong style="font-weight: 600">{{a.title}}</strong> {{a.text}}</p>
<button class="dtp-btn" type="button" onClick="{{a.act}}" style="min-height: 44px; padding: 0 20px; border-radius: 999px; border: 0; background: {{a.btnBg}}; color: #FFFFFF; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer">{{a.btn}}</button>
</div>
</sc-for>
</section>

<div style="display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-start">
<div style="flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column; gap: 16px">

<section class="dtp-card" aria-labelledby="titolo-attive" style="background: #FFFFFF; border: 1px solid #D9E1EC; border-radius: 6px; padding: 22px; display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap">
<h2 id="titolo-attive" style="margin: 0; font-size: 18px; font-weight: 600">Le tue offerte attive</h2>
<a href="cliente-M1-panoramica.html" style="font-size: 13px; font-weight: 600; text-decoration: none; padding: 10px 0">Consumi e soglie →</a>
</div>
<div style="display: flex; flex-wrap: wrap; gap: 16px; align-items: center; padding: 16px; border-radius: 6px; border: 1px solid #0047BB; background: #F2F8FF">
<div style="flex: 1 1 260px; display: flex; flex-direction: column; gap: 4px">
<div style="display: flex; align-items: center; gap: 8px"><span style="font-size: 16px; font-weight: 600">Bundle Medium</span><span style="padding: 2px 8px; border-radius: 999px; background: #E3F3EA; color: #1A6B4A; font-size: 12px; font-weight: 600">Attivo</span></div>
<span style="font-size: 13px; color: #4D5762">9 servizi inclusi · 01 mar 2026 → 28 feb 2027 · contratto DTP-2026-0418</span>
</div>
<sc-if value="{{f.money}}" hint-placeholder-val="{{ true }}">
<div style="text-align: right"><div style="font-size: 18px; font-weight: 600">€ 19.900 / anno</div><div style="font-size: 12px; color: #4D5762">canone fatturato a trimestri</div></div>
</sc-if>
</div>
<p style="margin: 0; font-size: 13px; color: #4D5762">Offerte singole e ricariche attive: nessuna. Tutti i servizi del catalogo sono inclusi nel tuo bundle.</p>
</section>

<section class="dtp-card" id="ordini" aria-labelledby="titolo-ordini" style="background: #FFFFFF; border: 1px solid #D9E1EC; border-radius: 6px; padding: 22px; display: flex; flex-direction: column; gap: 10px">
<h2 id="titolo-ordini" style="margin: 0; font-size: 18px; font-weight: 600">{{ordersTitle}}</h2>
<ul style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column">
<sc-for list="{{orders}}" as="o" hint-placeholder-count="2">
<li style="display: flex; flex-wrap: wrap; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid #EAEFF5">
<div style="flex: 1 1 280px; display: flex; flex-direction: column; gap: 2px">
<span style="font-size: 14px; font-weight: 600">{{o.what}}</span>
<span style="font-size: 12px; color: #4D5762">{{o.meta}}</span>
</div>
<span style="padding: 3px 10px; border-radius: 999px; font-size: 12px; font-weight: 600; background: {{o.bg}}; color: {{o.fg}}">{{o.state}}</span>
<span style="min-width: 90px; text-align: right; font-size: 14px; font-weight: 600">{{o.amount}}</span>
</li>
</sc-for>
</ul>
</section>
</div>

<aside aria-label="Riepilogo" style="flex: 1 1 340px; min-width: 0">
<sc-if value="{{f.buy}}" hint-placeholder-val="{{ true }}">
<section class="dtp-card" aria-labelledby="titolo-carrello" style="background: #FFFFFF; border: 1px solid #D9E1EC; border-radius: 6px; padding: 22px; display: flex; flex-direction: column; gap: 14px">
<h2 id="titolo-carrello" style="margin: 0; font-size: 18px; font-weight: 600">Riepilogo ordine</h2>
<sc-if value="{{cart.empty}}" hint-placeholder-val="{{ false }}">
<p style="margin: 0; font-size: 14px; color: #4D5762">Nessun articolo. Aggiungi una ricarica o un bundle dal catalogo qui sotto.</p>
</sc-if>
<ul style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px">
<sc-for list="{{cart.items}}" as="c" hint-placeholder-count="1">
<li style="display: flex; align-items: center; gap: 10px">
<div style="flex: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 14px; font-weight: 600">{{c.name}}</span><span style="font-size: 12px; color: #4D5762">{{c.pack}}</span></div>
<span style="font-size: 14px; font-weight: 600">{{c.price}}</span>
<button class="dtp-btn dtp-btn-o" type="button" onClick="{{c.remove}}" aria-label="Rimuovi {{c.name}}" style="width: 44px; height: 44px; border-radius: 999px; border: 1px solid #D9E1EC; background: #FFFFFF; cursor: pointer; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#4D5762" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"></path></svg></button>
</li>
</sc-for>
</ul>
<div style="display: flex; justify-content: space-between; padding-top: 12px; border-top: 1px solid #EAEFF5; font-size: 15px"><span>Totale IVA esclusa</span><strong style="font-weight: 700">{{cart.total}}</strong></div>
<label style="display: flex; gap: 10px; align-items: flex-start; font-size: 13px; color: #1A1C1E; line-height: 1.4"><input type="checkbox" style="width: 18px; height: 18px; margin-top: 1px"> Accetto le condizioni d'uso e il listino in vigore</label>
<button class="dtp-btn dtp-btn-p" type="button" onClick="{{cart.confirm}}" style="min-height: 48px; border-radius: 999px; border: 0; background: #0047BB; color: #FFFFFF; font: inherit; font-size: 15px; font-weight: 600; cursor: pointer">Conferma ordine</button>
<sc-if value="{{cart.done}}" hint-placeholder-val="{{ false }}">
<p role="status" style="margin: 0; padding: 10px 12px; border-radius: 6px; background: #E3F3EA; color: #1A6B4A; font-size: 13px; font-weight: 500">Ordine inviato. Lo trovi negli ordini con stato «In attivazione».</p>
</sc-if>
</section>
</sc-if>
<sc-if value="{{f.noBuy}}" hint-placeholder-val="{{ false }}">
<section class="dtp-card" aria-labelledby="titolo-richieste" style="background: #FFFFFF; border: 1px solid #D9E1EC; border-radius: 6px; padding: 22px; display: flex; flex-direction: column; gap: 12px">
<h2 id="titolo-richieste" style="margin: 0; font-size: 18px; font-weight: 600">Le tue richieste</h2>
<p style="margin: 0; font-size: 13px; color: #4D5762; line-height: 1.45">Gli acquisti li conferma il delegato amministrativo o il legale rappresentante. Le richieste che invii arrivano a entrambi.</p>
<ul style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px">
<sc-for list="{{requests}}" as="r" hint-placeholder-count="1">
<li style="display: flex; justify-content: space-between; gap: 8px; font-size: 14px; padding: 8px 0; border-bottom: 1px solid #EAEFF5"><span>{{r.name}}</span><span style="font-size: 12px; font-weight: 600; color: #855800">Inviata</span></li>
</sc-for>
</ul>
<sc-if value="{{noRequests}}" hint-placeholder-val="{{ true }}">
<p style="margin: 0; font-size: 13px; color: #4D5762">Nessuna richiesta inviata.</p>
</sc-if>
</section>
</sc-if>
</aside>
</div>

<section aria-labelledby="titolo-catalogo" style="display: flex; flex-direction: column; gap: 16px">
<div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 12px">
<div>
<h2 id="titolo-catalogo" style="margin: 0; font-size: 22px; font-weight: 600">Catalogo</h2>
<p style="margin: 4px 0 0; font-size: 13px; color: #4D5762">Bundle annuali, offerte singole e ricariche dei servizi Digital Trust</p>
</div>
<div style="display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-end">
<div class="dtp-seg" role="group" aria-label="Tipo di offerta" style="display: flex; gap: 4px; padding: 4px; border-radius: 999px; background: #E4EAF2">
<sc-for list="{{tabs}}" as="t" hint-placeholder-count="3">
<button class="dtp-btn" type="button" aria-pressed="{{t.pressed}}" onClick="{{t.pick}}" style="min-height: 40px; padding: 0 18px; border-radius: 999px; border: 0; background: {{t.bg}}; color: #1A1C1E; font: inherit; font-size: 13px; font-weight: {{t.weight}}; cursor: pointer">{{t.label}}</button>
</sc-for>
</div>
<label style="display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: #4D5762; font-weight: 500">Famiglia di servizi
<select style="min-height: 44px; min-width: 200px; padding: 0 12px; border-radius: 6px; border: 1px solid #B8C2CF; background: #FFFFFF; font: inherit; font-size: 14px; color: #1A1C1E"><option>Tutte</option><option>Identità e verifica</option><option>Contratti e documenti</option><option>Firma elettronica</option><option>Fatturazione</option></select>
</label>
</div>
</div>

<div style="display: flex; gap: 12px; align-items: flex-start; padding: 14px 18px; border-radius: 6px; background: #E5EFFF; border: 1px solid #BFD6FA">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#0047BB" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; margin-top: 1px"><circle cx="12" cy="12" r="10"></circle><path d="M12 16v-4"></path><path d="M12 8h.01"></path></svg>
<p style="margin: 0; font-size: 14px; line-height: 1.5">{{advice}}</p>
</div>

<sc-if value="{{show.bundles}}" hint-placeholder-val="{{ true }}">
<div style="display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap">
<h3 style="margin: 0; font-size: 16px; font-weight: 600">Bundle</h3>
<button class="dtp-btn dtp-btn-o" type="button" onClick="{{toggleCompare}}" aria-expanded="{{compareOpen}}" style="min-height: 44px; padding: 0 18px; border-radius: 999px; border: 1px solid #B8C2CF; background: #FFFFFF; font: inherit; font-size: 13px; font-weight: 600; color: #0047BB; cursor: pointer">{{compareLabel}}</button>
</div>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 14px">
<sc-for list="{{bundles}}" as="b" hint-placeholder-count="4">
<article class="dtp-card" style="background: #FFFFFF; border: {{b.border}}; border-radius: 6px; padding: 20px; display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; justify-content: space-between; align-items: center; gap: 8px; min-height: 24px">
<h4 style="margin: 0; font-size: 17px; font-weight: 600">{{b.name}}</h4>
<sc-if value="{{b.hasBadge}}" hint-placeholder-val="{{ false }}"><span style="padding: 3px 9px; border-radius: 999px; font-size: 12px; font-weight: 600; background: {{b.badgeBg}}; color: {{b.badgeFg}}">{{b.badge}}</span></sc-if>
</div>
<sc-if value="{{f.money}}" hint-placeholder-val="{{ true }}">
<div style="font-size: 22px; font-weight: 600; letter-spacing: -0.01em">{{b.price}}</div>
</sc-if>
<ul style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; font-size: 13px">
<sc-for list="{{b.lines}}" as="l" hint-placeholder-count="3">
<li style="display: flex; justify-content: space-between; gap: 8px"><span style="color: #4D5762">{{l.k}}</span><strong style="font-weight: 600">{{l.v}}</strong></li>
</sc-for>
</ul>
<button class="dtp-btn" type="button" onClick="{{b.act}}" style="margin-top: auto; min-height: 44px; border-radius: 999px; border: 1px solid {{b.btnBorder}}; background: {{b.btnBg}}; color: {{b.btnFg}}; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer">{{b.btn}}</button>
</article>
</sc-for>
</div>
<sc-if value="{{compareOpen}}" hint-placeholder-val="{{ false }}">
<div class="dtp-card" style="background: #FFFFFF; border: 1px solid #D9E1EC; border-radius: 6px; padding: 18px; overflow-x: auto">
<div role="table" aria-label="Confronto delle quantità annue per bundle" style="min-width: 820px; font-size: 13px">
<div role="row" style="display: grid; grid-template-columns: 2.2fr repeat(5, minmax(0, 1fr)); color: #4D5762; font-size: 12px; border-bottom: 1px solid #D9E1EC; text-align: right">
<span role="columnheader" style="padding: 10px; text-align: left">Servizio (unità / anno)</span>
<span role="columnheader" style="padding: 10px">Base</span>
<span role="columnheader" style="padding: 10px; color: #0047BB; font-weight: 600">Medium (tuo)</span>
<span role="columnheader" style="padding: 10px">Pro</span>
<span role="columnheader" style="padding: 10px">Enterprise</span>
<span role="columnheader" style="padding: 10px; color: #1A1C1E; font-weight: 600">Tuo consumo previsto</span>
</div>
<sc-for list="{{compare}}" as="r" hint-placeholder-count="9">
<div role="row" style="display: grid; grid-template-columns: 2.2fr repeat(5, minmax(0, 1fr)); border-bottom: 1px solid #EAEFF5; text-align: right">

      if (m) {
        var v = lookup(m[1], scope);
        if (name.indexOf('on') === 0 && typeof v === 'function') { el.addEventListener(name.slice(2), v); continue; }
        if (name === 'defaultchecked' || name === 'checked') { if (v) { el.setAttribute('checked', ''); el.checked = true; } continue; }
        if (name === 'defaultvalue') { el.setAttribute('value', v == null ? '' : String(v)); continue; }
