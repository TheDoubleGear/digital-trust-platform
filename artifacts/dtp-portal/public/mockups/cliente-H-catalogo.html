<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Catalogo e acquisti – Portale cliente</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;family=IBM+Plex+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F3F7FC}
*{box-sizing:border-box}
a{color:#0047BB}a:hover{color:#003A99}
</style>
<link rel="stylesheet" href="dtp-theme.css">
<link rel="icon" type="image/svg+xml" href="../favicon.svg">
<link rel="stylesheet" href="dtp-auth.css">
<script src="dtp-auth.js"></script>
<script src="dtp-catalogo.js"></script>
<script src="dtp-modifiche.js"></script>
</head>
<body>
<div id="app"></div>
<template id="tpl">

<div class="dtp-root" style="min-height: 100dvh; background: #F3F7FC; font-family: 'Inter', system-ui, sans-serif; color: #1A1C1E; font-variant-numeric: tabular-nums; position: relative">

<div class="dtp-projectbar" style="background: #F2F8FF; color: #1A1C1E; border-bottom: 1px solid #D9E1EC">
<div style="max-width: 1360px; margin: 0 auto; padding: 8px 32px; display: flex; flex-wrap: wrap; align-items: center; gap: 12px">
<a class="dtp-home" href="../workspace" title="Torna a Workspace / 2026" data-testid="link-home">Workspace</a>
<span class="dtp-session"><span class="dtp-session-tag">Accesso demo</span><span class="dtp-session-who" data-testid="text-current-role"><span data-dtp-role></span></span><button class="dtp-logout" type="button" data-dtp-logout data-testid="button-logout">Esci</button></span>
</div>
</div>

<header class="dtp-header" style="background: #EEDC00; border-bottom: 1px solid #D6C600">
<div style="max-width: 1360px; margin: 0 auto; padding: 10px 32px; display: flex; flex-wrap: wrap; align-items: center; gap: 24px">
<div style="display: flex; align-items: center; gap: 10px">
<svg width="34" height="34" viewBox="0 0 34 34" aria-hidden="true"><rect width="34" height="34" rx="9" fill="#0047BB"></rect><path d="M17 7l8 3v6c0 5-3.4 8.6-8 10-4.6-1.4-8-5-8-10v-6z" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linejoin="round"></path><path d="M13 16.5l3 3 5-5.5" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg>
<div>
<div style="font-weight: 800; font-size: 21px; letter-spacing: -0.03em; line-height: 1.1; color: #0047BB">postel</div>
<div style="font-size: 12px; color: #33383D">Digital Trust Platform</div>
</div>
</div>
<nav aria-label="Pagine del portale" style="display: flex; flex-wrap: wrap; gap: 4px; flex: 1 1 420px">
<a class="dtp-navlink" href="cliente-H-catalogo.html" aria-current="page" style="padding: 10px 16px; border-radius: 999px; font-size: 14px; font-weight: 600; text-decoration: none; color: #FFFFFF; background: #0047BB">Catalogo e acquisti</a>
<a class="dtp-navlink" href="cliente-U-utenze.html" style="padding: 10px 16px; border-radius: 999px; font-size: 14px; font-weight: 500; text-decoration: none; color: #33383D">Utenze e deleghe</a>
<a class="dtp-navlink" href="cliente-M1-panoramica.html" style="padding: 10px 16px; border-radius: 999px; font-size: 14px; font-weight: 500; text-decoration: none; color: #33383D">Contratto e consumi</a>
<a class="dtp-navlink" href="cliente-A-assistenza.html" style="padding: 10px 16px; border-radius: 999px; font-size: 14px; font-weight: 500; text-decoration: none; color: #33383D">Assistenza</a>
</nav>
<a class="dtp-iconbtn" href="cliente-N-notifiche.html" aria-label="Notifiche, 3 non lette" style="position: relative; width: 44px; height: 44px; border-radius: 999px; border: 1px solid #FFFFFF; background: #FFFFFF; display: flex; align-items: center; justify-content: center">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1A1C1E" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.7 21a2 2 0 0 1-3.4 0"></path></svg>
<span style="position: absolute; top: 6px; right: 6px; min-width: 18px; height: 18px; border-radius: 9px; background: #C7322A; color: #FFFFFF; font-size: 11px; font-weight: 600; display: flex; align-items: center; justify-content: center; padding: 0 4px">3</span>
</a>
<div style="display: flex; align-items: center; gap: 10px">
<div aria-hidden="true" style="width: 36px; height: 36px; border-radius: 18px; background: #0047BB; color: #FFFFFF; font-size: 13px; font-weight: 600; display: flex; align-items: center; justify-content: center">{{who.ini}}</div>
<div style="line-height: 1.25">
<div style="font-size: 14px; font-weight: 600">{{who.name}}</div>
<div style="font-size: 12px; color: #33383D">{{who.role}} · Assicurazioni Aurora S.p.A.</div>
</div>
</div>
</div>
</header>

<main class="dtp-main" style="max-width: 1360px; margin: 0 auto; padding: 0 32px 48px; display: flex; flex-direction: column; gap: 24px">

<section class="dtp-hero dtp-hero-bleed" aria-label="Benvenuto" style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 16px">
<div>
<h1 style="margin: 0; font-size: 28px; font-weight: 600; letter-spacing: -0.01em">Buongiorno, {{who.first}}</h1>
<p style="margin: 6px 0 0; font-size: 14px; color: #4D5762">Assicurazioni Aurora S.p.A. · {{svcCount}} servizi configurati · contratto attivo fino al 28 feb 2027 · scadenza tra 124 giorni · dati al 27 ott 2026</p>
</div>
<div style="display: flex; flex-wrap: wrap; gap: 10px">
<a class="dtp-linkcard" href="cliente-M1-panoramica.html" style="display: flex; flex-direction: column; gap: 2px; padding: 10px 14px; border-radius: 6px; background: #FFFFFF; border: 1px solid #D9E1EC; text-decoration: none; color: #1A1C1E; min-width: 150px"><span style="font-size: 20px; font-weight: 600">6 di 9</span><span style="font-size: 12px; color: #4D5762">servizi in soglia</span></a>
<a class="dtp-linkcard" href="cliente-M1-panoramica.html" style="display: flex; flex-direction: column; gap: 2px; padding: 10px 14px; border-radius: 6px; background: #FFFFFF; border: 1px solid #D9E1EC; text-decoration: none; color: #1A1C1E; min-width: 150px"><span style="font-size: 20px; font-weight: 600; color: #A3201A">1</span><span style="font-size: 12px; color: #4D5762">servizio esaurito</span></a>
<a class="dtp-linkcard" href="#ordini" style="display: flex; flex-direction: column; gap: 2px; padding: 10px 14px; border-radius: 6px; background: #FFFFFF; border: 1px solid #D9E1EC; text-decoration: none; color: #1A1C1E; min-width: 150px"><span style="font-size: 20px; font-weight: 600">{{orderCount}}</span><span style="font-size: 12px; color: #4D5762">modifiche in corso</span></a>
</div>
</section>

<sc-if value="{{f.lr}}" hint-placeholder-val="{{ true }}">
<section class="dtp-card" aria-labelledby="titolo-decidere" style="background: #FFFFFF; border: 2px solid #0047BB; border-radius: 6px; padding: 20px 22px; display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap">
<h2 id="titolo-decidere" style="margin: 0; font-size: 18px; font-weight: 600">Da decidere · {{decideCount}}</h2>
<span style="font-size: 12px; color: #4D5762">Solo il legale rappresentante vede questo riquadro</span>
</div>
<ul style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column">
<sc-for list="{{decide}}" as="d" hint-placeholder-count="3">
<li style="display: flex; flex-wrap: wrap; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid #EAEFF5">
<span style="flex: none; padding: 3px 9px; border-radius: 999px; font-size: 12px; font-weight: 600; background: #E5EFFF; color: #0047BB">{{d.kind}}</span>
<span style="flex: 1 1 360px; display: flex; flex-direction: column; gap: 2px"><strong style="font-size: 14px; font-weight: 600">{{d.what}}</strong><span style="font-size: 12px; color: #4D5762">{{d.meta}}</span></span>
<button class="dtp-btn dtp-btn-o" type="button" onClick="{{d.act}}" style="min-height: 44px; padding: 0 18px; border-radius: 999px; border: 1px solid #0047BB; background: #FFFFFF; color: #0047BB; font: inherit; font-size: 13px; font-weight: 600; cursor: pointer">{{d.btn}}</button>
</li>
</sc-for>
</ul>
</section>
</sc-if>

<section aria-label="Avvisi" style="display: flex; flex-direction: column; gap: 10px">
<sc-for list="{{alerts}}" as="a" hint-placeholder-count="2">
<div role="status" style="display: flex; flex-wrap: wrap; align-items: center; gap: 14px; padding: 14px 18px; border-radius: 6px; background: {{a.bg}}; border: 1px solid {{a.border}}">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="{{a.fg}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"></path><path d="M12 9v4"></path><path d="M12 17h.01"></path></svg>
<p style="margin: 0; flex: 1 1 420px; font-size: 14px; line-height: 1.45; color: #2A1206"><strong style="font-weight: 600">{{a.title}}</strong> {{a.text}}</p>
<button class="dtp-btn" type="button" onClick="{{a.act}}" style="min-height: 44px; padding: 0 20px; border-radius: 999px; border: 0; background: {{a.btnBg}}; color: #FFFFFF; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer">{{a.btn}}</button>
</div>
</sc-for>
</section>

<div style="display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-start">
<div style="flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column; gap: 16px">

<section class="dtp-card" aria-labelledby="titolo-attive" style="background: #FFFFFF; border: 1px solid #D9E1EC; border-radius: 6px; padding: 22px; display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap">
<h2 id="titolo-attive" style="margin: 0; font-size: 18px; font-weight: 600">La tua offerta</h2>
<a href="cliente-M1-panoramica.html" style="font-size: 13px; font-weight: 600; text-decoration: none; padding: 10px 0">Consumi e soglie →</a>
</div>
<div style="display: flex; flex-wrap: wrap; gap: 16px; align-items: center; padding: 16px; border-radius: 6px; border: 1px solid #0047BB; background: #F2F8FF">
<div style="flex: 1 1 260px; display: flex; flex-direction: column; gap: 4px">
<div style="display: flex; align-items: center; gap: 8px"><span style="font-size: 16px; font-weight: 600">{{svcCount}} servizi configurati</span><span style="padding: 2px 8px; border-radius: 999px; background: #E3F3EA; color: #1A6B4A; font-size: 12px; font-weight: 600">Attivo</span></div>
<span style="font-size: 13px; color: #4D5762">01 mar 2026 → 28 feb 2027 · contratto DTP-2026-0418</span>
</div>
<sc-if value="{{f.money}}" hint-placeholder-val="{{ true }}">
<div style="text-align: right"><div style="font-size: 18px; font-weight: 600">{{contractValue}} / anno</div><div style="font-size: 12px; color: #4D5762">valore del contratto · canone periodico e componente variabile</div></div>
</sc-if>
</div>
<p style="margin: 0; font-size: 13px; color: #4D5762">Ogni aumento di quantità o variazione dei servizi è un upgrade o una modifica dell'offerta e del contratto.</p>
</section>

<section class="dtp-card" id="ordini" aria-labelledby="titolo-ordini" style="background: #FFFFFF; border: 1px solid #D9E1EC; border-radius: 6px; padding: 22px; display: flex; flex-direction: column; gap: 10px">
<h2 id="titolo-ordini" style="margin: 0; font-size: 18px; font-weight: 600">{{ordersTitle}}</h2>
<ul style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column">
<sc-for list="{{orders}}" as="o" hint-placeholder-count="2">
<li style="display: flex; flex-wrap: wrap; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid #EAEFF5">
<div style="flex: 1 1 280px; display: flex; flex-direction: column; gap: 2px">
<span style="font-size: 14px; font-weight: 600">{{o.what}}</span>
<span style="font-size: 12px; color: #4D5762">{{o.meta}}</span>
</div>
<span style="padding: 3px 10px; border-radius: 999px; font-size: 12px; font-weight: 600; background: {{o.bg}}; color: {{o.fg}}">{{o.state}}</span>
<span style="min-width: 90px; text-align: right; font-size: 14px; font-weight: 600">{{o.amount}}</span>
</li>
</sc-for>
</ul>
</section>
</div>

<aside aria-label="Riepilogo" style="flex: 1 1 340px; min-width: 0">
<sc-if value="{{f.buy}}" hint-placeholder-val="{{ true }}">
<section class="dtp-card" aria-labelledby="titolo-carrello" style="background: #FFFFFF; border: 1px solid #D9E1EC; border-radius: 6px; padding: 22px; display: flex; flex-direction: column; gap: 14px">
<h2 id="titolo-carrello" style="margin: 0; font-size: 18px; font-weight: 600">Riepilogo della modifica</h2>
<sc-if value="{{cart.empty}}" hint-placeholder-val="{{ false }}">
<p style="margin: 0; font-size: 14px; color: #4D5762">Nessuna modifica. Aggiungi un upgrade dal catalogo qui sotto.</p>
</sc-if>
<ul style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px">
<sc-for list="{{cart.items}}" as="c" hint-placeholder-count="1">
<li style="display: flex; flex-direction: column; gap: 8px; padding-bottom: 10px; border-bottom: 1px solid #EAEFF5">
<div style="display: flex; align-items: flex-start; gap: 10px">
<div style="flex: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 14px; font-weight: 600">{{c.name}}</span><span style="font-size: 12px; color: #4D5762">{{c.pack}}</span></div>
<sc-if value="{{f.money}}" hint-placeholder-val="{{ true }}"><span style="font-size: 14px; font-weight: 600">{{c.price}}</span></sc-if>
<button class="dtp-btn dtp-btn-o" type="button" onClick="{{c.remove}}" aria-label="Rimuovi {{c.name}}" style="width: 44px; height: 44px; border-radius: 999px; border: 1px solid #D9E1EC; background: #FFFFFF; cursor: pointer; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#4D5762" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"></path></svg></button>
</div>
<div role="group" aria-label="Quantità da aggiungere per {{c.name}}" style="display: flex; align-items: center; gap: 8px; font-size: 13px; color: #4D5762">
<span style="flex: 1">Quantità da aggiungere · passo {{c.step}}</span>
<button class="dtp-btn dtp-btn-o" type="button" onClick="{{c.less}}" aria-label="Riduci la quantità di {{c.name}}" disabled="{{c.atMin}}" style="width: 40px; height: 40px; border-radius: 999px; border: 1px solid #B8C2CF; background: #FFFFFF; color: #0047BB; font: inherit; font-size: 18px; font-weight: 600; cursor: pointer">−</button>
<strong style="min-width: 64px; text-align: center; font-size: 14px; color: #1A1C1E">+{{c.qty}}</strong>
<button class="dtp-btn dtp-btn-o" type="button" onClick="{{c.more}}" aria-label="Aumenta la quantità di {{c.name}}" style="width: 40px; height: 40px; border-radius: 999px; border: 1px solid #B8C2CF; background: #FFFFFF; color: #0047BB; font: inherit; font-size: 18px; font-weight: 600; cursor: pointer">+</button>
</div>
</li>
</sc-for>
</ul>
<sc-if value="{{cart.any}}" hint-placeholder-val="{{ true }}">
<dl style="margin: 0; display: flex; flex-direction: column; gap: 6px; font-size: 13px">
<sc-for list="{{cart.summary}}" as="k" hint-placeholder-count="4">
<div style="display: flex; justify-content: space-between; gap: 12px"><dt style="color: #4D5762">{{k.k}}</dt><dd style="margin: 0; text-align: right; font-weight: 600">{{k.v}}</dd></div>
</sc-for>
</dl>
<div style="display: flex; justify-content: space-between; padding-top: 12px; border-top: 1px solid #EAEFF5; font-size: 15px"><span>Importo della modifica, IVA esclusa</span><strong style="font-weight: 700; white-space: nowrap">{{cart.total}}</strong></div>
</sc-if>
<label style="display: flex; gap: 10px; align-items: flex-start; font-size: 13px; color: #1A1C1E; line-height: 1.4"><input type="checkbox" style="width: 18px; height: 18px; margin-top: 1px"> Accetto le condizioni d'uso e il listino in vigore</label>
<p style="margin: 0; font-size: 13px; color: #4D5762; line-height: 1.45">{{cart.note}}</p>
<button class="dtp-btn dtp-btn-p" type="button" onClick="{{cart.confirm}}" disabled="{{cart.empty}}" style="min-height: 48px; border-radius: 999px; border: 0; background: #0047BB; color: #FFFFFF; font: inherit; font-size: 15px; font-weight: 600; cursor: pointer">{{cart.btn}}</button>
<sc-if value="{{cart.done}}" hint-placeholder-val="{{ false }}">
<p role="status" style="margin: 0; padding: 10px 12px; border-radius: 6px; background: #E3F3EA; color: #1A6B4A; font-size: 13px; font-weight: 500">{{cart.doneText}} <a href="cliente-M5-contratto.html#richieste" style="color: #1A6B4A; font-weight: 600">Vedi le richieste di modifica</a></p>
</sc-if>
</section>
</sc-if>
<sc-if value="{{f.noBuy}}" hint-placeholder-val="{{ false }}">
<section class="dtp-card" aria-labelledby="titolo-richieste" style="background: #FFFFFF; border: 1px solid #D9E1EC; border-radius: 6px; padding: 22px; display: flex; flex-direction: column; gap: 12px">
<h2 id="titolo-richieste" style="margin: 0; font-size: 18px; font-weight: 600">Le tue segnalazioni</h2>
<p style="margin: 0; font-size: 13px; color: #4D5762; line-height: 1.45">Upgrade e modifiche dell'offerta li avvia il delegato amministrativo o il legale rappresentante. Le segnalazioni che invii arrivano a entrambi.</p>
<ul style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px">
<sc-for list="{{requests}}" as="r" hint-placeholder-count="1">
<li style="display: flex; justify-content: space-between; gap: 8px; font-size: 14px; padding: 8px 0; border-bottom: 1px solid #EAEFF5"><span>{{r.name}}</span><span style="font-size: 12px; font-weight: 600; color: #855800">Inviata</span></li>
</sc-for>
</ul>
<sc-if value="{{noRequests}}" hint-placeholder-val="{{ true }}">
<p style="margin: 0; font-size: 13px; color: #4D5762">Nessuna segnalazione inviata.</p>
</sc-if>
</section>
</sc-if>
</aside>
</div>

<section id="catalogo" aria-labelledby="titolo-catalogo" style="display: flex; flex-direction: column; gap: 16px">
<div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 12px">
<div>
<h2 id="titolo-catalogo" style="margin: 0; font-size: 22px; font-weight: 600">Catalogo</h2>
<p style="margin: 4px 0 0; font-size: 13px; color: #4D5762">Tutti i servizi Digital Trust, con la quantità configurata nella tua offerta e le proposte di upgrade</p>
</div>
<div style="display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-end">
<div class="dtp-seg" role="group" aria-label="Stato del servizio" style="display: flex; gap: 4px; padding: 4px; border-radius: 999px; background: #E4EAF2">
<sc-for list="{{tabs}}" as="t" hint-placeholder-count="3">
<button class="dtp-btn" type="button" aria-pressed="{{t.pressed}}" onClick="{{t.pick}}" style="min-height: 40px; padding: 0 18px; border-radius: 999px; border: 0; background: {{t.bg}}; color: #1A1C1E; font: inherit; font-size: 13px; font-weight: {{t.weight}}; cursor: pointer">{{t.label}}</button>
</sc-for>
</div>
<label style="display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: #4D5762; font-weight: 500">Famiglia di servizi
<select onChange="{{pickFam}}" style="min-height: 44px; min-width: 200px; padding: 0 12px; border-radius: 6px; border: 1px solid #B8C2CF; background: #FFFFFF; font: inherit; font-size: 14px; color: #1A1C1E"><sc-for list="{{famOpts}}" as="o" hint-placeholder-count="5"><option value="{{o.v}}" selected="{{o.sel}}">{{o.label}}</option></sc-for></select>
</label>
</div>
</div>

<div style="display: flex; gap: 12px; align-items: flex-start; padding: 14px 18px; border-radius: 6px; background: #E5EFFF; border: 1px solid #BFD6FA">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#0047BB" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; margin-top: 1px"><circle cx="12" cy="12" r="10"></circle><path d="M12 16v-4"></path><path d="M12 8h.01"></path></svg>
<p style="margin: 0; font-size: 14px; line-height: 1.5">{{advice}}</p>
</div>

<sc-if value="{{noSvc}}" hint-placeholder-val="{{ false }}">
<p style="margin: 0; padding: 18px; border-radius: 6px; background: #FFFFFF; border: 1px dashed #B8C2CF; font-size: 14px; color: #4D5762">{{noSvcText}}</p>
</sc-if>
<div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 14px">
<sc-for list="{{svc}}" as="s" hint-placeholder-count="9">
<article class="dtp-card" style="background: #FFFFFF; border: 1px solid #D9E1EC; border-radius: 6px; padding: 18px; display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; justify-content: space-between; align-items: center; gap: 8px">
<span style="font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; color: #4D5762; font-weight: 600">{{s.family}}</span>
<sc-if value="{{s.reco}}" hint-placeholder-val="{{ false }}"><span style="white-space: nowrap; padding: 3px 9px; border-radius: 999px; font-size: 12px; font-weight: 600; background: #FDE7DC; color: #B03A0B">Upgrade consigliato</span></sc-if>
</div>
<h3 style="margin: 0; font-size: 15px; font-weight: 600; line-height: 1.3; min-height: 40px">{{s.name}}</h3>
<div style="display: flex; align-items: center; gap: 8px; font-size: 12px; color: #4D5762"><span style="width: 8px; height: 8px; border-radius: 4px; background: {{s.dot}}"></span>{{s.stateLine}}</div>
<ul style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; font-size: 13px">
<sc-for list="{{s.kv}}" as="l" hint-placeholder-count="2">
<li style="display: flex; justify-content: space-between; gap: 8px"><span style="color: #4D5762">{{l.k}}</span><strong style="font-weight: 600; text-align: right">{{l.v}}</strong></li>
</sc-for>
</ul>
<div style="margin-top: auto; display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 6px; border: 1px solid {{s.boxBorder}}; background: {{s.boxBg}}">
<div style="flex: 1; display: flex; flex-direction: column; gap: 1px"><span style="font-size: 14px; font-weight: 600">{{s.upTitle}}</span><span style="font-size: 12px; color: #4D5762">{{s.upSub}}</span></div>
<button class="dtp-btn" type="button" onClick="{{s.act}}" aria-label="{{s.btnLabel}}" style="min-height: 40px; padding: 0 16px; border-radius: 999px; border: 1px solid {{s.btnBorder}}; background: {{s.btnBg}}; color: {{s.btnFg}}; font: inherit; font-size: 13px; font-weight: 600; cursor: pointer">{{s.btn}}</button>
</div>
</article>
</sc-for>
</div>
</section>

<footer style="display: flex; flex-wrap: wrap; justify-content: space-between; gap: 12px; font-size: 12px; color: #4D5762; padding-top: 8px">
<span>Prezzi IVA esclusa, secondo il listino in vigore. Upgrade e modifiche valgono fino al termine del periodo contrattuale e aggiornano offerta e contratto.</span>
<span style="display: flex; gap: 16px"><a href="#condizioni">Condizioni d'uso</a><a href="cliente-A-assistenza.html">Assistenza</a></span>
</footer>
</main>

</div>
</template>
<script>
/* Mini runtime per le pagine esportate: template {{ }}, sc-for, sc-if, onClick, setState. */
(function () {
  var _tl = Number.prototype.toLocaleString;
  Number.prototype.toLocaleString = function (loc, opt) {
    if (loc === 'it-IT') opt = Object.assign({ useGrouping: 'always' }, opt || {});
    try { return _tl.call(this, loc, opt); } catch (e) { return _tl.call(this, loc); }
  };
  var HOLE = /\{\{\s*([^}]+?)\s*\}\}/g, FULL = /^\{\{\s*([^}]+?)\s*\}\}$/;
  function lookup(path, scope) {
    path = path.trim();
    if (path === 'true') return true; if (path === 'false') return false;
    if (/^-?\d+(\.\d+)?$/.test(path)) return Number(path);
    var parts = path.split('.'), v = scope;
    for (var i = 0; i < parts.length; i++) { if (v == null) return undefined; v = v[parts[i]]; }
    return v;
  }
  function interp(str, scope) {
    return str.replace(HOLE, function (_, p) { var v = lookup(p, scope); return v == null ? '' : String(v); });
  }
  function renderChildren(src, dst, scope) {
    for (var c = src.firstChild; c; c = c.nextSibling) renderNode(c, dst, scope);
  }
  function renderNode(node, dst, scope) {
    if (node.nodeType === 3) { dst.appendChild(document.createTextNode(interp(node.nodeValue, scope))); return; }
    if (node.nodeType !== 1) return;
    var tag = node.localName;
    if (tag === 'sc-for') {
      var list = lookup((node.getAttribute('list') || '').replace(/^\{\{|\}\}$/g, ''), scope) || [];
      var as = node.getAttribute('as') || 'item';
      list.forEach(function (item, i) {
        var s = Object.create(scope); s[as] = item; s.$index = i;
        renderChildren(node, dst, s);
      });
      return;
    }
    if (tag === 'sc-if') {
      var val = lookup((node.getAttribute('value') || '').replace(/^\{\{|\}\}$/g, ''), scope);
      if (val) renderChildren(node, dst, scope);
      return;
    }
    var el = node.namespaceURI === 'http://www.w3.org/2000/svg'
      ? document.createElementNS(node.namespaceURI, node.localName) : document.createElement(node.localName);
    for (var a = 0; a < node.attributes.length; a++) {
      var at = node.attributes[a], name = at.name, raw = at.value;
      if (name.indexOf('hint-') === 0) continue;
      var m = raw.match(FULL);
      if (m) {
        var v = lookup(m[1], scope);
        if (name.indexOf('on') === 0 && typeof v === 'function') { el.addEventListener(name.slice(2), v); continue; }
        if (name === 'defaultchecked' || name === 'checked') { if (v) { el.setAttribute('checked', ''); el.checked = true; } continue; }
        if (name === 'defaultvalue') { el.setAttribute('value', v == null ? '' : String(v)); continue; }
        if (v == null || v === false && name.indexOf('aria-') !== 0) continue;
        el.setAttribute(name, String(v));
      } else if (name === 'defaultvalue') { el.setAttribute('value', raw);
      } else if (name === 'defaultchecked') { el.setAttribute('checked', '');
      } else { el.setAttribute(name, interp(raw, scope)); }
    }
    renderChildren(node.localName === 'template' ? node.content : node, el, scope);
    dst.appendChild(el);
  }
  function DCLogic(props) { this.props = props || {}; this.state = null; }
  DCLogic.prototype.setState = function (o) {
    this.state = Object.assign({}, this.state || {}, o);
    this.__render();
  };
  DCLogic.prototype.forceUpdate = function () { this.__render(); };
  window.DCLogic = DCLogic;
  window.DC = {
    mount: function (Comp, meta) {
      var props = {};
      Object.keys(meta).forEach(function (k) { if (k[0] !== '$' && meta[k] && 'default' in meta[k]) props[k] = meta[k]['default']; });
      /* Sessione demo: il ruolo arriva da DTPAuth; senza permesso la pagina non viene disegnata. */
      var auth = window.DTPAuth, access = auth ? auth.enter(meta) : null;
      if (!access) return;
      if (meta.persona && meta.persona.options) props.persona = access.role;
      var tpl = document.getElementById('tpl').content, root = document.getElementById('app');
      var c = new Comp(props);
      c.__render = function () {
        var frag = document.createDocumentFragment();
        renderChildren(tpl, frag, c.renderVals());
        root.replaceChildren(frag);
        auth.decorate(root);
      };
      c.__render();
    }
  };
})();

</script>
<script>

class Component extends DCLogic {
  renderVals() {
    var self = this;
    var st = this.state || {};
    var P = this.props.persona;
    var set = function (o) { self.setState(o); };
    var C = window.DTP;
    var WHO = {
      lr: { name: 'Paolo Ferretti', first: 'Paolo', role: 'Legale rappresentante', ini: 'PF' },
      amm: { name: 'Giulia Marchetti', first: 'Giulia', role: 'Delegato amministrativo', ini: 'GM' },
      op: { name: 'Davide Sala', first: 'Davide', role: 'Delegato operativo', ini: 'DS' }
    };
    var buy = P !== 'op', money = P !== 'op';
    var eur = C.eur, n = C.num;
    var MOD = window.DTPModifiche;
    /* Modifica in composizione: { idServizio: quantità da aggiungere }. */
    var cartQ = st.cart || {};
    var cartIds = Object.keys(cartQ);
    var reqs = st.requests || [];
    var addReq = function (name) { if (reqs.indexOf(name) < 0) set({ requests: reqs.concat([name]) }); };
    var setQ = function (id, q) { var nq = Object.assign({}, cartQ); if (q > 0) nq[id] = q; else delete nq[id]; set({ cart: nq, done: null }); };
    var add = function (id) { if (!cartQ[id]) setQ(id, up[id].add); };
    var DOT = { out: '#C7322A', crit: '#E8692A', warn: '#E0A100', ok: '#2E8B62', off: '#9AA6B8' };
    var STATE = { out: 'esaurito', crit: 'critico', warn: 'in attenzione', ok: 'regolare' };
    /* Offerta configurata e consumi del cliente di esempio: fonte unica in dtp-catalogo.js (DTP.esempio). */
    var E = C.esempio;
    var CFG = Object.keys(E.config);
    var conf = {};
    CFG.forEach(function (id) { var k = E.consumi[id]; conf[id] = { qty: E.config[id], state: k[2], fc: k[1] }; });
    /* Upgrade proposto: quantità mancante arrotondata al passo del servizio, prezzo ricalcolato e overage evitato. */
    var up = {};
    C.services.forEach(function (sv) {
      var c = conf[sv.id];
      if (!c) { up[sv.id] = { add: sv.step, reco: false }; return; }
      var gap = c.fc - c.qty, reco = gap > 0;
      var addQ = reco ? Math.ceil(gap / sv.step) * sv.step : sv.step;
      up[sv.id] = { add: addQ, reco: reco, price: Math.round(addQ * sv.unit * 100) / 100, overage: reco ? Math.round(gap * sv.unit * 100) / 100 : 0,
        from: c.qty, to: c.qty + addQ };
    });
    var ovTot = E.overageTotale();
    var upName = function (id) { var sv = C.byId(id); return 'Upgrade ' + sv.name + ' · +' + n(up[id].add); };
    var tab = st.tab || 'all', fam = st.fam || 'all';
    var svc = C.services.filter(function (sv) {
      var on = !!conf[sv.id];
      return (fam === 'all' || sv.family === fam) && (tab === 'all' || (tab === 'on') === on);
    }).map(function (sv) {
      var c = conf[sv.id], u = up[sv.id], inCart = !!cartQ[sv.id], requested = reqs.indexOf(upName(sv.id)) >= 0;
      var active = buy ? inCart : requested;
      var kv = [{ k: 'Quantità configurata', v: c ? n(c.qty) + ' unità' : 'Non attivo' }];
      if (c) kv.push({ k: 'Consumo previsto a fine periodo', v: n(c.fc) + ' unità' });
      if (money) kv.push({ k: 'Prezzo unitario di listino', v: C.unit3(sv.unit) + ' €' });
      var sub = u.reco
        ? 'Nuova quantità ' + n(u.to) + (money ? ' · prezzo ricalcolato ' + eur(u.price) + ' · overage evitato ' + eur(u.overage) : ' · evita l’overage previsto')
        : (c ? 'Da ' + n(u.from) + ' a ' + n(u.to) + ' unità' : 'Aggiunta all’offerta') + (money ? ' · ' + eur(u.price) : '');
      return {
        family: sv.family, name: sv.name, reco: u.reco, kv: kv,
        dot: c ? DOT[c.state] : DOT.off,
        stateLine: c ? 'Configurato · consumi ' + STATE[c.state] : 'Non attivo nella tua offerta',
        upTitle: (u.reco ? 'Upgrade consigliato +' : (c ? 'Upgrade +' : 'Attiva ')) + n(u.add) + ' unità',
        upSub: sub,
        boxBorder: u.reco ? '#F3C2A8' : '#DDE4EE', boxBg: u.reco ? '#FFF8F4' : '#FFFFFF',
        btn: buy ? (inCart ? 'Aggiunto' : 'Aggiungi') : (requested ? 'Segnalazione inviata' : 'Segnala'),
        btnLabel: (buy ? (inCart ? 'Aggiunto: ' : 'Aggiungi upgrade di ') : (requested ? 'Segnalazione inviata: ' : 'Segnala upgrade di ')) + sv.name,
        btnBg: active ? '#E5EFFF' : '#FFFFFF', btnFg: '#0047BB', btnBorder: active ? '#0047BB' : '#B8C2CF',
        act: function () { if (buy) add(sv.id); else addReq(upName(sv.id)); }
      };
    });
    /* Riepilogo della modifica: variazioni per servizio, prezzo ricalcolato per componente e decorrenza. */
    var lineOf = function (id) {
      var sv = C.byId(id), q = cartQ[id], from = conf[id] ? conf[id].qty : 0;
      return { id: id, sv: sv, q: q, from: from, to: from + q, price: Math.round(q * sv.unit * 100) / 100 };
    };
    var lines = C.services.filter(function (sv) { return cartQ[sv.id]; }).map(function (sv) { return lineOf(sv.id); });
    var items = lines.map(function (l) {
      return { name: l.sv.name, step: n(l.sv.step), qty: n(l.q), atMin: l.q <= l.sv.step,
        pack: l.from ? 'upgrade da ' + n(l.from) + ' a ' + n(l.to) + ' unità' : 'nuovo servizio · ' + n(l.to) + ' unità',
        price: eur(l.price),
        less: function () { if (l.q > l.sv.step) setQ(l.id, l.q - l.sv.step); },
        more: function () { setQ(l.id, l.q + l.sv.step); },
        remove: function () { setQ(l.id, 0); } };
    });
    var total = Math.round(lines.reduce(function (a, l) { return a + l.price; }, 0) * 100) / 100;
    var newCfg = Object.assign({}, E.config);
    lines.forEach(function (l) { newCfg[l.id] = l.to; });
    var before = E.contratto(), after = C.price(newCfg, { fee: false });
    var decorrenza = 'dalla controfirma di Postel fino al 28 feb 2027';
    var summary = money ? [
      { k: 'Componente variabile', v: eur(before.variabile) + ' → ' + eur(after.variabile) },
      { k: 'Canone periodico', v: eur(after.canone) + ' · invariato · [DA DEFINIRE]' },
      { k: 'Nuovo valore del contratto', v: eur(after.totale) + ' / anno' },
      { k: 'Decorrenza', v: decorrenza }
    ] : [{ k: 'Decorrenza', v: decorrenza }];
    var isLr = P === 'lr';
    var cart = {
      items: items, empty: items.length === 0, any: items.length > 0, total: eur(total), summary: summary,
      done: !!st.done, doneText: st.done || '',
      btn: isLr ? 'Conferma e firma' : 'Invia per approvazione',
      note: isLr
        ? 'Come legale rappresentante confermi e firmi direttamente. La modifica si attiva alla controfirma di Postel.'
        : 'La modifica va a ' + MOD.PEOPLE.lr.name + ' per l’approvazione e resta «In approvazione» finché non decide. Dopo l’approvazione firmi tu l’atto e Postel controfirma.',
      confirm: function () {
        if (!lines.length) return;
        var what = lines.length === 1
          ? 'Upgrade ' + lines[0].sv.name + ': +' + n(lines[0].q) + ' unità'
          : 'Modifica dell’offerta: ' + lines.map(function (l) { return l.sv.name + ' +' + n(l.q); }).join(', ');
        var detail = lines.map(function (l) { return l.from ? 'da ' + n(l.from) + ' a ' + n(l.to) + ' unità' : 'nuovo servizio, ' + n(l.to) + ' unità'; }).join(' · ');
        var r = MOD.create({ role: P, what: what, detail: detail, amount: total });
        if (!r) return;
        set({ cart: {}, done: isLr
          ? 'Modifica ' + r.id + ' confermata e firmata. Si attiva alla controfirma di Postel.'
          : 'Modifica ' + r.id + ' inviata a ' + MOD.PEOPLE.lr.name + ' per l’approvazione.' });
      }
    };
    /* Modifiche in corso o rifiutate, dalla fonte condivisa (dtp-modifiche.js). */
    var mods = MOD.list().filter(function (r) { return r.state !== 'done'; });
    var orders = mods.map(function (r) {
      var s = MOD.STATES[r.state];
      return { what: r.what, meta: r.id + ' · ' + MOD.when(r.created) + ' · avviata da ' + MOD.PEOPLE[r.by].name + (r.state === 'rejected' && r.approval.reason ? ' · motivazione: ' + r.approval.reason : ''),
        state: s.label, bg: s.bg, fg: s.fg, amount: money && r.amount != null ? eur(r.amount) : '' };
    }).concat([
      { what: 'Upgrade Nuovi Certificati FEA · +500 unità', meta: 'ORD-2026-1187 · 24 ott 2026 · avviato da Giulia Marchetti', state: 'In attivazione', bg: '#FDF1D6', fg: '#855800', amount: money ? eur(E.upgradeInCorsoPrezzo()) : '' },
      { what: 'Offerta componibile · durata annuale · 9 servizi', meta: 'ORD-2026-0311 · 1 mar 2026 · firmato da Paolo Ferretti', state: 'Attivo', bg: '#E3F3EA', fg: '#1A6B4A', amount: money ? eur(E.contratto().totale) : '' }
    ]);
    if (P === 'op') {
      orders = reqs.map(function (r) { return { what: r, meta: 'segnalazione inviata oggi a G. Marchetti e P. Ferretti', state: 'Segnalazione', bg: '#E5EFFF', fg: '#0047BB', amount: '' }; }).concat(orders);
    }
    var alerts = [
      {
        title: 'Nuovi Certificati FEA esaurito dal 17 ott.',
        text: money ? 'L’overage è attivo a € 3,00 per certificato; un upgrade di 500 certificati è già in attivazione.' : 'Oltre la quantità configurata i certificati sono conteggiati a consumo; un upgrade è già in attivazione.',
        bg: '#FBE3E1', border: '#F2BDB8', fg: '#A3201A', btnBg: '#A3201A',
        btn: buy ? 'Aggiungi upgrade +' + n(up.cert.add) : 'Segnala all’amministrativo',
        act: function () { if (buy) add('cert'); else addReq(upName('cert')); }
      },
      {
        title: 'Identificazioni Full Prospect si esaurirà il 13 nov,',
        text: money ? '107 giorni prima del rinnovo: al ritmo attuale l’overage previsto è ' + eur(up.fp.overage) + '.' : '107 giorni prima del rinnovo: al ritmo attuale serviranno circa 2.500 identificazioni in più.',
        bg: '#FDE7DC', border: '#F3C2A8', fg: '#B03A0B', btnBg: '#B03A0B',
        btn: buy ? 'Aggiungi upgrade +' + n(up.fp.add) : 'Segnala all’amministrativo',
        act: function () { if (buy) add('fp'); else addReq(upName('fp')); }
      }
    ];
    var tabs = [['all', 'Tutti'], ['on', 'Attivi'], ['off', 'Non attivi']].map(function (t) {
      var on = t[0] === tab;
      return { label: t[1], pressed: on ? 'true' : 'false', bg: on ? '#FFFFFF' : 'transparent', weight: on ? 600 : 500, pick: function () { set({ tab: t[0] }); } };
    });
    var famOpts = [{ v: 'all', label: 'Tutte' }].concat(C.families.map(function (f) { return { v: f, label: f }; })).map(function (o) { o.sel = o.v === fam; return o; });
    /* H-10 "Da decidere": modifiche avviate dal delegato amministrativo in attesa di approvazione, con link a M5-03. */
    var decide = MOD.list().filter(function (r) { return r.state === 'approval'; }).map(function (r) {
      return { kind: 'Modifica da approvare', what: r.what, meta: r.id + ' · avviata da ' + MOD.PEOPLE[r.by].name + ' ' + MOD.when(r.created) + (money && r.amount != null ? ' · ' + eur(r.amount) + ' IVA esclusa' : ''),
        btn: 'Apri la richiesta', act: function () { location.href = 'cliente-M5-contratto.html#richiesta-' + r.id; } };
    }).concat([
      { kind: 'Segnalazione', what: 'Davide Sala segnala la necessità di un upgrade di ' + n(up.fp.add) + ' Identificazioni Full Prospect', meta: 'oggi · delegato operativo · al ritmo attuale il servizio si esaurisce il 13 nov', btn: 'Aggiungi al riepilogo', act: function () { add('fp'); } },
      { kind: 'Rinnovo', what: 'Decidi sul rinnovo del contratto entro il 30 nov 2026', meta: 'scadenza 28 feb 2027 · overage previsto con le quantità attuali ' + eur(ovTot), btn: 'Vedi le proposte di upgrade', act: function () { set({ tab: 'on', fam: 'all' }); var c = document.getElementById('catalogo'); if (c) c.scrollIntoView({ behavior: 'smooth' }); } },
      { kind: 'Condizioni', what: 'Nuove condizioni generali in vigore dal 1 dic 2026', meta: 'da accettare prima della prossima modifica dell’offerta', btn: 'Leggi e accetta', act: function () {} }
    ]);
    return {
      who: WHO[P],
      svcCount: CFG.length, contractValue: eur(E.contratto().totale),
      f: { buy: buy, noBuy: !buy, money: money, lr: P === 'lr' },
      decide: decide, decideCount: decide.length,
      alerts: alerts, orders: orders, orderCount: MOD.pending().length + 1,
      ordersTitle: P === 'op' ? 'Modifiche e segnalazioni' : 'Modifiche e ordini recenti',
      cart: cart, requests: reqs.map(function (r) { return { name: r }; }), noRequests: reqs.length === 0,
      tabs: tabs, famOpts: famOpts, pickFam: function (ev) { set({ fam: ev.target.value }); },
      svc: svc, noSvc: svc.length === 0,
      noSvcText: tab === 'off' ? 'Tutti i servizi del catalogo sono già configurati nella tua offerta.' : 'Nessun servizio corrisponde ai filtri.',
      advice: money
        ? 'Per il tuo consumo previsto conviene un upgrade dei servizi in esaurimento: con le quantità attuali l’overage previsto a fine periodo è ' + eur(ovTot) + '. Le proposte indicano quantità consigliata, prezzo ricalcolato e overage evitato.'
        : 'Per il consumo previsto conviene un upgrade dei servizi in esaurimento. Le segnalazioni che invii arrivano al delegato amministrativo e al legale rappresentante.'
    };
  }
}

DC.mount(Component, {"persona": {"editor": "enum", "options": ["lr", "amm", "op"], "default": "lr"}, "$preview": {"width": 1440, "height": 2850}});
</script>
