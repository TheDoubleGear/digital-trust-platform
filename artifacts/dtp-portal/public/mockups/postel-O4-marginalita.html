<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ricavi, costi e marginalità – Dashboard Operativa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;family=IBM+Plex+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F3F7FC}
*{box-sizing:border-box}
a{color:#0047BB}a:hover{color:#003A99}
</style>
<link rel="stylesheet" href="dtp-theme.css">
<link rel="icon" type="image/svg+xml" href="../favicon.svg">
<link rel="stylesheet" href="dtp-auth.css">
<script src="dtp-auth.js"></script>
</head>
<body>
<div id="app"></div>
<template id="tpl">

<div class="dtp-root" style="min-height: 100dvh; display: flex; flex-wrap: wrap; background: #F3F7FC; font-family: 'Inter', system-ui, sans-serif; color: #1A1C1E; font-variant-numeric: tabular-nums">

<div class="dtp-projectbar" style="flex: 1 1 100%; background: #F2F8FF; color: #1A1C1E; border-bottom: 1px solid #D9E1EC">
<div style="padding: 8px 32px; display: flex; flex-wrap: wrap; align-items: center; gap: 12px">
<a class="dtp-home" href="../workspace" title="Torna a Workspace / 2026" data-testid="link-home">Home</a>
<span class="dtp-session"><span class="dtp-session-tag">Accesso demo</span><span class="dtp-session-who" data-testid="text-current-role"><span data-dtp-role></span></span><button class="dtp-logout" type="button" data-dtp-logout data-testid="button-logout">Esci</button></span>
</div>
</div>

<nav class="dtp-sidenav" aria-label="Navigazione principale" style="flex: 1 1 240px; max-width: 100%; background: #0047BB; color: #FFFFFF; padding: 20px 14px; display: flex; flex-direction: column; gap: 22px">
<div style="display: flex; align-items: center; gap: 10px; padding: 0 8px">
<svg width="32" height="32" viewBox="0 0 34 34" aria-hidden="true"><rect width="34" height="34" rx="9" fill="#FFEC00"></rect><path d="M17 7l8 3v6c0 5-3.4 8.6-8 10-4.6-1.4-8-5-8-10v-6z" fill="none" stroke="#0047BB" stroke-width="2" stroke-linejoin="round"></path><path d="M13 16.5l3 3 5-5.5" fill="none" stroke="#0047BB" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg>
<div>
<div style="font-weight: 700; font-size: 17px; line-height: 1.1">postel</div>
<div style="font-size: 11px; color: #DCE8FF">Console operativa DTP</div>
</div>
</div>
<div style="display: flex; flex-direction: column; gap: 2px">
<sc-for list="{{nav}}" as="n" hint-placeholder-count="5">
<a class="dtp-sidelink" href="{{n.href}}" aria-current="{{n.current}}" style="min-height: 44px; display: flex; align-items: center; gap: 10px; padding: 0 12px; border-radius: 6px; background: {{n.bg}}; color: {{n.fg}}; font-size: 14px; font-weight: {{n.weight}}; text-decoration: none"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{n.icon}}"></path></svg>{{n.label}}</a>
</sc-for>
</div>
<div style="display: flex; flex-direction: column; gap: 2px; padding-top: 14px; border-top: 1px solid #3B74D6">
<span style="font-size: 11px; color: #C8DAFB; text-transform: uppercase; letter-spacing: 0.06em; padding: 0 12px 6px; font-weight: 600">Sistemi collegati</span>
<sc-for list="{{ext}}" as="e" hint-placeholder-count="1">
<a class="dtp-sidelink" href="#{{e.id}}" style="min-height: 44px; display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 0 12px; border-radius: 6px; color: #FFFFFF; font-size: 14px; font-weight: 500; text-decoration: none">{{e.label}}<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17 17 7M8 7h9v9"></path></svg></a>
</sc-for>
</div>
<div style="margin-top: auto; padding: 12px; border-radius: 6px; background: #003A99; display: flex; flex-direction: column; gap: 4px">
<span style="font-size: 14px; font-weight: 600">{{who.name}}</span>
<span style="font-size: 12px; color: #DCE8FF">{{who.role}}</span>
</div>
</nav>

<main class="dtp-main" style="flex: 999 1 560px; min-width: 0; padding: 24px 32px 48px; display: flex; flex-direction: column; gap: 20px">

<div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 12px">
<div>
<h1 style="margin: 0; font-size: 26px; font-weight: 600; letter-spacing: -0.01em">Ricavi, costi e marginalità</h1>
<p style="margin: 4px 0 0; font-size: 13px; color: #4D5762">Gennaio → ottobre 2026 · costi diretti da rating e fatturazione · canoni ripartiti sui servizi in base al listino</p>
</div>
<button class="dtp-btn dtp-btn-o" type="button" style="min-height: 44px; padding: 0 20px; border-radius: 999px; border: 1px solid #B8C2CF; background: #FFFFFF; font: inherit; font-size: 14px; font-weight: 600; color: #1A1C1E; cursor: pointer">Esporta Excel</button>
</div>

<form aria-label="Filtri" style="display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-end; padding: 14px; border-radius: 6px; background: #FFFFFF; border: 1px solid #D9E1EC">
<sc-for list="{{filters}}" as="f" hint-placeholder-count="5">
<label style="display: flex; flex-direction: column; gap: 4px; font-size: 11px; color: #4D5762; font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em">{{f.label}}
<select style="min-height: 40px; min-width: 150px; padding: 0 10px; border-radius: 6px; border: 1px solid #B8C2CF; background: #FFFFFF; font: inherit; font-size: 13px; font-weight: 500; text-transform: none; letter-spacing: 0; color: #1A1C1E"><option>{{f.value}}</option></select>
</label>
</sc-for>
<button class="dtp-btn dtp-btn-t" type="reset" style="min-height: 40px; padding: 0 16px; border-radius: 999px; border: 0; background: transparent; font: inherit; font-size: 13px; font-weight: 600; color: #0047BB; cursor: pointer">Reimposta</button>
</form>

<section aria-label="Indicatori economici" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 14px">
<sc-for list="{{kpis}}" as="k" hint-placeholder-count="6">
<div class="dtp-card" style="background: #FFFFFF; border: 1px solid #D9E1EC; border-radius: 6px; padding: 18px; display: flex; flex-direction: column; gap: 6px">
<span style="font-size: 13px; color: #4D5762; font-weight: 500">{{k.label}}</span>
<span style="font-size: 26px; font-weight: 600; letter-spacing: -0.02em; color: {{k.color}}">{{k.value}}</span>
<span style="font-size: 12px; color: #4D5762; line-height: 1.4">{{k.sub}}</span>
</div>
</sc-for>
</section>

<section class="dtp-card" aria-labelledby="titolo-incassi" style="background: #FFFFFF; border: 1px solid #D9E1EC; border-radius: 6px; padding: 24px; display: flex; flex-direction: column; gap: 14px">
<div>
<h2 id="titolo-incassi" style="margin: 0; font-size: 18px; font-weight: 600">Fatturato e incassato: € 38k da incassare, di cui € 2,5k scaduti</h2>
<p style="margin: 4px 0 0; font-size: 13px; color: #4D5762">Ciclo attivo da inizio anno: emissione, esito del Sistema di Interscambio, incasso e riconciliazione.</p>
</div>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px">
<sc-for list="{{cash}}" as="c" hint-placeholder-count="5">
<div style="border: 1px solid #D9E1EC; border-radius: 6px; padding: 16px; display: flex; flex-direction: column; gap: 4px">
<span style="font-size: 13px; color: #4D5762; font-weight: 500">{{c.label}}</span>
<span style="font-size: 22px; font-weight: 600; color: {{c.color}}">{{c.value}}</span>
<span style="font-size: 12px; color: #4D5762">{{c.sub}}</span>
</div>
</sc-for>
</div>
</section>

<section class="dtp-card" aria-labelledby="titolo-servizi" style="background: #FFFFFF; border: 1px solid #D9E1EC; border-radius: 6px; padding: 24px; display: flex; flex-direction: column; gap: 16px">
<div style="display: flex; flex-wrap: wrap; justify-content: space-between; gap: 12px">
<div>
<h2 id="titolo-servizi" style="margin: 0; font-size: 18px; font-weight: 600">Identificazioni Proprietarie trattiene solo il 17,5% dei ricavi</h2>
<p style="margin: 4px 0 0; font-size: 13px; color: #4D5762">Margine lordo per servizio, dal più basso · ogni barra è il ricavo del servizio, diviso in costo diretto e margine</p>
</div>
<div style="display: flex; flex-wrap: wrap; gap: 14px; font-size: 12px; align-items: center">
<span style="display: flex; align-items: center; gap: 6px"><span style="width: 10px; height: 10px; border-radius: 2px; background: #E8692A"></span>Costo diretto</span>
<span style="display: flex; align-items: center; gap: 6px"><span style="width: 10px; height: 10px; border-radius: 2px; background: #0047BB"></span>Margine lordo</span>
</div>
</div>
<ul style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px">
<sc-for list="{{bySvc}}" as="s" hint-placeholder-count="9">
<li style="display: grid; grid-template-columns: 230px minmax(0, 1fr) 150px; gap: 14px; align-items: center">
<span style="font-size: 13px; font-weight: {{s.weight}}">{{s.name}}</span>
<span role="img" aria-label="{{s.aria}}" style="display: flex; height: 22px; width: {{s.w}}; border-radius: 4px; overflow: hidden">
<span style="width: {{s.costW}}; background: #E8692A"></span>
<span style="flex: 1; background: #0047BB; border-left: 2px solid #FFFFFF"></span>
</span>
<span style="font-size: 13px; text-align: right"><strong style="font-weight: 700; color: {{s.mColor}}">{{s.m}}</strong> <span style="color: #4D5762">· {{s.rev}}</span></span>
</li>
</sc-for>
</ul>
<p style="margin: 0; font-size: 13px; color: #4D5762">Lettura: le Identificazioni Proprietarie costano € 1,02 per unità (verifiche manuali esterne) contro un prezzo medio di € 1,24. Le Full Prospect, il servizio che vale più volumi d'identificazione, restano sotto il 50%.</p>
</section>

<div style="display: flex; flex-wrap: wrap; gap: 16px">
<section class="dtp-card" aria-labelledby="titolo-settore" style="flex: 1 1 420px; min-width: 0; background: #FFFFFF; border: 1px solid #D9E1EC; border-radius: 6px; padding: 24px; display: flex; flex-direction: column; gap: 14px">
<div>
<h2 id="titolo-settore" style="margin: 0; font-size: 18px; font-weight: 600">Retail e servizi è il settore meno redditizio: 44% di margine</h2>
<p style="margin: 4px 0 0; font-size: 13px; color: #4D5762">Ricavi, costi diretti e margine per settore (migliaia di €, canone periodico, componente variabile e overage)</p>
</div>
<div role="table" aria-label="Margine per settore" style="font-size: 14px">
<div role="row" style="display: grid; grid-template-columns: 1.4fr 1fr 1fr 1fr 1.6fr; color: #4D5762; font-size: 12px; border-bottom: 1px solid #D9E1EC; text-align: right">
<span role="columnheader" style="padding: 8px; text-align: left">Settore</span>
<span role="columnheader" style="padding: 8px">Ricavi</span>
<span role="columnheader" style="padding: 8px">Costi</span>
<span role="columnheader" style="padding: 8px">Margine</span>
<span role="columnheader" style="padding: 8px; text-align: left">Margine %</span>
</div>
<sc-for list="{{bySector}}" as="b" hint-placeholder-count="5">
<div role="row" style="display: grid; grid-template-columns: 1.4fr 1fr 1fr 1fr 1.6fr; align-items: center; border-bottom: 1px solid #EAEFF5; text-align: right">
<span role="rowheader" style="padding: 10px 8px; text-align: left; font-weight: 600">{{b.name}}</span>
<span role="cell" style="padding: 10px 8px">{{b.rev}}</span>
<span role="cell" style="padding: 10px 8px">{{b.cost}}</span>
<span role="cell" style="padding: 10px 8px">{{b.marg}}</span>
<span role="cell" style="padding: 10px 8px; display: flex; align-items: center; gap: 8px"><strong style="font-weight: 700; width: 48px; text-align: right; color: {{b.color}}">{{b.pct}}</strong><span style="flex: 1; height: 8px; border-radius: 4px; background: #E4EAF2"><span style="display: block; width: {{b.w}}; height: 8px; border-radius: 4px; background: #0047BB"></span></span></span>
</div>
</sc-for>
</div>
</section>

<section class="dtp-card" aria-labelledby="titolo-trend" style="flex: 1 1 420px; min-width: 0; background: #FFFFFF; border: 1px solid #D9E1EC; border-radius: 6px; padding: 24px; display: flex; flex-direction: column; gap: 12px">
<div>
<h2 id="titolo-trend" style="margin: 0; font-size: 18px; font-weight: 600">Il margine sale da 57,2% a 61,0% nell'anno</h2>
<p style="margin: 4px 0 0; font-size: 13px; color: #4D5762">Margine lordo mensile in % dei ricavi · il calo di agosto segue i volumi stagionali</p>
</div>
<svg viewBox="0 0 480 220" width="100%" role="img" aria-label="Margine lordo mensile: 57,2% a gennaio, 58,8% ad agosto, 61,0% a ottobre" style="display: block; font-family: inherit">
<line x1="40" x2="470" y1="{{t.y62}}" y2="{{t.y62}}" stroke="#EAEFF5"></line>
<line x1="40" x2="470" y1="{{t.y59}}" y2="{{t.y59}}" stroke="#EAEFF5"></line>
<line x1="40" x2="470" y1="{{t.y56}}" y2="{{t.y56}}" stroke="#EAEFF5"></line>
<text x="32" y="{{t.y62t}}" text-anchor="end" font-size="11" fill="#4D5762">62%</text>
<text x="32" y="{{t.y59t}}" text-anchor="end" font-size="11" fill="#4D5762">59%</text>
<text x="32" y="{{t.y56t}}" text-anchor="end" font-size="11" fill="#4D5762">56%</text>
<path d="{{t.line}}" fill="none" stroke="#0047BB" stroke-width="2.5" stroke-linejoin="round"></path>
<circle cx="{{t.lastX}}" cy="{{t.lastY}}" r="5" fill="#0047BB" stroke="#FFFFFF" stroke-width="2"></circle>
<text x="{{t.lastLx}}" y="{{t.lastLy}}" text-anchor="end" font-size="12" font-weight="600" fill="#1A1C1E">61,0%</text>
<text x="{{t.firstX}}" y="{{t.firstLy}}" font-size="12" font-weight="600" fill="#1A1C1E">57,2%</text>
<sc-for list="{{t.ticks}}" as="x" hint-placeholder-count="10">
<text x="{{x.x}}" y="210" text-anchor="middle" font-size="11" fill="#4D5762">{{x.l}}</text>
</sc-for>
</svg>
</section>
</div>

<section class="dtp-card" aria-labelledby="titolo-unitari" style="background: #FFFFFF; border: 1px solid #D9E1EC; border-radius: 6px; padding: 24px; display: flex; flex-direction: column; gap: 14px">
<div>
<h2 id="titolo-unitari" style="margin: 0; font-size: 18px; font-weight: 600">Prezzo medio realizzato e costo unitario</h2>
<p style="margin: 4px 0 0; font-size: 13px; color: #4D5762">Euro per unità, gennaio → ottobre 2026 · il prezzo comprende la quota di canone e l'overage</p>
</div>
<div style="overflow-x: auto">
<div role="table" aria-label="Prezzo e costo unitario per servizio" style="min-width: 760px; font-size: 13px">
<div role="row" style="display: grid; grid-template-columns: 2.2fr 1fr 1fr 1fr 1fr; color: #4D5762; font-size: 12px; border-bottom: 1px solid #D9E1EC; text-align: right">
<span role="columnheader" style="padding: 10px; text-align: left">Servizio</span>
<span role="columnheader" style="padding: 10px">Volume</span>
<span role="columnheader" style="padding: 10px">Prezzo medio</span>
<span role="columnheader" style="padding: 10px">Costo unitario</span>
<span role="columnheader" style="padding: 10px">Margine unitario</span>
</div>
<sc-for list="{{unit}}" as="u" hint-placeholder-count="9">
<div role="row" style="display: grid; grid-template-columns: 2.2fr 1fr 1fr 1fr 1fr; border-bottom: 1px solid #EAEFF5; text-align: right">
<span role="rowheader" style="padding: 10px; text-align: left; font-weight: 500">{{u.name}}</span>
<span role="cell" style="padding: 10px">{{u.vol}}</span>
<span role="cell" style="padding: 10px">{{u.price}}</span>
<span role="cell" style="padding: 10px">{{u.cost}}</span>
<span role="cell" style="padding: 10px; font-weight: 600; color: {{u.color}}">{{u.marg}}</span>
</div>
</sc-for>
</div>
</div>
</section>

<sc-if value="{{isCdg}}" hint-placeholder-val="{{ true }}">
<section class="dtp-card" aria-labelledby="titolo-passivo" style="background: #FFFFFF; border: 1px solid #D9E1EC; border-radius: 6px; padding: 24px; display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 12px">
<div>
<h2 id="titolo-passivo" style="margin: 0; font-size: 18px; font-weight: 600">Ciclo passivo: costi diretti del 6,6% sopra il budget</h2>
<p style="margin: 4px 0 0; font-size: 13px; color: #4D5762">€ 1.513k contro € 1.420k di budget a ottobre · lo scostamento viene dalle verifiche manuali e dal fornitore di riconoscimento</p>
</div>
<label style="display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: #4D5762; font-weight: 500">Stato fatture<select style="min-height: 44px; min-width: 180px; padding: 0 10px; border-radius: 6px; border: 1px solid #B8C2CF; background: #FFFFFF; font: inherit; font-size: 14px; color: #1A1C1E"><option>Tutte</option><option>Da approvare</option><option>Approvate</option><option>Pagate</option></select></label>
</div>
<div style="overflow-x: auto">
<div role="table" aria-label="Fornitori e fatture passive" style="min-width: 1000px; font-size: 13px">
<div role="row" style="display: grid; grid-template-columns: 1.6fr 1.6fr 1.5fr 0.9fr 0.9fr 0.9fr 1.2fr 1.2fr; color: #4D5762; font-size: 12px; border-bottom: 1px solid #D9E1EC">
<span role="columnheader" style="padding: 10px">Fornitore</span>
<span role="columnheader" style="padding: 10px">Categoria</span>
<span role="columnheader" style="padding: 10px">Servizi collegati</span>
<span role="columnheader" style="padding: 10px; text-align: right">Costo YTD</span>
<span role="columnheader" style="padding: 10px; text-align: right">Budget YTD</span>
<span role="columnheader" style="padding: 10px; text-align: right">Scostamento</span>
<span role="columnheader" style="padding: 10px">Da approvare</span>
<span role="columnheader" style="padding: 10px">Azione</span>
</div>
<sc-for list="{{suppliers}}" as="s" hint-placeholder-count="6">
<div role="row" style="display: grid; grid-template-columns: 1.6fr 1.6fr 1.5fr 0.9fr 0.9fr 0.9fr 1.2fr 1.2fr; align-items: center; border-bottom: 1px solid #EAEFF5">
<span role="rowheader" style="padding: 10px; font-weight: 600">{{s.name}}</span>
<span role="cell" style="padding: 10px">{{s.cat}}</span>
<span role="cell" style="padding: 10px">{{s.svc}}</span>
<span role="cell" style="padding: 10px; text-align: right">{{s.cost}}</span>
<span role="cell" style="padding: 10px; text-align: right; color: #4D5762">{{s.budget}}</span>
<span role="cell" style="padding: 10px; text-align: right; font-weight: 600; color: {{s.dColor}}">{{s.delta}}</span>
<span role="cell" style="padding: 10px">{{s.todo}}</span>
<span role="cell" style="padding: 6px 10px"><a href="#rating" style="font-size: 13px; font-weight: 600; text-decoration: none; display: inline-block; padding: 8px 0">Apri in rating</a></span>
</div>
</sc-for>
</div>
</div>
<p style="margin: 0; font-size: 13px; color: #4D5762">Costi indiretti esclusi (infrastruttura cloud, supporto, personale): € 520k a ottobre. Con questi il margine di contribuzione scende al 44,9%.</p>
</section>
</sc-if>

</main>
</div>
</template>
<script>
/* Mini runtime per le pagine esportate: template {{ }}, sc-for, sc-if, onClick, setState. */
(function () {
  var _tl = Number.prototype.toLocaleString;
  Number.prototype.toLocaleString = function (loc, opt) {
    if (loc === 'it-IT') opt = Object.assign({ useGrouping: 'always' }, opt || {});
    try { return _tl.call(this, loc, opt); } catch (e) { return _tl.call(this, loc); }
  };
  var HOLE = /\{\{\s*([^}]+?)\s*\}\}/g, FULL = /^\{\{\s*([^}]+?)\s*\}\}$/;
  function lookup(path, scope) {
    path = path.trim();
    if (path === 'true') return true; if (path === 'false') return false;
    if (/^-?\d+(\.\d+)?$/.test(path)) return Number(path);
    var parts = path.split('.'), v = scope;
    for (var i = 0; i < parts.length; i++) { if (v == null) return undefined; v = v[parts[i]]; }
    return v;
  }
  function interp(str, scope) {
    return str.replace(HOLE, function (_, p) { var v = lookup(p, scope); return v == null ? '' : String(v); });
  }
  function renderChildren(src, dst, scope) {
    for (var c = src.firstChild; c; c = c.nextSibling) renderNode(c, dst, scope);
  }
  function renderNode(node, dst, scope) {
    if (node.nodeType === 3) { dst.appendChild(document.createTextNode(interp(node.nodeValue, scope))); return; }
    if (node.nodeType !== 1) return;
    var tag = node.localName;
    if (tag === 'sc-for') {
      var list = lookup((node.getAttribute('list') || '').replace(/^\{\{|\}\}$/g, ''), scope) || [];
      var as = node.getAttribute('as') || 'item';
      list.forEach(function (item, i) {
        var s = Object.create(scope); s[as] = item; s.$index = i;
        renderChildren(node, dst, s);
      });
      return;
    }
    if (tag === 'sc-if') {
      var val = lookup((node.getAttribute('value') || '').replace(/^\{\{|\}\}$/g, ''), scope);
      if (val) renderChildren(node, dst, scope);
      return;
    }
    var el = node.namespaceURI === 'http://www.w3.org/2000/svg'
      ? document.createElementNS(node.namespaceURI, node.localName) : document.createElement(node.localName);
    for (var a = 0; a < node.attributes.length; a++) {
      var at = node.attributes[a], name = at.name, raw = at.value;
      if (name.indexOf('hint-') === 0) continue;
      var m = raw.match(FULL);
