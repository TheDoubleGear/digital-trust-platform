<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scheda cliente 360° – Dashboard Operativa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;family=IBM+Plex+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F3F7FC}
*{box-sizing:border-box}
a{color:#0047BB}a:hover{color:#003A99}
</style>
<link rel="stylesheet" href="dtp-theme.css">
<link rel="icon" type="image/svg+xml" href="../favicon.svg">
<link rel="stylesheet" href="dtp-auth.css">
<script src="dtp-auth.js"></script>
<script src="dtp-catalogo.js"></script>
<script src="dtp-modifiche.js"></script>
</head>
<body>
<div id="app"></div>
<template id="tpl">

<div class="dtp-root" style="min-height: 100dvh; display: flex; flex-wrap: wrap; background: #F3F7FC; font-family: 'Inter', system-ui, sans-serif; color: #1A1C1E; font-variant-numeric: tabular-nums">

<div class="dtp-projectbar" style="flex: 1 1 100%; background: #F2F8FF; color: #1A1C1E; border-bottom: 1px solid #D9E1EC">
<div style="padding: 8px 32px; display: flex; flex-wrap: wrap; align-items: center; gap: 12px">
<a class="dtp-home" href="../workspace" title="Torna a Workspace / 2026" data-testid="link-home">Home</a>
<span class="dtp-session"><span class="dtp-session-tag">Accesso demo</span><span class="dtp-session-who" data-testid="text-current-role"><span data-dtp-role></span></span><button class="dtp-logout" type="button" data-dtp-logout data-testid="button-logout">Esci</button></span>
</div>
</div>

<nav class="dtp-sidenav" aria-label="Navigazione principale" style="flex: 1 1 240px; max-width: 100%; background: #0047BB; color: #FFFFFF; padding: 20px 14px; display: flex; flex-direction: column; gap: 22px">
<div style="display: flex; align-items: center; gap: 10px; padding: 0 8px">
<svg width="32" height="32" viewBox="0 0 34 34" aria-hidden="true"><rect width="34" height="34" rx="9" fill="#FFEC00"></rect><path d="M17 7l8 3v6c0 5-3.4 8.6-8 10-4.6-1.4-8-5-8-10v-6z" fill="none" stroke="#0047BB" stroke-width="2" stroke-linejoin="round"></path><path d="M13 16.5l3 3 5-5.5" fill="none" stroke="#0047BB" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg>
<div>
<div style="font-weight: 700; font-size: 17px; line-height: 1.1">postel</div>
<div style="font-size: 11px; color: #DCE8FF">Console operativa DTP</div>
</div>
</div>
<div style="display: flex; flex-direction: column; gap: 2px">
<sc-for list="{{nav}}" as="n" hint-placeholder-count="5">
<a class="dtp-sidelink" href="{{n.href}}" aria-current="{{n.current}}" style="min-height: 44px; display: flex; align-items: center; gap: 10px; padding: 0 12px; border-radius: 6px; background: {{n.bg}}; color: {{n.fg}}; font-size: 14px; font-weight: {{n.weight}}; text-decoration: none"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{n.icon}}"></path></svg>{{n.label}}</a>
</sc-for>
</div>
<div style="display: flex; flex-direction: column; gap: 2px; padding-top: 14px; border-top: 1px solid #3B74D6">
<span style="font-size: 11px; color: #C8DAFB; text-transform: uppercase; letter-spacing: 0.06em; padding: 0 12px 6px; font-weight: 600">Sistemi collegati</span>
<sc-for list="{{ext}}" as="e" hint-placeholder-count="1">
<a class="dtp-sidelink" href="#{{e.id}}" style="min-height: 44px; display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 0 12px; border-radius: 6px; color: #FFFFFF; font-size: 14px; font-weight: 500; text-decoration: none">{{e.label}}<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17 17 7M8 7h9v9"></path></svg></a>
</sc-for>
</div>
<div style="margin-top: auto; padding: 12px; border-radius: 6px; background: #003A99; display: flex; flex-direction: column; gap: 4px">
<span style="font-size: 14px; font-weight: 600">{{who.name}}</span>
<span style="font-size: 12px; color: #DCE8FF">{{who.role}}</span>
</div>
</nav>

<main class="dtp-main" style="flex: 999 1 560px; min-width: 0; padding: 24px 32px 48px; display: flex; flex-direction: column; gap: 20px">

<div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 12px">
<nav aria-label="Percorso" style="font-size: 13px; color: #4D5762"><a href="postel-O2-portafoglio.html" style="text-decoration: none">Portafoglio e contratti</a> / Assicurazioni Aurora S.p.A.</nav>
<label style="display: flex; align-items: center; gap: 8px; font-size: 13px; color: #4D5762">Cambia cliente<input type="search" placeholder="Ragione sociale" style="min-height: 40px; width: 240px; padding: 0 12px; border-radius: 6px; border: 1px solid #B8C2CF; font: inherit; font-size: 13px; color: #1A1C1E"></label>
</div>

<section class="dtp-card" aria-label="Intestazione cliente" style="background: #FFFFFF; border: 1px solid #D9E1EC; border-radius: 6px; padding: 22px 24px; display: flex; flex-wrap: wrap; gap: 24px; align-items: center">
<div style="display: flex; align-items: center; gap: 16px; flex: 1 1 380px">
<div style="width: 64px; height: 64px; border-radius: 6px; border: 1px dashed #9AA6B8; display: flex; align-items: center; justify-content: center; font-size: 11px; color: #4D5762; text-align: center; line-height: 1.3">[LOGO<br>CLIENTE]</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<h1 style="margin: 0; font-size: 24px; font-weight: 600; letter-spacing: -0.01em">Assicurazioni Aurora S.p.A.</h1>
<span style="font-size: 13px; color: #4D5762">Assicurazioni · Nord-Ovest · account manager Marco Rinaldi · cliente dal mar 2025</span>
<div style="display: flex; flex-wrap: wrap; gap: 8px">
<span style="padding: 3px 10px; border-radius: 999px; background: #0047BB; color: #FFFFFF; font-size: 12px; font-weight: 600">9 servizi configurati</span>
<span style="padding: 3px 10px; border-radius: 999px; background: #E3F3EA; color: #1A6B4A; font-size: 12px; font-weight: 600">Contratto attivo fino al 28 feb 2027</span>
<span style="padding: 3px 10px; border-radius: 999px; background: #FBE3E1; color: #A3201A; font-size: 12px; font-weight: 600">Segmento: Overage</span>
</div>
</div>
</div>
<dl style="margin: 0; flex: 1 1 420px; display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 14px">
<sc-for list="{{head}}" as="h" hint-placeholder-count="4">
<div><dt style="font-size: 12px; color: #4D5762">{{h.k}}</dt><dd style="margin: 2px 0 0; font-size: 20px; font-weight: 600; color: {{h.color}}">{{h.v}}</dd><dd style="margin: 2px 0 0; font-size: 12px; color: #4D5762">{{h.sub}}</dd></div>
</sc-for>
</dl>
</section>

<section class="dtp-card" aria-labelledby="titolo-vista" style="background: #FFFFFF; border: 1px solid #D9E1EC; border-radius: 6px; overflow: hidden; display: flex; flex-direction: column">
<div style="background: #FDF1D6; padding: 10px 24px; font-size: 13px; color: #5C3D00; display: flex; flex-wrap: wrap; gap: 8px; justify-content: space-between">
<span><strong style="font-weight: 600">Vista Postel</strong> · gli stessi dati che vede il cliente, in sola lettura</span>
<span style="color: #5C3D00">Il portale del cliente resta riservato alle sue utenze: da qui non si apre</span>
</div>
<div style="padding: 20px 24px 24px; display: flex; flex-direction: column; gap: 16px">
<div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 12px">
<h2 id="titolo-vista" style="margin: 0; font-size: 18px; font-weight: 600">Vista del cliente</h2>
<div class="dtp-seg" role="tablist" aria-label="Sotto-viste del cliente" style="display: flex; gap: 4px; padding: 4px; border-radius: 999px; background: #E4EAF2">
<sc-for list="{{vtabs}}" as="t" hint-placeholder-count="4">
<button class="dtp-btn" type="button" role="tab" aria-selected="{{t.sel}}" onClick="{{t.pick}}" style="min-height: 40px; padding: 0 18px; border-radius: 999px; border: 0; background: {{t.bg}}; color: #1A1C1E; font: inherit; font-size: 13px; font-weight: {{t.weight}}; cursor: pointer">{{t.label}}</button>
</sc-for>
</div>
</div>

<sc-if value="{{view.m1}}" hint-placeholder-val="{{ true }}">
<div style="display: flex; flex-direction: column; gap: 14px">
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px">
<sc-for list="{{m1kpi}}" as="k" hint-placeholder-count="4">
<div style="padding: 14px; border-radius: 6px; background: #F3F7FC; display: flex; flex-direction: column; gap: 4px"><span style="font-size: 12px; color: #4D5762">{{k.label}}</span><span style="font-size: 20px; font-weight: 600; color: {{k.color}}">{{k.value}}</span></div>
</sc-for>
</div>
<div style="overflow-x: auto">
<div role="table" aria-label="Consumi per servizio del cliente" style="min-width: 820px; font-size: 13px">
<div role="row" style="display: grid; grid-template-columns: 2.4fr 1.3fr 1.6fr 1fr 1.1fr 0.7fr; color: #4D5762; font-size: 12px; border-bottom: 1px solid #D9E1EC">
<span role="columnheader" style="padding: 8px 10px">Servizio</span>
<span role="columnheader" style="padding: 8px 10px; text-align: right">Consumato / incluso</span>
<span role="columnheader" style="padding: 8px 10px">% consumo</span>
<span role="columnheader" style="padding: 8px 10px">Stato</span>
<span role="columnheader" style="padding: 8px 10px">Esaurimento</span>
<span role="columnheader" style="padding: 8px 10px; text-align: right">Ritmo</span>
</div>
<sc-for list="{{svc}}" as="s" hint-placeholder-count="9">
<div role="row" style="display: grid; grid-template-columns: 2.4fr 1.3fr 1.6fr 1fr 1.1fr 0.7fr; align-items: center; border-bottom: 1px solid #EAEFF5">
<span role="rowheader" style="padding: 8px 10px; font-weight: 500">{{s.name}}</span>
<span role="cell" style="padding: 8px 10px; text-align: right">{{s.used}} / {{s.incl}}</span>
<span role="cell" style="padding: 8px 10px; display: flex; align-items: center; gap: 8px"><strong style="font-weight: 600; width: 50px">{{s.pct}}</strong><span style="flex: 1; height: 6px; border-radius: 3px; background: #E4EAF2"><span style="display: block; width: {{s.w}}; height: 6px; border-radius: 3px; background: {{s.bar}}"></span></span></span>
<span role="cell" style="padding: 8px 10px"><span style="display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 12px; font-weight: 600; background: {{s.bg}}; color: {{s.fg}}">{{s.state}}</span></span>
<span role="cell" style="padding: 8px 10px">{{s.ex}}</span>
<span role="cell" style="padding: 8px 10px; text-align: right; font-weight: 600">{{s.pace}}</span>
</div>
</sc-for>
</div>
</div>
</div>
</sc-if>

<sc-if value="{{view.other}}" hint-placeholder-val="{{ false }}">
<div style="padding: 28px; border-radius: 6px; border: 1px dashed #9AA6B8; display: flex; flex-direction: column; gap: 8px; align-items: flex-start">
<strong style="font-size: 15px; font-weight: 600">{{view.title}}</strong>
<span style="font-size: 14px; color: #4D5762; line-height: 1.5; max-width: 680px">{{view.text}}</span>
<a href="{{view.href}}" style="font-size: 14px; font-weight: 600; text-decoration: none; padding: 8px 0">Apri la sotto-vista del cliente →</a>
</div>
</sc-if>
</div>
</section>

<section class="dtp-card" aria-labelledby="titolo-amministrazione" style="background: #FFFFFF; border: 1px solid #D9E1EC; border-radius: 6px; padding: 24px; display: flex; flex-direction: column; gap: 14px">
<div>
<h2 id="titolo-amministrazione" style="margin: 0; font-size: 18px; font-weight: 600">Richieste contrattuali e pagamenti</h2>
<p style="margin: 4px 0 0; font-size: 13px; color: #4D5762">{{adminNote}}</p>
</div>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 12px">
<sc-for list="{{admin}}" as="a" hint-placeholder-count="4">
<div style="border: 1px solid #D9E1EC; border-radius: 6px; padding: 16px; display: flex; flex-direction: column; gap: 4px">
<span style="font-size: 13px; color: #4D5762; font-weight: 500">{{a.label}}</span>
<span style="font-size: 15px; font-weight: 600; color: {{a.color}}">{{a.value}}</span>
<span style="font-size: 12px; color: #4D5762">{{a.sub}}</span>
</div>
</sc-for>
</div>
</section>

<div style="display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-start">
<section class="dtp-card" aria-labelledby="titolo-contratti" style="flex: 999 1 560px; min-width: 0; background: #FFFFFF; border: 1px solid #D9E1EC; border-radius: 6px; padding: 24px; display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 12px">
<div>
<h2 id="titolo-contratti" style="margin: 0; font-size: 18px; font-weight: 600">Contratti e modifiche dell’offerta</h2>
<p style="margin: 4px 0 0; font-size: 13px; color: #4D5762">Storico da commercial orchestration, dal più recente</p>
</div>
<sc-if value="{{isCom}}" hint-placeholder-val="{{ true }}"><a class="dtp-btn" href="#co" style="min-height: 44px; padding: 0 18px; border-radius: 999px; border: 1px solid #B8C2CF; font-size: 13px; font-weight: 600; text-decoration: none; display: flex; align-items: center">Apri in commercial orchestration</a></sc-if>
</div>
<ul style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column">
<sc-for list="{{orders}}" as="o" hint-placeholder-count="5">
<li style="display: grid; grid-template-columns: 120px minmax(0, 1fr) auto auto; gap: 14px; align-items: center; padding: 12px 0; border-bottom: 1px solid #EAEFF5">
<span style="font-size: 12px; color: #4D5762">{{o.date}}</span>
<span style="display: flex; flex-direction: column; gap: 2px"><strong style="font-size: 14px; font-weight: 600">{{o.what}}</strong><span style="font-size: 12px; color: #4D5762">{{o.meta}}</span></span>
<span style="padding: 3px 9px; border-radius: 999px; font-size: 12px; font-weight: 600; background: {{o.bg}}; color: {{o.fg}}">{{o.state}}</span>
<span style="min-width: 80px; text-align: right; font-size: 14px; font-weight: 600">{{o.amount}}</span>
</li>
</sc-for>
</ul>
</section>

<section class="dtp-card" aria-labelledby="titolo-ticket" style="flex: 1 1 380px; min-width: 0; background: #FFFFFF; border: 1px solid #D9E1EC; border-radius: 6px; padding: 24px; display: flex; flex-direction: column; gap: 14px">
<h2 id="titolo-ticket" style="margin: 0; font-size: 18px; font-weight: 600">Ticket e alert</h2>
<span style="font-size: 12px; color: #4D5762; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em">Ticket PIX</span>
<ul style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column">
<sc-for list="{{tickets}}" as="t" hint-placeholder-count="3">
<li style="display: flex; gap: 12px; padding: 10px 0; border-bottom: 1px solid #EAEFF5">
<span style="flex: none; width: 36px; height: 24px; border-radius: 6px; background: {{t.bg}}; color: {{t.fg}}; font-size: 12px; font-weight: 700; display: flex; align-items: center; justify-content: center">{{t.p}}</span>
<span style="display: flex; flex-direction: column; gap: 2px; flex: 1">
<span style="font-size: 14px; font-weight: 600">{{t.what}}</span>
<span style="font-size: 12px; color: #4D5762">{{t.id}} · {{t.when}} · {{t.state}}</span>
<sc-if value="{{isOps}}" hint-placeholder-val="{{ true }}"><a href="#pix" style="font-size: 13px; font-weight: 600; text-decoration: none; padding: 4px 0">Apri in PIX</a></sc-if>
</span>
</li>
</sc-for>
</ul>
<span style="font-size: 12px; color: #4D5762; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; padding-top: 6px">Alert inviati al cliente</span>
<ul style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column">
<sc-for list="{{alerts}}" as="a" hint-placeholder-count="4">
<li style="display: flex; justify-content: space-between; gap: 10px; padding: 8px 0; border-bottom: 1px solid #EAEFF5; font-size: 13px"><span>{{a.what}}</span><span style="color: #4D5762; white-space: nowrap">{{a.when}}</span></li>
</sc-for>
</ul>
</section>
</div>

</main>
</div>
</template>
<script>
/* Mini runtime per le pagine esportate: template {{ }}, sc-for, sc-if, onClick, setState. */
(function () {
  var _tl = Number.prototype.toLocaleString;
  Number.prototype.toLocaleString = function (loc, opt) {
    if (loc === 'it-IT') opt = Object.assign({ useGrouping: 'always' }, opt || {});
    try { return _tl.call(this, loc, opt); } catch (e) { return _tl.call(this, loc); }
  };
  var HOLE = /\{\{\s*([^}]+?)\s*\}\}/g, FULL = /^\{\{\s*([^}]+?)\s*\}\}$/;
  function lookup(path, scope) {
    path = path.trim();
    if (path === 'true') return true; if (path === 'false') return false;
    if (/^-?\d+(\.\d+)?$/.test(path)) return Number(path);
    var parts = path.split('.'), v = scope;
    for (var i = 0; i < parts.length; i++) { if (v == null) return undefined; v = v[parts[i]]; }
    return v;
  }
  function interp(str, scope) {
    return str.replace(HOLE, function (_, p) { var v = lookup(p, scope); return v == null ? '' : String(v); });
  }
  function renderChildren(src, dst, scope) {
    for (var c = src.firstChild; c; c = c.nextSibling) renderNode(c, dst, scope);
  }
  function renderNode(node, dst, scope) {
    if (node.nodeType === 3) { dst.appendChild(document.createTextNode(interp(node.nodeValue, scope))); return; }
    if (node.nodeType !== 1) return;
    var tag = node.localName;
    if (tag === 'sc-for') {
      var list = lookup((node.getAttribute('list') || '').replace(/^\{\{|\}\}$/g, ''), scope) || [];
      var as = node.getAttribute('as') || 'item';
      list.forEach(function (item, i) {
        var s = Object.create(scope); s[as] = item; s.$index = i;
        renderChildren(node, dst, s);
      });
      return;
    }
    if (tag === 'sc-if') {
      var val = lookup((node.getAttribute('value') || '').replace(/^\{\{|\}\}$/g, ''), scope);
      if (val) renderChildren(node, dst, scope);
      return;
    }
    var el = node.namespaceURI === 'http://www.w3.org/2000/svg'
      ? document.createElementNS(node.namespaceURI, node.localName) : document.createElement(node.localName);
    for (var a = 0; a < node.attributes.length; a++) {
      var at = node.attributes[a], name = at.name, raw = at.value;
      if (name.indexOf('hint-') === 0) continue;
      var m = raw.match(FULL);
      if (m) {
        var v = lookup(m[1], scope);
        if (name.indexOf('on') === 0 && typeof v === 'function') { el.addEventListener(name.slice(2), v); continue; }
        if (name === 'defaultchecked' || name === 'checked') { if (v) { el.setAttribute('checked', ''); el.checked = true; } continue; }
        if (name === 'defaultvalue') { el.setAttribute('value', v == null ? '' : String(v)); continue; }
        if (v == null || v === false && name.indexOf('aria-') !== 0) continue;
        el.setAttribute(name, String(v));
      } else if (name === 'defaultvalue') { el.setAttribute('value', raw);
      } else if (name === 'defaultchecked') { el.setAttribute('checked', '');
      } else { el.setAttribute(name, interp(raw, scope)); }
    }
    renderChildren(node.localName === 'template' ? node.content : node, el, scope);
    dst.appendChild(el);
  }
  function DCLogic(props) { this.props = props || {}; this.state = null; }
  DCLogic.prototype.setState = function (o) {
    this.state = Object.assign({}, this.state || {}, o);
    this.__render();
  };
  DCLogic.prototype.forceUpdate = function () { this.__render(); };
  window.DCLogic = DCLogic;
  window.DC = {
    mount: function (Comp, meta) {
      var props = {};
      Object.keys(meta).forEach(function (k) { if (k[0] !== '$' && meta[k] && 'default' in meta[k]) props[k] = meta[k]['default']; });
      /* Sessione demo: il ruolo arriva da DTPAuth; senza permesso la pagina non viene disegnata. */
      var auth = window.DTPAuth, access = auth ? auth.enter(meta) : null;
      if (!access) return;
      if (meta.persona && meta.persona.options) props.persona = access.role;
      var tpl = document.getElementById('tpl').content, root = document.getElementById('app');
      var c = new Comp(props);
      c.__render = function () {
        var frag = document.createDocumentFragment();
        renderChildren(tpl, frag, c.renderVals());
        root.replaceChildren(frag);
        auth.decorate(root);
      };
      c.__render();
    }
  };
})();

</script>
<script>

class Component extends DCLogic {
  renderVals() {
    var self = this;
    var st = this.state || {};
    var P = this.props.persona;
    var WHO = { com: { name: 'Marco Rinaldi', role: 'Commerciale' }, ops: { name: 'Chiara Ferri', role: 'Operations · nessun dato economico' }, cdg: { name: 'Elena Moretti', role: 'Controllo di gestione' } };
    var PAGES = [
      ['o1', 'Executive overview', 'postel-O1-executive.html', ['com', 'cdg'], 'M3 3v18h18 M7 15l4-4 3 3 5-6'],
      ['o2', 'Portafoglio e contratti', 'postel-O2-portafoglio.html', ['com', 'ops', 'cdg'], 'M3 9a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2'],
