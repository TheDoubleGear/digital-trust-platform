<h2 id="titolo-destinatari" style="margin: 0; font-size: 18px; font-weight: 600">Chi riceve gli avvisi via email</h2>
<p style="margin: 4px 0 0; font-size: 14px; color: #4D5762">Proposta basata sulle deleghe del passo precedente. Tutti gli avvisi restano comunque visibili nel portale.</p>
</div>
<div style="overflow-x: auto">
<div role="table" aria-label="Destinatari degli avvisi" style="min-width: 680px; font-size: 14px">
<div role="row" style="display: grid; grid-template-columns: 2.4fr 1fr 1fr 1fr; border-bottom: 1px solid #D9E1EC; font-size: 12px; color: #4D5762">
<span role="columnheader" style="padding: 10px">Avviso</span>
<span role="columnheader" style="padding: 10px; text-align: center">Tu<br>legale rappresentante</span>
<span role="columnheader" style="padding: 10px; text-align: center">Delegato amministrativo<br>invito in preparazione</span>
<span role="columnheader" style="padding: 10px; text-align: center">Delegato operativo<br>invito in preparazione</span>
</div>
<sc-for list="{{events}}" as="e" hint-placeholder-count="7">
<div role="row" style="display: grid; grid-template-columns: 2.4fr 1fr 1fr 1fr; align-items: center; border-bottom: 1px solid #EAEFF5">
<span role="rowheader" style="padding: 10px; display: flex; flex-direction: column; gap: 2px"><strong style="font-weight: 600">{{e.name}}</strong><span style="font-size: 12px; color: #4D5762">{{e.sub}}</span></span>
<span role="cell" style="padding: 10px; display: flex; justify-content: center"><input type="checkbox" aria-label="{{e.name}}: legale rappresentante" defaultChecked="{{e.lr}}" style="width: 20px; height: 20px"></span>
<span role="cell" style="padding: 10px; display: flex; justify-content: center"><input type="checkbox" aria-label="{{e.name}}: delegato amministrativo" defaultChecked="{{e.amm}}" style="width: 20px; height: 20px"></span>
<span role="cell" style="padding: 10px; display: flex; justify-content: center"><sc-if value="{{e.opAllowed}}" hint-placeholder-val="{{ true }}"><input type="checkbox" aria-label="{{e.name}}: delegato operativo" defaultChecked="{{e.op}}" style="width: 20px; height: 20px"></sc-if><sc-if value="{{e.opNo}}" hint-placeholder-val="{{ false }}"><span style="font-size: 12px; color: #4D5762">non previsto</span></sc-if></span>
</div>
</sc-for>
</div>
</div>
<p style="margin: 0; font-size: 13px; color: #4D5762">Il delegato operativo riceve solo avvisi sui consumi, espressi in quantità: per ruolo non vede importi, ordini e fatture.</p>
</section>

<section class="dtp-card" aria-labelledby="titolo-preferenze" style="background: #FFFFFF; border: 1px solid #D9E1EC; border-radius: 6px; padding: 24px; display: flex; flex-direction: column; gap: 14px">

<label style="display: flex; flex-direction: column; gap: 4px; font-size: 13px; font-weight: 500">Indirizzo per le comunicazioni amministrative<input type="email" placeholder="amministrazione@azienda.it" style="min-height: 44px; padding: 0 12px; border-radius: 6px; border: 1px solid #B8C2CF; font: inherit; font-size: 14px"><span style="font-size: 12px; color: #4D5762; font-weight: 400">riceve fatture e comunicazioni sul contratto</span></label>
<label style="display: flex; flex-direction: column; gap: 4px; font-size: 13px; font-weight: 500">Lingua delle notifiche<select style="min-height: 44px; padding: 0 10px; border-radius: 6px; border: 1px solid #B8C2CF; background: #FFFFFF; font: inherit; font-size: 14px"><option>Italiano</option><option>English</option></select></label>
</div>
<label style="display: flex; align-items: flex-start; gap: 10px; min-height: 44px; font-size: 14px; line-height: 1.45"><input type="checkbox" defaultChecked="{{ true }}" style="width: 18px; height: 18px; margin-top: 2px"> Riepilogo settimanale dei consumi via email, il lunedì mattina</label>
<label style="display: flex; align-items: flex-start; gap: 10px; min-height: 44px; font-size: 14px; line-height: 1.45"><input type="checkbox" style="width: 18px; height: 18px; margin-top: 2px"> Raggruppa gli avvisi di attenzione in un unico messaggio giornaliero</label>

<div style="padding: 12px 16px; border-bottom: 1px solid #EAEFF5; font-size: 12px; color: #4D5762; display: flex; flex-direction: column; gap: 2px"><span>Da: Digital Trust Platform · Postel</span><span style="color: #1A1C1E; font-weight: 600; font-size: 14px">Un servizio ha superato la soglia critica</span></div>
<div style="padding: 16px; display: flex; flex-direction: column; gap: 10px; font-size: 14px; line-height: 1.5">
<span style="display: inline-flex; align-self: flex-start; padding: 3px 9px; border-radius: 999px; background: #FDE7DC; color: #B03A0B; font-size: 12px; font-weight: 600">Critico</span>
<span><strong style="font-weight: 600">Identificazioni Full Prospect</strong> ha raggiunto il 90% della quantità inclusa. Al ritmo attuale si esaurirà prima del rinnovo.</span>
<span style="display: inline-flex; align-self: flex-start; min-height: 40px; align-items: center; padding: 0 14px; border-radius: 6px; background: #0047BB; color: #FFFFFF; font-size: 13px; font-weight: 600">Valuta una ricarica</span>
</div>

<p style="margin: 0; font-size: 12px; color: #4D5762; line-height: 1.5">Gli avvisi contengono solo dati aggregati del contratto, mai dati degli utenti finali.</p>

<div><dt style="font-size: 12px; color: #4D5762; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em">Delegati · PS-01</dt><dd style="margin: 4px 0 0; font-size: 14px; line-height: 1.45">Amministrativo e operativo: invito in partenza. Tecnico: gestito da te.</dd></div>

<p style="margin: 0; font-size: 13px; color: #4D5762; line-height: 1.5">Concludendo, firmi gli atti di delega, gli inviti partono e accedi alla homepage. Il primo setup non sarà più disponibile: potrai modificare le deleghe da «Utenze e deleghe» e le soglie da «Contratto e consumi».</p>

<a class="dtp-btn dtp-btn-o" href="cliente-PS01-delegati.html" style="min-height: 48px; padding: 0 22px; border-radius: 999px; border: 1px solid #B8C2CF; background: #FFFFFF; color: #1A1C1E; font-size: 15px; font-weight: 600; text-decoration: none; display: flex; align-items: center">Indietro</a>
<a class="dtp-btn dtp-btn-p" href="cliente-H-catalogo.html" data-dtp-setup="complete" data-testid="link-setup-complete" style="min-height: 48px; padding: 0 26px; border-radius: 999px; background: #0047BB; color: #FFFFFF; font-size: 15px; font-weight: 600; text-decoration: none; display: flex; align-items: center">Concludi e vai alla homepage</a>
</div>

</main>

        auth.decorate(root);
      };
      c.__render();
    }
  };
})();

</script>
