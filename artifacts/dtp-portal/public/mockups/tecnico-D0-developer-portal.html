<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Developer portal – Delegato tecnico</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;family=IBM+Plex+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">

</div>
<div style="flex: 1 1 280px; display: flex; justify-content: center">

</label>
</div>
<div role="group" aria-label="Ambiente" style="display: flex; padding: 3px; border-radius: 999px; background: #FFFFFF; gap: 2px">
<sc-for list="{{envs}}" as="e" hint-placeholder-count="2">

<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1A1C1E" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.7 21a2 2 0 0 1-3.4 0"></path></svg>
<span style="position: absolute; top: 6px; right: 6px; min-width: 18px; height: 18px; border-radius: 9px; background: #C7322A; color: #FFFFFF; font-size: 11px; font-weight: 600; display: flex; align-items: center; justify-content: center; padding: 0 4px">2</span>
</button>
<div style="display: flex; align-items: center; gap: 10px">
<div aria-hidden="true" style="width: 36px; height: 36px; border-radius: 18px; background: #0047BB; color: #FFFFFF; font-size: 13px; font-weight: 600; display: flex; align-items: center; justify-content: center">AC</div>
<div style="line-height: 1.25">
<div style="font-size: 14px; font-weight: 600">Andrea Colombo</div>
<div style="font-size: 12px; color: #33383D">Delegato tecnico · Assicurazioni Aurora S.p.A.</div>
</div>
</div>
</div>

<section class="dtp-card" aria-labelledby="titolo-collaudo" style="background: #FFFFFF; border: 1px solid #D9E1EC; border-radius: 6px; padding: 24px; display: flex; flex-direction: column; gap: 14px">

<h2 id="titolo-collaudo" style="margin: 0; font-size: 18px; font-weight: 600">Collaudi in corso</h2>

</div>
<sc-for list="{{tests}}" as="t" hint-placeholder-count="2">
<div style="border: 1px solid #D9E1EC; border-radius: 6px; padding: 16px; display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap">

<span style="font-size: 13px; color: {{t.fg}}; font-weight: 600">{{t.status}}</span>
</div>

<span><strong style="font-weight: 600; color: #1A6B4A">{{t.pass}}</strong> superati</span>

</div>

<a href="#" style="font-size: 14px; font-weight: 600; text-decoration: none; padding: 6px 0">Apri Collaudo e go-live →</a>

<section class="dtp-card" id="catalogo" aria-labelledby="titolo-catalogo" style="background: #FFFFFF; border: 1px solid #D9E1EC; border-radius: 6px; padding: 24px; display: flex; flex-direction: column; gap: 16px">
<div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 12px">
<div>
<h2 id="titolo-catalogo" style="margin: 0; font-size: 18px; font-weight: 600">Catalogo API</h2>
<p style="margin: 4px 0 0; font-size: 13px; color: #4D5762">{{catCount}} · ogni API si apre nella console sandbox, già autenticata con le credenziali di prova</p>
</div>
<a href="#" style="font-size: 14px; font-weight: 600; text-decoration: none; padding: 10px 0">Scarica le specifiche OpenAPI</a>
</div>
<div role="group" aria-label="Filtra per famiglia" style="display: flex; flex-wrap: wrap; gap: 8px">
<sc-for list="{{fams}}" as="f" hint-placeholder-count="6">

</div>
<div style="overflow-x: auto">
<div role="table" aria-label="Catalogo API" style="min-width: 1040px; font-size: 13px">
<div role="row" style="display: grid; grid-template-columns: 1.25fr 1.55fr 1.15fr 1.45fr 0.5fr 1.25fr 1.05fr; gap: 12px; padding: 10px 12px; border-bottom: 1px solid #D9E1EC; color: #4D5762; font-weight: 500">
<span role="columnheader">Tipologia API</span>
<span role="columnheader">Servizio di riferimento</span>
<span role="columnheader">Famiglia</span>
<span role="columnheader">Modalità</span>
<span role="columnheader">Versione</span>
<span role="columnheader">Stato integrazione</span>
<span role="columnheader">Sandbox</span>
</div>
<sc-for list="{{apis}}" as="r" hint-placeholder-count="13">
<div role="row" style="display: grid; grid-template-columns: 1.25fr 1.55fr 1.15fr 1.45fr 0.5fr 1.25fr 1.05fr; gap: 12px; padding: 12px; border-bottom: 1px solid #EAEFF5; align-items: center">

<span role="cell">{{r.svc}}</span>
<span role="cell" style="color: #3A424C">{{r.fam}}</span>
<span role="cell" style="color: #3A424C">{{r.mode}}</span>
<span role="cell" style="font-family: 'IBM Plex Mono', monospace; font-size: 12px">{{r.ver}}</span>
<span role="cell"><span style="display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 999px; background: {{r.sbg}}; color: {{r.sfg}}; font-size: 12px; font-weight: 600"><span aria-hidden="true" style="width: 7px; height: 7px; border-radius: 4px; background: {{r.sdot}}"></span>{{r.state}}</span></span>
<span role="cell"><a class="dtp-btn" href="{{r.href}}" style="display: inline-flex; align-items: center; gap: 6px; min-height: 36px; padding: 0 16px; border-radius: 999px; border: 1px solid #B8C2CF; font-weight: 600; text-decoration: none; color: #0047BB">Prova in sandbox <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17 17 7M8 7h9v9"></path></svg></a></span>
</div>
</sc-for>
</div>
</div>
</section>

<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(380px, 1fr)); gap: 20px; align-items: start">

<section class="dtp-card" aria-labelledby="titolo-avvio" style="background: #FFFFFF; border: 1px solid #D9E1EC; border-radius: 6px; padding: 24px; display: flex; flex-direction: column; gap: 12px">
<h2 id="titolo-avvio" style="margin: 0; font-size: 18px; font-weight: 600">Avvio rapido · {{envName}}</h2>
<p style="margin: 0; font-size: 13px; color: #4D5762; line-height: 1.45">Ottieni un token di accesso con le credenziali dell'applicazione, poi chiama l'API del servizio. Base URL: <code style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #1A1C1E">{{baseUrl}}</code></p>
<pre class="dtp-code" style="margin: 0; padding: 16px; border-radius: 6px; background: #0B2A5B; color: #E3E8F1; font-family: 'IBM Plex Mono', monospace; font-size: 12px; line-height: 1.6; overflow-x: auto; white-space: pre">{{snippet}}</pre>
<div style="display: flex; flex-wrap: wrap; gap: 16px">
<a href="#" style="font-size: 13px; font-weight: 600; text-decoration: none; padding: 6px 0">Guida introduttiva →</a>
<a href="#" style="font-size: 13px; font-weight: 600; text-decoration: none; padding: 6px 0">Dati e scenari di prova →</a>
</div>
</section>

<section class="dtp-card" aria-labelledby="titolo-app" style="background: #FFFFFF; border: 1px solid #D9E1EC; border-radius: 6px; padding: 24px; display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap">
<h2 id="titolo-app" style="margin: 0; font-size: 18px; font-weight: 600">Applicazioni e credenziali · {{envName}}</h2>
<a href="#" style="font-size: 13px; font-weight: 600; text-decoration: none; padding: 6px 0">Gestisci</a>
</div>
<sc-for list="{{apps}}" as="p" hint-placeholder-count="2">
<div style="border: 1px solid #D9E1EC; border-radius: 6px; padding: 16px; display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; align-items: center">
<span style="font-size: 14px; font-weight: 600">{{p.name}}</span>
<span style="font-size: 12px; font-weight: 600; padding: 3px 10px; border-radius: 999px; background: {{p.bg}}; color: {{p.fg}}">{{p.state}}</span>
</div>
<div style="display: grid; grid-template-columns: 110px 1fr; gap: 6px 12px; font-size: 13px">
<span style="color: #4D5762">Client ID</span><span style="font-family: 'IBM Plex Mono', monospace; font-size: 12px">{{p.cid}}</span>
<span style="color: #4D5762">Segreto</span><span style="font-family: 'IBM Plex Mono', monospace; font-size: 12px">{{p.secret}}</span>

<div style="display: flex; flex-wrap: wrap; gap: 8px">
<button class="dtp-btn dtp-btn-o" type="button" style="min-height: 40px; padding: 0 18px; border-radius: 999px; border: 1px solid #B8C2CF; background: #FFFFFF; font: inherit; font-size: 13px; font-weight: 600; color: #1A1C1E; cursor: pointer">Ruota il segreto</button>
<button class="dtp-btn dtp-btn-o" type="button" style="min-height: 40px; padding: 0 18px; border-radius: 999px; border: 1px solid #B8C2CF; background: #FFFFFF; font: inherit; font-size: 13px; font-weight: 600; color: #A3201A; cursor: pointer">Revoca</button>
</div>
</div>
</sc-for>
</section>

</div>

</main>
</div>
</div>
</template>
<script>
/* Mini runtime per le pagine esportate: template {{ }}, sc-for, sc-if, onClick, setState. */
(function () {
  var _tl = Number.prototype.toLocaleString;
  Number.prototype.toLocaleString = function (loc, opt) {
    if (loc === 'it-IT') opt = Object.assign({ useGrouping: 'always' }, opt || {});
    try { return _tl.call(this, loc, opt); } catch (e) { return _tl.call(this, loc); }
  };
  var HOLE = /\{\{\s*([^}]+?)\s*\}\}/g, FULL = /^\{\{\s*([^}]+?)\s*\}\}$/;
  function lookup(path, scope) {
    path = path.trim();
    if (path === 'true') return true; if (path === 'false') return false;
    if (/^-?\d+(\.\d+)?$/.test(path)) return Number(path);
    var parts = path.split('.'), v = scope;
    for (var i = 0; i < parts.length; i++) { if (v == null) return undefined; v = v[parts[i]]; }
    return v;
  }
  function interp(str, scope) {
    return str.replace(HOLE, function (_, p) { var v = lookup(p, scope); return v == null ? '' : String(v); });
  }
  function renderChildren(src, dst, scope) {
    for (var c = src.firstChild; c; c = c.nextSibling) renderNode(c, dst, scope);
  }
  function renderNode(node, dst, scope) {
    if (node.nodeType === 3) { dst.appendChild(document.createTextNode(interp(node.nodeValue, scope))); return; }
    if (node.nodeType !== 1) return;
    var tag = node.localName;
    if (tag === 'sc-for') {
      var list = lookup((node.getAttribute('list') || '').replace(/^\{\{|\}\}$/g, ''), scope) || [];
      var as = node.getAttribute('as') || 'item';
      list.forEach(function (item, i) {
        var s = Object.create(scope); s[as] = item; s.$index = i;
        renderChildren(node, dst, s);
      });
      return;
