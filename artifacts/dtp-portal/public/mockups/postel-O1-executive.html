<div style="display: flex; flex-direction: column; justify-content: space-between; height: 250px; padding-top: 10px; font-size: 11px; color: #4D5762; text-align: right; width: 32px">
<span>400</span><span>300</span><span>200</span><span>100</span><span>0</span>

<div style="position: absolute; left: 0; right: 0; top: 10px; border-top: 1px dashed #DDE4EE"></div>
<div style="position: absolute; left: 0; right: 0; top: 70px; border-top: 1px dashed #DDE4EE"></div>
<div style="position: absolute; left: 0; right: 0; top: 130px; border-top: 1px dashed #DDE4EE"></div>
<div style="position: absolute; left: 0; right: 0; top: 190px; border-top: 1px dashed #DDE4EE"></div>
<sc-for list="{{rev}}" as="r" hint-placeholder-count="10">

<ul style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 16px">
<sc-for list="{{bysvc}}" as="b" hint-placeholder-count="9">

<div style="display: flex; justify-content: space-between; gap: 8px; font-size: 14px"><strong style="font-weight: 600">{{b.name}}</strong><span style="color: #4D5762">{{b.clients}} clienti · <strong style="color: #1A1C1E; font-weight: 600">{{b.arr}}</strong></span></div>
<div style="height: 10px; border-radius: 5px; background: #E4EAF2"><div style="width: {{b.w}}; height: 10px; border-radius: 5px; background: #0047BB"></div></div>
<span style="font-size: 12px; color: #4D5762">{{b.share}} dell'ARR · {{b.cshare}} dei clienti</span>

</sc-for>

<p style="margin: 0; padding-top: 12px; border-top: 1px solid #EAEFF5; font-size: 13px; color: #4D5762">Concentrazione: i primi 10 clienti valgono il <strong style="color: #1A1C1E; font-weight: 600">38%</strong> dei ricavi YTD.</p>

</div>

<section class="dtp-card" aria-labelledby="titolo-heatmap" style="background: #FFFFFF; border: 1px solid #D9E1EC; border-radius: 6px; padding: 24px; display: flex; flex-direction: column; gap: 16px">
<div style="display: flex; flex-wrap: wrap; justify-content: space-between; gap: 12px">
<div>
<h2 id="titolo-heatmap" style="margin: 0; font-size: 18px; font-weight: 600">Le assicurazioni consumano sopra ritmo Certificati FEA e Full Prospect</h2>
<p style="margin: 4px 0 0; font-size: 13px; color: #4D5762">Saturazione servizio × settore: ritmo medio di consumo delle quantità configurate (1,00 = in linea con il periodo trascorso)</p>
</div>
<div style="display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 12px; color: #4D5762">
<span>sotto ritmo</span>
<span style="width: 28px; height: 16px; border-radius: 3px; background: #BFD6FA"></span>
<span style="width: 28px; height: 16px; border-radius: 3px; background: #E1ECFD"></span>
<span style="width: 28px; height: 16px; border-radius: 3px; background: #F3F7FC; border: 1px solid #D9E1EC"></span>
<span style="width: 28px; height: 16px; border-radius: 3px; background: #FBDCC9"></span>
<span style="width: 28px; height: 16px; border-radius: 3px; background: #F2A27A"></span>
<span>sopra ritmo</span>

</div>
<div style="overflow-x: auto">
<div role="table" aria-label="Ritmo medio di consumo per settore e servizio" style="min-width: 900px; display: flex; flex-direction: column; gap: 4px; font-size: 13px">
<div role="row" style="display: grid; grid-template-columns: 150px repeat(9, minmax(0, 1fr)); gap: 4px; align-items: end">
<span role="columnheader" style="font-size: 12px; color: #4D5762; font-weight: 500; padding: 4px 8px">Settore</span>
<sc-for list="{{svcCols}}" as="c" hint-placeholder-count="9">
<span role="columnheader" style="font-size: 12px; color: #4D5762; font-weight: 500; padding: 4px; text-align: center; line-height: 1.3">{{c.name}}</span>
</sc-for>
</div>
<sc-for list="{{heat}}" as="row" hint-placeholder-count="5">
<div role="row" style="display: grid; grid-template-columns: 150px repeat(9, minmax(0, 1fr)); gap: 4px; align-items: stretch">
<span role="rowheader" style="font-weight: 600; padding: 0 8px; display: flex; align-items: center">{{row.name}}</span>
<sc-for list="{{row.cells}}" as="cell" hint-placeholder-count="9">
<a role="cell" href="postel-O2-portafoglio.html" style="height: 44px; display: flex; align-items: center; justify-content: center; border-radius: 6px; background: {{cell.bg}}; font-weight: {{cell.weight}}; color: #1A1C1E; text-decoration: none">{{cell.v}}</a>

</sc-for>
</div>
</div>
<p style="margin: 0; font-size: 13px; color: #4D5762">Clic su una cella: apre il portafoglio filtrato su quel settore e servizio. Lettura: oltre 1,20 i clienti esauriscono prima del rinnovo (opportunità di upgrade dell'offerta); sotto 0,60 la quantità configurata è sovradimensionata. Identificazioni Proprietarie è sotto ritmo in tutti i settori.</p>
</section>

</main>
</div>
</template>

      list.forEach(function (item, i) {

      if (name.indexOf('hint-') === 0) continue;
