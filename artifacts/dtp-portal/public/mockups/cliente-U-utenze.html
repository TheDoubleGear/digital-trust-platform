<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Utenze e deleghe – Portale cliente</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;family=IBM+Plex+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F3F7FC}
*{box-sizing:border-box}
a{color:#0047BB}a:hover{color:#003A99}
</style>
<link rel="stylesheet" href="dtp-theme.css">
<link rel="icon" type="image/svg+xml" href="../favicon.svg">
<link rel="stylesheet" href="dtp-auth.css">
<script src="dtp-auth.js"></script>
<script src="dtp-modifiche.js"></script>
<script src="dtp-subentro.js"></script>
</head>
<body>
<div id="app"></div>
<template id="tpl">

<div class="dtp-root" style="min-height: 100dvh; background: #F3F7FC; font-family: 'Inter', system-ui, sans-serif; color: #1A1C1E; font-variant-numeric: tabular-nums">

<div class="dtp-projectbar" style="background: #F2F8FF; color: #1A1C1E; border-bottom: 1px solid #D9E1EC">
<div style="max-width: 1360px; margin: 0 auto; padding: 8px 32px; display: flex; flex-wrap: wrap; align-items: center; gap: 12px">
<a class="dtp-home" href="../workspace" title="Torna a Workspace / 2026" data-testid="link-home">Home</a>
<span class="dtp-session"><span class="dtp-session-tag">Accesso demo</span><span class="dtp-session-who" data-testid="text-current-role"><span data-dtp-role></span></span><button class="dtp-logout" type="button" data-dtp-logout data-testid="button-logout">Esci</button></span>
</div>
</div>

<header class="dtp-header" style="background: #EEDC00; border-bottom: 1px solid #D6C600">
<div style="max-width: 1360px; margin: 0 auto; padding: 10px 32px; display: flex; flex-wrap: wrap; align-items: center; gap: 24px">
<div style="display: flex; align-items: center; gap: 10px">
<svg width="34" height="34" viewBox="0 0 34 34" aria-hidden="true"><rect width="34" height="34" rx="9" fill="#0047BB"></rect><path d="M17 7l8 3v6c0 5-3.4 8.6-8 10-4.6-1.4-8-5-8-10v-6z" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linejoin="round"></path><path d="M13 16.5l3 3 5-5.5" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg>
<div>
<div style="font-weight: 800; font-size: 21px; letter-spacing: -0.03em; line-height: 1.1; color: #0047BB">postel</div>
<div style="font-size: 12px; color: #33383D">Digital Trust Platform</div>
</div>
</div>
<nav aria-label="Pagine del portale" style="display: flex; flex-wrap: wrap; gap: 4px; flex: 1 1 420px">
<a class="dtp-navlink" href="cliente-H-catalogo.html" style="padding: 10px 16px; border-radius: 999px; font-size: 14px; font-weight: 500; text-decoration: none; color: #33383D">Catalogo e acquisti</a>
<a class="dtp-navlink" href="cliente-U-utenze.html" aria-current="page" style="padding: 10px 16px; border-radius: 999px; font-size: 14px; font-weight: 600; text-decoration: none; color: #FFFFFF; background: #0047BB">Utenze e deleghe</a>
<a class="dtp-navlink" href="cliente-M1-panoramica.html" style="padding: 10px 16px; border-radius: 999px; font-size: 14px; font-weight: 500; text-decoration: none; color: #33383D">Contratto e consumi</a>
<a class="dtp-navlink" href="cliente-A-assistenza.html" style="padding: 10px 16px; border-radius: 999px; font-size: 14px; font-weight: 500; text-decoration: none; color: #33383D">Assistenza</a>
</nav>
<a class="dtp-iconbtn" href="cliente-N-notifiche.html" aria-label="Notifiche, 3 non lette" style="position: relative; width: 44px; height: 44px; border-radius: 999px; border: 1px solid #FFFFFF; background: #FFFFFF; display: flex; align-items: center; justify-content: center">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1A1C1E" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.7 21a2 2 0 0 1-3.4 0"></path></svg>
<span style="position: absolute; top: 6px; right: 6px; min-width: 18px; height: 18px; border-radius: 9px; background: #C7322A; color: #FFFFFF; font-size: 11px; font-weight: 600; display: flex; align-items: center; justify-content: center; padding: 0 4px">3</span>
</a>
<div style="display: flex; align-items: center; gap: 10px">
<div aria-hidden="true" style="width: 36px; height: 36px; border-radius: 18px; background: #0047BB; color: #FFFFFF; font-size: 13px; font-weight: 600; display: flex; align-items: center; justify-content: center">{{who.ini}}</div>
<div style="line-height: 1.25">
<div style="font-size: 14px; font-weight: 600">{{who.name}}</div>
<div style="font-size: 12px; color: #33383D">{{who.role}} · Assicurazioni Aurora S.p.A.</div>
</div>
</div>
</div>
</header>

<main class="dtp-main" style="max-width: 1360px; margin: 0 auto; padding: 0 32px 48px; display: flex; flex-direction: column; gap: 22px">

<div class="dtp-hero dtp-hero-bleed" style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 12px">
<div>
<h1 style="margin: 0; font-size: 26px; font-weight: 600; letter-spacing: -0.01em">Utenze e deleghe</h1>
<p style="margin: 4px 0 0; font-size: 14px; color: #4D5762">Chi accede al portale per conto di Assicurazioni Aurora e con quali poteri</p>
</div>
<div style="display: flex; flex-wrap: wrap; gap: 10px">
<sc-if value="{{f.config}}" hint-placeholder-val="{{ true }}">
<a class="dtp-btn dtp-btn-o" href="#configurazione" style="min-height: 44px; padding: 0 20px; border-radius: 999px; border: 1px solid #B8C2CF; background: #FFFFFF; font-size: 14px; font-weight: 600; text-decoration: none; display: flex; align-items: center; gap: 8px">Configura servizi e journey <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17 17 7M8 7h9v9"></path></svg></a>
</sc-if>
<sc-if value="{{f.delegati}}" hint-placeholder-val="{{ true }}">
<button class="dtp-btn dtp-btn-p" type="button" onClick="{{openNomina}}" style="min-height: 44px; padding: 0 20px; border-radius: 999px; border: 0; background: #0047BB; color: #FFFFFF; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer">Nomina delegato</button>
</sc-if>
</div>
</div>

<sc-if value="{{f.hasNotice}}" hint-placeholder-val="{{ false }}">
<div role="note" style="display: flex; gap: 12px; align-items: center; padding: 12px 16px; border-radius: 6px; background: #E5EFFF; border: 1px solid #BFD6FA; font-size: 14px">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#0047BB" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"></circle><path d="M12 16v-4"></path><path d="M12 8h.01"></path></svg>
<span>{{notice}}</span>
</div>
</sc-if>

<section aria-label="Riepilogo" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 14px">
<sc-for list="{{kpis}}" as="k" hint-placeholder-count="4">
<div class="dtp-card" style="background: #FFFFFF; border: 1px solid #D9E1EC; border-radius: 6px; padding: 16px 18px; display: flex; flex-direction: column; gap: 4px">
<span style="font-size: 13px; color: #4D5762; font-weight: 500">{{k.label}}</span>
<span style="font-size: 26px; font-weight: 600; color: {{k.color}}">{{k.value}}</span>
<span style="font-size: 12px; color: #4D5762">{{k.sub}}</span>
</div>
</sc-for>
</section>

<section class="dtp-card" aria-labelledby="titolo-delegati" style="background: #FFFFFF; border: 1px solid #D9E1EC; border-radius: 6px; padding: 22px; display: flex; flex-direction: column; gap: 16px">
<div>
<h2 id="titolo-delegati" style="margin: 0; font-size: 18px; font-weight: 600">Legale rappresentante e delegati</h2>
<p style="margin: 4px 0 0; font-size: 13px; color: #4D5762">Il legale rappresentante ha tutte le funzioni del cliente e può affidarne una parte ai delegati</p>
</div>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 14px">
<div style="border: 2px solid #0047BB; background: #F2F8FF; border-radius: 6px; padding: 16px; display: flex; flex-direction: column; gap: 8px">
<span style="font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; color: #0047BB; font-weight: 700">Legale rappresentante</span>
<span style="font-size: 16px; font-weight: 600">Paolo Ferretti</span>
<span style="font-size: 13px; color: #4D5762">p.ferretti@aurora.example · firmatario del contratto</span>
<span style="font-size: 13px; color: #1A1C1E">Ha tutte le funzioni del cliente. Il cambio passa da Postel: l'utenza resta attiva finché la verifica della firma digitale e della visura camerale e l'approvazione di Postel non sono concluse.</span>
<sc-if value="{{sub.status}}" hint-placeholder-val="{{ false }}">
<div role="status" style="display: flex; flex-direction: column; gap: 4px; padding: 10px 12px; border-radius: 6px; background: #FFFFFF; border: 1px solid #BFD6FA; font-size: 13px">
<span><span style="display: inline-block; padding: 2px 8px; border-radius: 999px; background: {{sub.bg}}; color: {{sub.fg}}; font-size: 12px; font-weight: 600">{{sub.status}}</span></span>
<span style="color: #1A1C1E">{{sub.text}}</span>
<sc-if value="{{sub.code}}" hint-placeholder-val="{{ false }}">
<span style="color: #3A424C">Codice di invito da usare in V-03: <strong data-testid="text-invite-code" style="font-family: 'IBM Plex Mono', monospace; font-weight: 600; color: #1A1C1E">{{sub.code}}</strong> · <a href="{{sub.link}}" data-testid="link-invite-v03" style="font-weight: 600; text-decoration: none">Apri il percorso di subentro</a></span>
</sc-if>
</div>
</sc-if>
<sc-if value="{{sub.canStart}}" hint-placeholder-val="{{ true }}">
<div style="display: flex; flex-wrap: wrap; gap: 8px; padding-top: 6px">
<button class="dtp-btn dtp-btn-o" type="button" onClick="{{sub.toggle}}" aria-expanded="{{sub.open}}" data-testid="button-start-subentro" style="min-height: 40px; padding: 0 16px; border-radius: 999px; border: 1px solid #B8C2CF; background: #FFFFFF; font: inherit; font-size: 13px; font-weight: 600; color: #1A1C1E; cursor: pointer">Avvia cambio del legale rappresentante</button>
</div>
</sc-if>
<sc-if value="{{sub.open}}" hint-placeholder-val="{{ false }}">
<form aria-labelledby="titolo-subentro" style="border: 1px solid #BFD6FA; background: #FFFFFF; border-radius: 6px; padding: 14px; display: flex; flex-direction: column; gap: 10px">
<span id="titolo-subentro" style="font-size: 14px; font-weight: 600">Invita il nuovo legale rappresentante</span>
<label style="display: flex; flex-direction: column; gap: 4px; font-size: 13px; font-weight: 500">Nome<input id="sub-nome" type="text" autocomplete="off" style="min-height: 44px; padding: 0 12px; border-radius: 6px; border: 1px solid #B8C2CF; font: inherit; font-size: 14px; background: #FFFFFF"></label>
<label style="display: flex; flex-direction: column; gap: 4px; font-size: 13px; font-weight: 500">Cognome<input id="sub-cognome" type="text" autocomplete="off" style="min-height: 44px; padding: 0 12px; border-radius: 6px; border: 1px solid #B8C2CF; font: inherit; font-size: 14px; background: #FFFFFF"></label>
<label style="display: flex; flex-direction: column; gap: 4px; font-size: 13px; font-weight: 500">E-mail<input id="sub-email" type="email" autocomplete="off" style="min-height: 44px; padding: 0 12px; border-radius: 6px; border: 1px solid #B8C2CF; font: inherit; font-size: 14px; background: #FFFFFF"></label>
<span style="font-size: 12px; color: #3A424C">Il nuovo legale rappresentante riceve l'invito con il codice, completa il subentro nell'area pubblica e firma digitalmente la dichiarazione. I delegati restano attivi finché il nuovo legale rappresentante non decide diversamente.</span>
<sc-if value="{{sub.error}}" hint-placeholder-val="{{ false }}"><span role="alert" style="font-size: 13px; color: #A3201A">{{sub.error}}</span></sc-if>
<div style="display: flex; flex-wrap: wrap; gap: 8px">
<button class="dtp-btn dtp-btn-p" type="button" onClick="{{sub.send}}" data-testid="button-send-invite" style="min-height: 40px; padding: 0 16px; border-radius: 999px; border: 0; background: #0047BB; color: #FFFFFF; font: inherit; font-size: 13px; font-weight: 600; cursor: pointer">Invia l'invito</button>
<button class="dtp-btn dtp-btn-o" type="button" onClick="{{sub.toggle}}" style="min-height: 40px; padding: 0 16px; border-radius: 999px; border: 1px solid #B8C2CF; background: #FFFFFF; font: inherit; font-size: 13px; font-weight: 600; color: #1A1C1E; cursor: pointer">Annulla</button>
</div>
</form>
</sc-if>
</div>
<sc-for list="{{delegati}}" as="d" hint-placeholder-count="3">
<div style="border: 1px solid #D9E1EC; border-radius: 6px; padding: 16px; display: flex; flex-direction: column; gap: 8px">
<div style="display: flex; justify-content: space-between; gap: 8px; align-items: center">
<span style="font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; color: #4D5762; font-weight: 700">{{d.type}}</span>
<span style="padding: 2px 8px; border-radius: 999px; background: #E3F3EA; color: #1A6B4A; font-size: 12px; font-weight: 600">Attivo</span>
</div>
<span style="font-size: 16px; font-weight: 600">{{d.name}}</span>
<span style="font-size: 13px; color: #4D5762">{{d.email}} · nominato il {{d.since}} · ultimo accesso {{d.last}}</span>
<span style="font-size: 13px; color: #1A1C1E">{{d.scope}}</span>
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 8px 10px; border-radius: 6px; background: #F3F7FC; font-size: 12px; color: #3A424C">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#1A6B4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z M14 3v6h6 M9 15l2 2 4-4"></path></svg>
<span style="flex: 1 1 180px">{{d.act}}</span>
<a href="#atto" style="font-weight: 600; text-decoration: none; padding: 4px 0">Scarica l'atto</a>
</div>
<sc-if value="{{d.hasActions}}" hint-placeholder-val="{{ true }}">
<div style="display: flex; flex-wrap: wrap; gap: 8px; padding-top: 6px">
<sc-if value="{{d.canEdit}}" hint-placeholder-val="{{ true }}">
<button class="dtp-btn dtp-btn-o" type="button" onClick="{{d.openEdit}}" aria-expanded="{{d.editing}}" style="min-height: 40px; padding: 0 16px; border-radius: 999px; border: 1px solid #B8C2CF; background: #FFFFFF; font: inherit; font-size: 13px; font-weight: 600; color: #1A1C1E; cursor: pointer">Modifica poteri</button>
</sc-if>
<sc-if value="{{f.revoca}}" hint-placeholder-val="{{ true }}">
<button class="dtp-btn dtp-btn-o" type="button" style="min-height: 40px; padding: 0 16px; border-radius: 999px; border: 1px solid #B8C2CF; background: #FFFFFF; font: inherit; font-size: 13px; font-weight: 600; color: #1A1C1E; cursor: pointer">Sostituisci</button>
<button class="dtp-btn dtp-btn-o" type="button" style="min-height: 40px; padding: 0 16px; border-radius: 999px; border: 1px solid #F2BDB8; background: #FFFFFF; font: inherit; font-size: 13px; font-weight: 600; color: #A3201A; cursor: pointer">Revoca</button>
</sc-if>
</div>
</sc-if>
<sc-if value="{{d.readOnly}}" hint-placeholder-val="{{ false }}">
<span style="font-size: 12px; color: #4D5762; padding-top: 6px">Sola lettura: {{d.readOnly}}</span>
</sc-if>
<sc-if value="{{d.editing}}" hint-placeholder-val="{{ false }}">
<form aria-label="Modifica poteri di {{d.name}}" style="border: 1px solid #BFD6FA; background: #F7FAFF; border-radius: 6px; padding: 14px; display: flex; flex-direction: column; gap: 10px">
<span style="font-size: 14px; font-weight: 600">Modifica i poteri della delega</span>
<sc-for list="{{d.powers}}" as="pw" hint-placeholder-count="3">
<label style="display: flex; align-items: center; gap: 8px; min-height: 36px; font-size: 13px"><input type="checkbox" checked> {{pw}}</label>
</sc-for>
<span style="font-size: 12px; color: #3A424C">Firmatario dell'atto di modifica: {{who.name}} ({{who.roleLower}}). Chi firma l'atto: [DA DEFINIRE]</span>
<div style="display: flex; flex-wrap: wrap; gap: 8px">
<button class="dtp-btn dtp-btn-p" type="button" onClick="{{d.confirmEdit}}" style="min-height: 40px; padding: 0 16px; border-radius: 999px; border: 0; background: #0047BB; color: #FFFFFF; font: inherit; font-size: 13px; font-weight: 600; cursor: pointer">Genera l'atto e firma</button>
<button class="dtp-btn dtp-btn-o" type="button" onClick="{{closeEdit}}" style="min-height: 40px; padding: 0 16px; border-radius: 999px; border: 1px solid #B8C2CF; background: #FFFFFF; font: inherit; font-size: 13px; font-weight: 600; color: #1A1C1E; cursor: pointer">Annulla</button>
</div>
</form>
</sc-if>
</div>
</sc-for>
</div>

<sc-if value="{{nominaOpen}}" hint-placeholder-val="{{ false }}">
<form aria-labelledby="titolo-nomina" style="border: 1px solid #BFD6FA; background: #F7FAFF; border-radius: 6px; padding: 20px; display: flex; flex-direction: column; gap: 14px">
<h3 id="titolo-nomina" style="margin: 0; font-size: 16px; font-weight: 600">Nomina un delegato</h3>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px">
<label style="display: flex; flex-direction: column; gap: 4px; font-size: 13px; font-weight: 500">Nome<input id="nomina-nome" type="text" style="min-height: 44px; padding: 0 12px; border-radius: 6px; border: 1px solid #B8C2CF; font: inherit; font-size: 14px"></label>
<label style="display: flex; flex-direction: column; gap: 4px; font-size: 13px; font-weight: 500">Cognome<input id="nomina-cognome" type="text" style="min-height: 44px; padding: 0 12px; border-radius: 6px; border: 1px solid #B8C2CF; font: inherit; font-size: 14px"></label>
<label style="display: flex; flex-direction: column; gap: 4px; font-size: 13px; font-weight: 500">Email aziendale<input type="email" style="min-height: 44px; padding: 0 12px; border-radius: 6px; border: 1px solid #B8C2CF; font: inherit; font-size: 14px"></label>
<label style="display: flex; flex-direction: column; gap: 4px; font-size: 13px; font-weight: 500">Codice fiscale<input type="text" style="min-height: 44px; padding: 0 12px; border-radius: 6px; border: 1px solid #B8C2CF; font: inherit; font-size: 14px"></label>
</div>
<fieldset style="border: 0; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 10px">
<legend style="font-size: 13px; font-weight: 500; margin-bottom: 8px">Tipo di delega</legend>
<sc-for list="{{nominaTypes}}" as="t" hint-placeholder-count="3">
<label style="display: flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 14px; border: 1px solid #B8C2CF; border-radius: 6px; font-size: 14px; background: #FFFFFF"><input type="radio" name="delega" value="{{t.key}}" defaultChecked="{{t.first}}"> {{t.label}}</label>
</sc-for>
</fieldset>
<ol aria-label="Dopo la conferma" style="margin: 0; padding-left: 20px; font-size: 13px; color: #3A424C; line-height: 1.6">
<li>Generiamo l'atto di delega con i poteri del tipo scelto; lo firmi con firma elettronica avanzata. Firmatario dell'atto: {{who.name}} ({{who.roleLower}}). Chi firma l'atto quando nomina un delegato: [DA DEFINIRE]</li>
<li>Il delegato riceve l'invito, verifica la propria identità e firma l'accettazione.</li>
<li>L'atto firmato è conservato a norma e resta scaricabile da questa pagina; la delega si attiva all'accettazione.</li>
</ol>
<div style="display: flex; gap: 10px">
<button class="dtp-btn dtp-btn-p" type="button" onClick="{{confirmNomina}}" style="min-height: 44px; padding: 0 20px; border-radius: 999px; border: 0; background: #0047BB; color: #FFFFFF; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer">Genera l'atto e firma</button>
<button class="dtp-btn dtp-btn-o" type="button" onClick="{{closeNomina}}" style="min-height: 44px; padding: 0 20px; border-radius: 999px; border: 1px solid #B8C2CF; background: #FFFFFF; font: inherit; font-size: 14px; font-weight: 600; color: #1A1C1E; cursor: pointer">Annulla</button>
</div>
</form>
</sc-if>
</section>

<div style="display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-start">
<section class="dtp-card" aria-labelledby="titolo-poteri" style="flex: 999 1 560px; min-width: 0; background: #FFFFFF; border: 1px solid #D9E1EC; border-radius: 6px; padding: 22px; display: flex; flex-direction: column; gap: 14px">
<div>
<h2 id="titolo-poteri" style="margin: 0; font-size: 18px; font-weight: 600">Poteri per tipo di utenza</h2>
<p style="margin: 4px 0 0; font-size: 13px; color: #4D5762">Cosa può fare nel portale ciascuna utenza</p>
</div>
<div style="overflow-x: auto">
<div role="table" aria-label="Poteri per tipo di utenza" style="min-width: 640px; font-size: 13px">
<div role="row" style="display: grid; grid-template-columns: 2.6fr repeat(4, minmax(0, 1fr)); color: #4D5762; font-size: 12px; border-bottom: 1px solid #D9E1EC; text-align: center">
<span role="columnheader" style="padding: 10px; text-align: left">Funzione</span>
<span role="columnheader" style="padding: 10px">Legale rappr.</span>
<span role="columnheader" style="padding: 10px">Amministrativo</span>
<span role="columnheader" style="padding: 10px">Operativo</span>
<span role="columnheader" style="padding: 10px">Tecnico</span>
</div>
<sc-for list="{{powers}}" as="r" hint-placeholder-count="12">
<div role="row" style="display: grid; grid-template-columns: 2.6fr repeat(4, minmax(0, 1fr)); border-bottom: 1px solid #EAEFF5; text-align: center; align-items: center">
<span role="rowheader" style="padding: 10px; text-align: left; font-weight: 500">{{r.name}}</span>
<span role="cell" style="padding: 10px; font-weight: 700; color: {{r.c1}}">{{r.v1}}</span>

<script>
/* Mini runtime per le pagine esportate: template {{ }}, sc-for, sc-if, onClick, setState. */
(function () {
  var _tl = Number.prototype.toLocaleString;
  Number.prototype.toLocaleString = function (loc, opt) {
    if (loc === 'it-IT') opt = Object.assign({ useGrouping: 'always' }, opt || {});
    try { return _tl.call(this, loc, opt); } catch (e) { return _tl.call(this, loc); }
  };
  var HOLE = /\{\{\s*([^}]+?)\s*\}\}/g, FULL = /^\{\{\s*([^}]+?)\s*\}\}$/;
  function lookup(path, scope) {
    path = path.trim();
    if (path === 'true') return true; if (path === 'false') return false;
    if (/^-?\d+(\.\d+)?$/.test(path)) return Number(path);
    var parts = path.split('.'), v = scope;
    for (var i = 0; i < parts.length; i++) { if (v == null) return undefined; v = v[parts[i]]; }
    return v;
  }
  function interp(str, scope) {
    return str.replace(HOLE, function (_, p) { var v = lookup(p, scope); return v == null ? '' : String(v); });
  }
  function renderChildren(src, dst, scope) {
    for (var c = src.firstChild; c; c = c.nextSibling) renderNode(c, dst, scope);
  }
  function renderNode(node, dst, scope) {
    if (node.nodeType === 3) { dst.appendChild(document.createTextNode(interp(node.nodeValue, scope))); return; }
    if (node.nodeType !== 1) return;
    var tag = node.localName;
    if (tag === 'sc-for') {
      var list = lookup((node.getAttribute('list') || '').replace(/^\{\{|\}\}$/g, ''), scope) || [];
      var as = node.getAttribute('as') || 'item';
      list.forEach(function (item, i) {
        var s = Object.create(scope); s[as] = item; s.$index = i;
        renderChildren(node, dst, s);
      });
      return;
    }
    if (tag === 'sc-if') {
      var val = lookup((node.getAttribute('value') || '').replace(/^\{\{|\}\}$/g, ''), scope);
      if (val) renderChildren(node, dst, scope);
      return;
    }
    var el = node.namespaceURI === 'http://www.w3.org/2000/svg'
      ? document.createElementNS(node.namespaceURI, node.localName) : document.createElement(node.localName);
    for (var a = 0; a < node.attributes.length; a++) {
      var at = node.attributes[a], name = at.name, raw = at.value;
      if (name.indexOf('hint-') === 0) continue;
      var m = raw.match(FULL);
      if (m) {
        var v = lookup(m[1], scope);
        if (name.indexOf('on') === 0 && typeof v === 'function') { el.addEventListener(name.slice(2), v); continue; }
        if (name === 'defaultchecked' || name === 'checked') { if (v) { el.setAttribute('checked', ''); el.checked = true; } continue; }
        if (name === 'defaultvalue') { el.setAttribute('value', v == null ? '' : String(v)); continue; }
        if (v == null || v === false && name.indexOf('aria-') !== 0) continue;
        el.setAttribute(name, String(v));
      } else if (name === 'defaultvalue') { el.setAttribute('value', raw);
      } else if (name === 'defaultchecked') { el.setAttribute('checked', '');
      } else { el.setAttribute(name, interp(raw, scope)); }
    }
    renderChildren(node.localName === 'template' ? node.content : node, el, scope);
    dst.appendChild(el);
  }
  function DCLogic(props) { this.props = props || {}; this.state = null; }
  DCLogic.prototype.setState = function (o) {
    this.state = Object.assign({}, this.state || {}, o);
    this.__render();
  };
  DCLogic.prototype.forceUpdate = function () { this.__render(); };
  window.DCLogic = DCLogic;
  window.DC = {
    mount: function (Comp, meta) {
      var props = {};
      Object.keys(meta).forEach(function (k) { if (k[0] !== '$' && meta[k] && 'default' in meta[k]) props[k] = meta[k]['default']; });
      /* Sessione demo: il ruolo arriva da DTPAuth; senza permesso la pagina non viene disegnata. */
      var auth = window.DTPAuth, access = auth ? auth.enter(meta) : null;
      if (!access) return;
      if (meta.persona && meta.persona.options) props.persona = access.role;
      var tpl = document.getElementById('tpl').content, root = document.getElementById('app');
      var c = new Comp(props);
      c.__render = function () {
        var frag = document.createDocumentFragment();
        renderChildren(tpl, frag, c.renderVals());
        root.replaceChildren(frag);
        auth.decorate(root);
      };
      c.__render();
    }
  };
})();

<script>

class Component extends DCLogic {
  renderVals() {
    var self = this;
    var st = this.state || {};
    var P = this.props.persona;
    var set = function (o) { self.setState(o); };
    var WHO = {
      lr: { name: 'Paolo Ferretti', role: 'Legale rappresentante', roleLower: 'legale rappresentante', ini: 'PF' },
      amm: { name: 'Giulia Marchetti', role: 'Delegato amministrativo', roleLower: 'delegato amministrativo', ini: 'GM' },
      op: { name: 'Davide Sala', role: 'Delegato operativo', roleLower: 'delegato operativo', ini: 'DS' }
    };
    /* Deleghe gerarchiche: il LR nomina e modifica i poteri di tutti i delegati, il delegato amministrativo
       dei soli delegati operativo e tecnico, il delegato operativo del solo delegato tecnico.
       Sostituzione e revoca restano al legale rappresentante. */
    var TYPES = {
      amm: { label: 'Amministrativa: acquisti, soglie, fatture', short: 'amministrativa', delegate: 'Delegato amministrativo' },
      op: { label: 'Operativa: servizi e journey', short: 'operativa', delegate: 'Delegato operativo' },
      tec: { label: 'Tecnica: developer portal', short: 'tecnica', delegate: 'Delegato tecnico' }
    };
    var CAN = { lr: ['amm', 'op', 'tec'], amm: ['op', 'tec'], op: ['tec'] };
    var allowed = CAN[P] || [];
    var f = { delegati: allowed.length > 0, revoca: P === 'lr', config: P !== 'amm', hasNotice: P !== 'lr' };
    var notice = P === 'amm'
      ? 'Puoi nominare i delegati operativo e tecnico e modificarne i poteri. La sostituzione e la revoca dei delegati spettano al legale rappresentante.'
      : 'Puoi nominare il delegato tecnico e modificarne i poteri. La sostituzione e la revoca dei delegati spettano al legale rappresentante. Da qui puoi accedere alla configurazione di servizi e journey.';
    var MOD = window.DTPModifiche, SUB = window.DTPSubentro;
    var done = st.done || [];
    /* U-02: cambio del legale rappresentante, avviato dal legale rappresentante o dal delegato amministrativo (dtp-subentro.js).
       Invito dimostrativo con il codice da usare in V-03; l'utenza attuale resta attiva fino all'approvazione di Postel. */
    var subState = SUB.state(), inv = SUB.getInvite(), req = SUB.getRequest();
    var subBusy = subState === 'invited' || subState === 'verify';
    var subText = '';
    if (subState === 'invited') subText = 'Invito inviato a ' + inv.nome + ' ' + inv.cognome + ' (' + inv.email + ') da ' + SUB.PEOPLE[inv.by].name + ' il ' + SUB.full(inv.at) + '. In attesa della richiesta di subentro.';
    if (subState === 'verify') subText = 'Richiesta di subentro di ' + req.nome + ' ' + req.cognome + ' inviata il ' + SUB.full(req.at) + ': firma digitale e visura camerale verificate, in attesa dell’approvazione di Postel.';
    if (subState === 'done') subText = 'Subentro di ' + req.nome + ' ' + req.cognome + ' approvato da Postel il ' + SUB.full(req.approved.at) + '. Nel prototipo i dati di esempio del portale restano invariati.';
    var sub = {
      canStart: SUB.canStart(P) && !subBusy, open: SUB.canStart(P) && !subBusy && !!st.subOpen, error: st.subError || '',
      status: subState ? SUB.STATES[subState].label : '', bg: subState ? SUB.STATES[subState].bg : '', fg: subState ? SUB.STATES[subState].fg : '', text: subText,
      code: subState === 'invited' ? inv.code : '', link: subState === 'invited' ? 'vetrina-V03-subentro.html?invito=' + inv.code : '',
      toggle: function () { set({ subOpen: !st.subOpen, subError: '', nomina: false, editing: null }); },
      send: function () {
        var val = function (id) { var el = document.getElementById(id); return el ? el.value.trim() : ''; };
        var r = SUB.invite(P, { nome: val('sub-nome'), cognome: val('sub-cognome'), email: val('sub-email') });
        set(r ? { subOpen: false, subError: '' } : { subError: 'Inserisci nome, cognome e un indirizzo e-mail valido.' });
      }
    };
    var kpis = [
      { label: 'Utenze del portale', value: '4', sub: 'legale rappresentante e 3 delegati', color: '#1A1C1E' },
      { label: 'Deleghe attive', value: '3 di 3', sub: 'amministrativa, operativa, tecnica', color: '#1A6B4A' },
      { label: 'Inviti in attesa', value: String(done.filter(function (e) { return e.kind === 'nomina'; }).length), sub: done.some(function (e) { return e.kind === 'nomina'; }) ? 'in attesa dell’accettazione del delegato' : 'nessun delegato da attivare', color: '#1A1C1E' },
      { label: 'Ultima variazione', value: done.length ? MOD.when(done[done.length - 1].ts) : '10 mar 2026', sub: done.length ? done[done.length - 1].what : 'nomina del delegato tecnico', color: '#1A1C1E' }
    ];
    var POWERS = {
      amm: ['Comporre e avviare upgrade e modifiche dell’offerta', 'Firmare rinnovi e modifiche approvate', 'Gestire soglie e destinatari delle notifiche', 'Consultare e pagare le fatture', 'Nominare e modificare i poteri dei delegati operativo e tecnico'],
      op: ['Configurare servizi e journey', 'Consultare consumi in quantità', 'Nominare e modificare i poteri del delegato tecnico'],
      tec: ['Integrare API, SDK e componenti white label', 'Consultare consumi in quantità']
    };
    var lastEdit = function (key) {
      var e = done.filter(function (x) { return x.kind === 'poteri' && x.key === key; }).pop();
      return e ? ' · atto di modifica dei poteri firmato da ' + e.who + ' ' + MOD.when(e.ts) + ' · chi firma l’atto: [DA DEFINIRE]' : '';
    };
    var delegati = [
      { key: 'amm', name: 'Giulia Marchetti', email: 'g.marchetti@aurora.example', since: '2 mar 2026', last: 'oggi', scope: 'Acquisti, soglie, consumi, fatture e pagamenti; avvio delle modifiche dell’offerta e firma dell’atto dopo la tua approvazione; nomina e modifica dei poteri dei delegati operativo e tecnico.', act: 'Atto di delega firmato da Paolo Ferretti il 2 mar 2026, accettato il 2 mar · conservato' },
      { key: 'op', name: 'Davide Sala', email: 'd.sala@aurora.example', since: '2 mar 2026', last: 'ieri', scope: 'Configurazione di servizi e journey; consumi in quantità; nomina e modifica dei poteri del delegato tecnico.', act: 'Atto di delega firmato da Paolo Ferretti il 2 mar 2026, accettato il 3 mar · conservato' },
      { key: 'tec', name: 'Andrea Colombo', email: 'a.colombo@aurora.example', since: '10 mar 2026', last: 'oggi', scope: 'Developer portal (API, SDK, sandbox, collaudo); consumi in quantità.', act: 'Atto di delega firmato da Paolo Ferretti il 10 mar 2026, accettato il 11 mar · conservato' }
    ].map(function (d) {
      var canEdit = allowed.indexOf(d.key) >= 0, editing = canEdit && st.editing === d.key;
      d.type = TYPES[d.key].delegate;
      d.act += lastEdit(d.key);
      d.canEdit = canEdit; d.editing = editing; d.hasActions = canEdit || P === 'lr';
      d.readOnly = canEdit ? '' : 'la nomina e la modifica dei poteri di questa delega non rientrano nei tuoi poteri';
      d.powers = POWERS[d.key];
      d.openEdit = function () { set({ editing: editing ? null : d.key, nomina: false }); };
      d.confirmEdit = function () {
        set({ editing: null, done: done.concat([{ ts: Date.now(), kind: 'poteri', key: d.key, who: WHO[P].name,
          what: 'ha modificato i poteri della delega ' + TYPES[d.key].short + ' di ' + d.name + ' e firmato l’atto di modifica' }]) });
      };
      return d;
    });
    var nominaTypes = allowed.map(function (k, i) { return { key: k, label: TYPES[k].label, first: i === 0 }; });
    var confirmNomina = function () {
      var val = function (id) { var el = document.getElementById(id); return el ? el.value.trim() : ''; };
      var sel = document.querySelector('input[name="delega"]:checked');
      var key = sel && allowed.indexOf(sel.value) >= 0 ? sel.value : allowed[0];
      var name = (val('nomina-nome') + ' ' + val('nomina-cognome')).trim() || 'un nuovo delegato';
      set({ nomina: false, done: done.concat([{ ts: Date.now(), kind: 'nomina', key: key, who: WHO[P].name,
        what: 'ha nominato ' + name + ' delegato ' + TYPES[key].short.replace(/a$/, 'o') + ' e firmato l’atto di delega' }]) });
    };
    var Y = ['✓', '#1A6B4A'], N = ['—', '#9AA6B8'];
    var powers = [
      ['Firmare il primo contratto', Y, N, N, N],
      ['Nominare e modificare i poteri dei delegati', ['tutti', '#1A6B4A'], ['operativo e tecnico', '#1A6B4A'], ['tecnico', '#1A6B4A'], N],
      ['Sostituire e revocare i delegati', Y, N, N, N],
      ['Approvare o rifiutare le modifiche dell’offerta (evidenza conservata)', Y, N, N, N],
      ['Firmare rinnovi e modifiche approvate', Y, Y, N, N],
      ['Comporre e avviare upgrade e modifiche dell’offerta', Y, Y, N, N],
      ['Gestire soglie e destinatari delle notifiche', Y, Y, N, N],
      ['Consultare consumi e previsioni', Y, Y, Y, Y],
      ['Consultare e pagare le fatture', Y, Y, N, N],
      ['Configurare servizi e journey', Y, N, Y, N],
      ['Integrare API, SDK e componenti white label', Y, N, N, Y],
      ['Aprire richieste di assistenza', Y, Y, Y, Y]
    ].map(function (r) { return { name: r[0], v1: r[1][0], c1: r[1][1], v2: r[2][0], c2: r[2][1], v3: r[3][0], c3: r[3][1], v4: r[4][0], c4: r[4][1] }; });
    /* Registro: avvio, approvazione o rifiuto, firma e verifica automatica delle modifiche dell'offerta (dtp-modifiche.js),
       avvio, richiesta e approvazione del cambio del legale rappresentante (dtp-subentro.js), insieme alle altre attività dell'azienda, dal più recente. */
    var at = function (y, mo, d, h, m) { return new Date(y, mo - 1, d, h, m).getTime(); };
    var log = MOD.events().map(function (e) {
      return { ts: e.ts, who: MOD.PEOPLE[e.by].name, what: e.text, when: MOD.when(e.ts) };
    }).concat(SUB.events().map(function (e) { e.when = MOD.when(e.ts); return e; }), [
      { ts: at(2026, 10, 24, 11, 30), who: 'Giulia Marchetti', what: 'ha avviato l’upgrade di 500 Nuovi Certificati FEA' },
      { ts: at(2026, 10, 15, 9, 47), who: 'Giulia Marchetti', what: 'ha modificato la soglia di attenzione di Apposizioni FEA con COD' },
      { ts: at(2026, 10, 9, 16, 5), who: 'Davide Sala', what: 'ha aggiornato il journey di onboarding del canale app' },
      { ts: at(2026, 10, 1, 8, 50), who: 'Giulia Marchetti', what: 'ha esportato il report mensile dei consumi' },
      { ts: at(2026, 3, 11, 9, 2), who: 'Andrea Colombo', what: 'ha firmato l’accettazione della delega tecnica' },
      { ts: at(2026, 3, 10, 10, 15), who: 'Paolo Ferretti', what: 'ha firmato l’atto di delega tecnica per Andrea Colombo' },
      { ts: at(2026, 3, 2, 12, 0), who: 'Paolo Ferretti', what: 'ha nominato Giulia Marchetti e Davide Sala delegati' }
    ].concat(done.map(function (e) { return { ts: e.ts, who: e.who, what: e.what }; })).map(function (l) { l.when = MOD.when(l.ts); return l; })).sort(function (x, y) { return y.ts - x.ts; });
    return {
      who: WHO[P], f: f, sub: sub, notice: notice, kpis: kpis, delegati: delegati, powers: powers, log: log, nominaTypes: nominaTypes,
      nominaOpen: !!st.nomina && f.delegati, openNomina: function () { set({ nomina: true, editing: null, subOpen: false }); }, closeNomina: function () { set({ nomina: false }); },
      confirmNomina: confirmNomina, closeEdit: function () { set({ editing: null }); }
    };
  }
}

DC.mount(Component, {"persona": {"editor": "enum", "options": ["lr", "amm", "op"], "default": "lr"}, "$preview": {"width": 1440, "height": 1750}});
</script>
